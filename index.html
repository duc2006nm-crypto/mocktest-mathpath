<!DOCTYPE html>
<html lang="vi">
<head>
<!--
  ================ CANH BAO - KHONG XOA / KHONG CAT FILE NAY ================
  File nay (index.html) la TOAN BO ung dung MockTest: du lieu de thi + logic app
  (DB.load/seed/migrate, render, cham diem...) nam chung trong 1 file HTML lon.
  File PHAI ket thuc dung bang:  </script>\n</body>\n</html>\n
  Neu file bi CAT CUT giua chung (vi du: tien trinh ghi bi kill/timeout khi dang
  ghi de ca file), phan logic app (function seed/migrate...) o CUOI script se mat
  het du gia tri du lieu cau hoi van con - app se KHONG chay duoc.
  QUY TAC AN TOAN khi sua file nay bang script (xem tools/exam_pack_builder.py):
   1) LUON tao ban sao du phong (index.html.autobak-YYYYMMDD-HHMMSS) TRUOC khi
      ghi de - da tu dong hoa trong build_and_splice()/splice_into_html().
   2) LUON ghi TUNG GOI/TUNG DE MOT (khong lap nhieu de trong 1 lan ghi) khi file
      da lon (>20-30MB) tren o mang/o dong bo - moi lan ghi ca file co the mat
      30-40s+ va de bi timeout neu gop nhieu thao tac.
   3) SAU khi ghi, doc lai file va kiem tra dung bat dau bang <!DOCTYPE html> va
      ket thuc bang </html> - da tu dong hoa, se bao loi ngay neu ghi bi cat cut.
   4) Neu thay bao loi ghi/kiem tra that bai: DUNG NGAY, khoi phuc tu ban
      .autobak-* moi nhat (cung thu muc), KHONG ghi tiep de tranh chong lan hong.
   5) Cac ban .autobak-*/.bak-* trong thu muc nay la LICH SU KHOI PHUC - KHONG xoa.
  ============================================================================
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MockTest - Luyện thi thử trực tuyến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<!-- Firebase (Cloud DB) - CHI dung de dong bo de thi, khong bat buoc: neu chua cau hinh FIREBASE_CONFIG
     ben duoi, toan bo app van chay binh thuong 100% nhu truoc (chi luu tren may, khong dong bo). -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
  :root{
    --primary:#EE4035; --primary-dark:#C62F27; --primary-light:#FFF1EE;
    --secondary:#2EA8E0; --secondary-dark:#1E86B8; --secondary-light:#E8F6FD;
    --accent-yellow:#FFC93C; --accent-yellow-dark:#DFA400; --accent-yellow-light:#FFF6DE;
    --accent-green:#3FBF83;
    --danger:#E5484D; --danger-light:#FFEBEC;
    --success:#2FB380; --success-light:#E7F8F1;
    --warn:#F5A524; --warn-light:#FFF6E5;
    --gray:#7C8698; --gray-light:#F3F5FA;
    --border:#E7EAF3; --text:#22283A; --text-muted:#70788F;
    --sidebar-bg:#1B2340; --sidebar-hover:#2A3560;
    --radius-card:22px; --radius-input:16px; --radius-pill:999px;
    --shadow-soft:0 10px 26px rgba(34,40,58,.07);
    --shadow-pop:0 16px 36px rgba(238,64,53,.20);
    --font-heading:'Baloo 2','Quicksand',ui-sans-serif,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Quicksand',ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#FBFBFE;color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased;}
  #app{min-height:100vh;}
  a{color:var(--primary);text-decoration:none;cursor:pointer;}
  h1,h2,h3,h4{margin:0 0 8px 0;font-weight:700;letter-spacing:-0.2px;font-family:var(--font-heading);}
  .hidden{display:none !important;}
  ::selection{background:var(--accent-yellow);color:var(--text);}
  body.role-student .qtext{font-size:17.5px;}
  body.role-student .choice-row{font-size:16px;padding:12px 16px;}
  body.role-student .category-card .name{font-size:16.5px;}
  body.role-student .timer-box{font-size:20px;}

  /* ---- Layout ---- */
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fdf1ee,#fce4e1);}
  .shell{display:flex;min-height:100vh;}
  .shell-focus .main{max-width:1000px;margin:0 auto;width:100%;}
  /* Chế độ làm bài: thu nhỏ chữ để bao quát được nhiều câu hỏi hơn trên màn hình cùng lúc. */
  .shell-focus .topbar h2{font-size:16.5px;}
  .shell-focus .topbar .sub{font-size:12px;}
  .shell-focus .qcard{padding:10px 12px;margin-bottom:9px;}
  .shell-focus .qcard .qmeta{margin-bottom:5px;gap:4px;}
  .shell-focus .qcard .qtext{font-size:13.5px;margin-bottom:6px;}
  .shell-focus .choice-row{font-size:12.5px;padding:7px 10px;margin-bottom:4px;}
  .shell-focus .tag-pill{font-size:10px;padding:1px 6px;}
  .shell-focus .exam-nav{width:168px;}
  .shell-focus .exam-nav h4{font-size:12.5px;margin-bottom:8px;}
  .shell-focus .qnav-grid{gap:5px;}
  .shell-focus .qnav-btn{font-size:11px;padding:6px 0;border-radius:6px;}
  .shell-focus .listen-box{font-size:12px;}
  .shell-focus .timer-box{font-size:14px;padding:6px 12px;}
  body.role-student .shell-focus .qtext{font-size:13.5px;}
  body.role-student .shell-focus .choice-row{font-size:12.5px;padding:7px 10px;}
  /* 3 nut noi (backup/cloud) chi danh cho Giao vien/Admin - an het khi dang nhap
     hoc sinh hoac chua dang nhap (man hinh login). */
  body:not(.role-teacher) #restoreBackupBtn,
  body:not(.role-teacher) #migrateImagesCloudBtn,
  body:not(.role-teacher) #migrateAudioCloudBtn,
  body:not(.role-teacher) #publishToGithubBtn,
  body:not(.role-teacher) #githubSettingsBtn{display:none !important;}
  .sidebar{width:250px;background:var(--sidebar-bg);color:#e2e8f0;display:flex;flex-direction:column;flex-shrink:0;}
  .sidebar .brand{padding:22px 18px;font-size:19px;font-weight:700;color:#fff;border-bottom:1px solid #1e293b;}
  .sidebar .brand small{display:block;font-size:11px;font-weight:500;color:#94a3b8;margin-top:4px;line-height:1.5;}
  .sidebar nav{flex:1;padding:10px;}
  .sidebar nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#cbd5e1;margin-bottom:3px;font-size:13.5px;font-weight:600;}
  .sidebar nav a:hover{background:var(--sidebar-hover);color:#fff;}
  .sidebar nav a.active{background:var(--primary);color:#fff;}
  .sidebar .userbox{padding:14px 16px;border-top:1px solid #1e293b;font-size:13px;}
  .sidebar .userbox .name{color:#fff;font-weight:700;}
  .sidebar .userbox .role{color:#94a3b8;font-size:11.5px;margin-bottom:8px;}
  .main{flex:1;padding:26px 32px;overflow-y:auto;max-height:100vh;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .topbar h2{font-size:22px;}
  .topbar .sub{color:var(--text-muted);font-size:13px;margin-top:2px;}

  /* ---- Components ---- */
  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:20px;margin-bottom:18px;}
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr;}}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;}
  .stat-card .num{font-size:26px;font-weight:700;color:var(--primary);}
  .stat-card .label{color:var(--text-muted);font-size:12.5px;margin-top:2px;}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:14px;border:1px solid transparent;font-size:14px;font-weight:700;cursor:pointer;background:var(--gray-light);color:var(--text);font-family:inherit;transition:transform .1s ease,filter .1s ease,box-shadow .1s ease;}
  .btn:hover{filter:brightness(0.97);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(238,64,53,.25);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-danger{background:var(--danger-light);color:var(--danger);}
  .btn-success{background:var(--success-light);color:var(--success);}
  .btn-outline{background:#fff;border:1px solid var(--border);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .btn-block{width:100%;justify-content:center;}
  .btn-pill{border-radius:var(--radius-pill);padding:14px 30px;font-size:16px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;}
  body.role-student .btn-pill{padding:16px 32px;font-size:17px;}
  body.role-student .btn{font-size:15px;padding:11px 18px;}

  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .badge-green{background:var(--success-light);color:var(--success);}
  .badge-yellow{background:var(--warn-light);color:var(--warn);}
  .badge-gray{background:var(--gray-light);color:var(--gray);}
  .badge-red{background:var(--danger-light);color:var(--danger);}
  .badge-blue{background:var(--primary-light);color:var(--primary-dark);}

  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:top;}
  th{color:var(--text-muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}

  label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:5px;margin-top:12px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=password],input[type=number],input[type=datetime-local],select,textarea{
    width:100%;padding:10px 12px;border:1.5px solid transparent;border-radius:var(--radius-input);font-size:13.5px;font-family:inherit;background:#F1F5F9;color:var(--text);
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:#fff;}
  .form-row{display:flex;gap:12px;}
  .form-row > div{flex:1;}
  .hint{font-size:11.5px;color:var(--text-muted);margin-top:4px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:400;}
  .checkbox-row input{width:auto;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
  .toolbar > div{min-width:140px;}
  .tag-pill{display:inline-block;background:var(--gray-light);border-radius:6px;padding:2px 8px;font-size:11.5px;margin-right:4px;}

  .app-toast{position:fixed;top:18px;right:18px;z-index:200;background:#0f172a;color:#fff;padding:13px 20px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:360px;animation:toastIn .25s ease-out;}
  .app-toast-success{background:var(--success,#16a34a);}
  .app-toast-error{background:var(--danger,#dc2626);}
  .app-toast-info{background:#334155;}
  @keyframes toastIn{from{transform:translateY(-10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .banner-pop{animation:bannerPop .5s ease-out;}
  @keyframes bannerPop{0%{transform:scale(.97);box-shadow:0 0 0 0 rgba(22,163,74,.5);}60%{transform:scale(1.01);box-shadow:0 0 0 10px rgba(22,163,74,0);}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(22,163,74,0);}}
  .signup-cta{margin-top:14px;padding:12px;border-radius:12px;background:var(--primary-light);text-align:center;font-size:13px;}
  .listen-box{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px 12px;margin:8px 0 12px;}
  .listen-box .hint{margin:0;}
  .signup-cta a{cursor:pointer;color:var(--secondary-dark);font-weight:700;text-decoration:underline;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;z-index:100;}
  .modal-box{background:#fff;border-radius:var(--radius-card);max-width:640px;width:100%;padding:24px;margin-top:10px;}
  .modal-box h3{margin-bottom:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  .login-card{background:#fff;border-radius:24px;padding:38px 36px;width:400px;box-shadow:0 20px 50px rgba(221,48,45,.15);}
  .login-card h1{font-size:26px;color:var(--text);}
  .login-card .sub{color:var(--text-muted);font-size:13px;margin-bottom:20px;line-height:1.5;}
  .role-tabs{display:flex;background:var(--gray-light);border-radius:999px;padding:4px;margin-bottom:18px;}
  .role-tabs button{flex:1;padding:9px;border:none;background:transparent;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;color:var(--text-muted);font-family:inherit;}
  .role-tabs button.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.15);}
  .login-error{background:var(--danger-light);color:var(--danger);padding:8px 12px;border-radius:12px;font-size:12.5px;margin-top:12px;}
  .demo-note{background:var(--primary-light);color:var(--primary-dark);font-size:11.5px;padding:10px 12px;border-radius:12px;margin-top:16px;line-height:1.6;}

  .qcard{border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:12px;}
  .qcard .qmeta{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .qcard .qtext{font-weight:700;margin-bottom:8px;white-space:pre-wrap;}
  .choice-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:6px;}
  .choice-row.correct{border-color:var(--success);background:var(--success-light);}
  .choice-row.wrong-picked{border-color:var(--danger);background:var(--danger-light);}
  /* Cau MC ma CA 3 phuong an deu la hinh anh (VD: Listening Part 1 kieu Cambridge) — xep ngang
     thanh 1 hang thay vi xep doc tung phuong an full-width (gay khoang trong lon 2 ben). */
  .choice-img-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;align-items:stretch;}
  .choice-img-grid .choice-row{flex:1 1 150px;max-width:220px;flex-direction:column;text-align:center;margin-bottom:0;gap:4px;}
  /* Ep tat ca anh trong 1 hang ve CUNG 1 khung kich thuoc (khong phu thuoc ty le SVG goc khac
     nhau), dung object-fit:contain de anh khong bi meo, tranh tinh trang anh nay cao/to hon anh
     kia lam hang bi lech. */
  .choice-img-grid .choice-row .choice-img{width:120px;height:100px;max-width:120px;max-height:100px;object-fit:contain;margin:4px auto 0;background:#fff;}
  @media(max-width:700px){.choice-img-grid .choice-row{flex:1 1 100px;}.choice-img-grid .choice-row .choice-img{width:90px;height:80px;}}

  .timer-box{background:#fff;border:2px solid var(--primary);color:var(--primary-dark);border-radius:14px;padding:8px 18px;font-weight:700;font-size:18px;}
  .timer-box.low{border-color:var(--danger);color:var(--danger);}
  .exam-layout{display:flex;gap:20px;align-items:flex-start;}
  .exam-nav{width:210px;flex-shrink:0;position:sticky;top:0;}
  .qnav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .qnav-btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .qnav-btn.answered{background:var(--success-light);border-color:var(--success);color:var(--success);}
  .qnav-btn.current{outline:2px solid var(--primary);}
  .exam-main{flex:1;min-width:0;}

  .category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;}
  .category-card{border-radius:18px;padding:18px;cursor:pointer;border:2px solid var(--border);background:#fff;transition:transform .12s,box-shadow .12s;}
  .category-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08);}
  .category-card .icon{font-size:34px;margin-bottom:8px;line-height:1;}
  .category-card .name{font-weight:700;font-size:15px;margin-bottom:2px;}
  .category-card .count{font-size:12px;color:var(--text-muted);font-weight:600;}
  .category-card.mini{padding:12px;}
  .category-card.mini .icon{font-size:24px;margin-bottom:4px;}
  .category-card.mini .name{font-size:12.5px;}
  .category-card.mini .count{font-size:11px;}

  .practice-test-card{border:1px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .practice-test-card .info b{font-size:15px;}
  .kbd{background:#e2e8f0;border-radius:4px;padding:1px 6px;font-size:11px;font-family:monospace;}

  .import-row{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  .import-row.excluded{opacity:.45;}
  .import-row .row-top{display:flex;align-items:flex-start;gap:10px;}
  .import-row .row-num{font-weight:700;color:var(--text-muted);font-size:12.5px;min-width:26px;padding-top:10px;}
  .import-row .row-body{flex:1;}
  .import-choice-line{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .import-choice-line input[type=text]{flex:1;}
  .import-warning{background:var(--warn-light);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:12.5px;margin-bottom:12px;}
  .import-dropzone{border:2px dashed var(--border);border-radius:16px;padding:26px;text-align:center;color:var(--text-muted);font-size:13px;background:#F8FAFC;}
  .import-dropzone.dragover{border-color:var(--primary);background:var(--primary-light);}
  .import-dropzone{cursor:pointer;}
  .import-dropzone:hover{border-color:var(--secondary);}
  .q-images{margin:8px 0;display:flex;flex-wrap:wrap;gap:10px;}
  .q-images img{max-width:100%;max-height:240px;border-radius:12px;border:1px solid var(--border);display:block;}
  .choice-img{max-width:140px;max-height:110px;display:block;margin-top:6px;border-radius:8px;border:1px solid var(--border);}
  .review-img-zone{margin:8px 0;border:2px dashed var(--border);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;cursor:pointer;background:#F8FAFC;}
  .review-img-zone.dragover{border-color:var(--primary);background:var(--primary-light);}
  .review-img-zone:hover{border-color:var(--secondary);}
  .review-img-thumb{position:relative;display:inline-block;}
  .review-img-thumb img{max-width:90px;max-height:70px;border-radius:8px;border:1px solid var(--border);display:block;}
  .review-img-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:11px;line-height:20px;padding:0;cursor:pointer;}
  .review-img-add{font-size:12px;color:var(--text-muted);padding:6px;}

  /* ---- Kid-friendly extras: speak button, celebration, gamification, responsive ---- */
  @keyframes popIn{0%{transform:scale(.85);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(220px) rotate(360deg);opacity:0;}}

  .speak-btn{margin-left:auto;border:none;background:var(--secondary-light);color:var(--secondary-dark);width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .speak-btn:hover{background:var(--secondary);color:#fff;transform:scale(1.08);}
  .speak-btn:active{transform:scale(.95);}

  .celebrate-card{position:relative;overflow:hidden;border-radius:var(--radius-card);padding:26px 24px;text-align:center;margin-bottom:18px;background:linear-gradient(135deg,var(--secondary-light),var(--accent-yellow-light));border:2px solid var(--border);}
  .celebrate-card .emoji{font-size:52px;line-height:1;animation:bounce 1.4s ease-in-out infinite;}
  .celebrate-card h3{font-size:22px;margin-top:8px;}
  .celebrate-card .msg{color:var(--text-muted);font-size:14px;margin-top:4px;}
  .celebrate-card .score-big{font-family:var(--font-heading);font-size:34px;color:var(--primary-dark);margin-top:10px;font-weight:800;}

<script>
/* =========================================================================
   MockTest – nền tảng luyện thi thử: kho đề, tạo đề, giao bài, thi trực tuyến
   Chứng chỉ: Flyers / Movers / Starters / KET / PET + Toán tư duy / Khoa học /
   Lịch sử / Địa lý / Văn học. Toàn bộ dữ liệu lưu trong localStorage (demo, không server).
   ========================================================================= */

/* ---------------------------- Tiện ích chung ---------------------------- */
function uid(prefix){ return (prefix||'id')+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function esc(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nl2br(str){ return esc(str).replace(/\n/g,'<br>'); }
function fmtDateTime(ts){
  if(!ts) return '—';
  var d = new Date(ts);
  function p(n){return String(n).padStart(2,'0');}
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function toDatetimeLocalValue(ts){
  var d = new Date(ts);
  function p(n){return String(n).padStart(2,'0');}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function randomCode(len){
  var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; var s='';
  for(var i=0;i<(len||6);i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function sample(arr,n){ return shuffleArr(arr).slice(0, n); }
function difficultyLabel(d){ return d==='easy'?'Dễ':d==='medium'?'Trung bình':d==='hard'?'Khó':d; }
function difficultyBadgeClass(d){ return d==='easy'?'badge-green':d==='medium'?'badge-yellow':'badge-red'; }
function typeLabel(t){ return t==='mc'?'Trắc nghiệm':t==='short'?'Trả lời ngắn':t==='essay'?'Tự luận':t==='writingAuto'?'✍️ Writing (AI chấm tự động)':t==='speaking'?'🗣️ Speaking (AI chấm tự động)':t; }

/* ------------------------- Danh mục chứng chỉ / môn thi ------------------------- */
var CATEGORIES = [
  {id:'flyers', name:'Flyers', icon:'🦋', color:'#EC4899'},
  {id:'movers', name:'Movers', icon:'🚀', color:'#3B82F6'},
  {id:'starters', name:'Starters', icon:'⭐', color:'#F59E0B'},
  {id:'ket', name:'KET (A2 Key)', icon:'🔑', color:'#10B981'},
  {id:'pet', name:'PET (B1 Preliminary)', icon:'📘', color:'#6366F1'},
  {id:'maththinking', name:'Toán tư duy', icon:'🧮', color:'#F97316'},
  {id:'science', name:'Khoa học', icon:'🔬', color:'#14B8A6'},
  {id:'history', name:'Lịch sử', icon:'🏛️', color:'#A16207'},
  {id:'geography', name:'Địa lý', icon:'🌍', color:'#06B6D4'},
  {id:'literature', name:'Văn học', icon:'📖', color:'#8B5CF6'},
  {id:'tdn2026', name:'TDN 2026 (Tiếng Anh)', icon:'🏫', color:'#DD302D'}
];
function getCategory(id){
  return CATEGORIES.find(function(c){return c.id===id;}) || {id:id, name:id||'Khác', icon:'📄', color:'#64748b'};
}
/* Cac mon co buoc "chon lop" truoc khi hoc sinh thay danh sach de — theo yeu cau giao vien:
   chi ap dung cho 5 mon nay (khong dung cho Anh van vi da co cap do rieng Flyers/Movers/...). */
var GRADE_SUBJECTS = ['maththinking','science','history','geography','literature'];
var GRADE_LEVELS = [
  {id:'1-2', label:'Lớp 1+2'},
  {id:'3', label:'Lớp 3'},
  {id:'4', label:'Lớp 4'},
  {id:'5', label:'Lớp 5'},
  {id:'6', label:'Lớp 6'},
  {id:'7', label:'Lớp 7'},
  {id:'8', label:'Lớp 8'},
  {id:'9', label:'Lớp 9'},
  {id:'10', label:'Lớp 10'}
];
function gradeLabel(id){
  var g = GRADE_LEVELS.find(function(x){return x.id===id;});
  return g ? g.label : '';
}
function gradeMatches(testGrade, chosenGrade){
  if(!testGrade) return true;
  if(testGrade===chosenGrade) return true;
  var tParts = String(testGrade).split('-');
  var cParts = String(chosenGrade).split('-');
  for(var i=0;i<tParts.length;i++){ if(cParts.indexOf(tParts[i])!==-1) return true; }
  return false;
}
var KANGAROO_LEVEL_ABBREV = {Benjamin:'Ben', Ecolier:'Eco', Kadett:'Kad', Junior:'Jun', Felix:'Fel'};
function kangarooAbbrev(origTitle){
  if(!origTitle || origTitle.indexOf('Kangaroo')===-1) return null;
  var levelMatch = origTitle.match(/Benjamin|Ecolier|Kadett|Junior|Felix/);
  var yearMatch = origTitle.match(/\d{4}/);
  if(!levelMatch || !yearMatch) return null;
  return KANGAROO_LEVEL_ABBREV[levelMatch[0]] + yearMatch[0].slice(2);
}
function kangarooYear(origTitle){
  var m = (origTitle||'').match(/\d{4}/);
  return m ? parseInt(m[0],10) : 0;
}
function origTitleHint(t){
  var abbrev = kangarooAbbrev(t.origTitle);
  if(abbrev) return abbrev;
  if(t.origTitle && t.origTitle.indexOf('Azota')!==-1) return 'Tổng hợp';
  return t.origTitle || '';
}
function hexToRgba(hex, alpha){
  hex = String(hex).replace('#','');
  var r=parseInt(hex.substring(0,2),16), g=parseInt(hex.substring(2,4),16), b=parseInt(hex.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}
function categoryOptionsHtml(selectedId){
  return CATEGORIES.map(function(c){ return '<option value="'+c.id+'" '+(selectedId===c.id?'selected':'')+'>'+c.icon+' '+esc(c.name)+'</option>'; }).join('');
}
function categoryBadge(id){
  var c = getCategory(id);
  return '<span class="badge" style="background:'+hexToRgba(c.color,0.14)+';color:'+c.color+'">'+c.icon+' '+esc(c.name)+'</span>';
}
/* ------------------------- 4 kỹ năng thi (Reading/Listening/Writing/Speaking) -------------------------
   Áp dụng cho các đề có gắn thẻ kỹ năng theo từng câu hỏi (hiện chỉ có đề mẫu KET) — cho phép học
   sinh luyện tập riêng từng kỹ năng, hoặc riêng từng Part trong kỹ năng đó, giống cách IELTS Guru
   tổ chức thư viện đề theo Reading/Listening/Writing/Speaking thay vì bắt làm trọn 1 đề dài. */
var SKILL_META = {
  reading:{label:'Reading', icon:'📖', color:'#2EA8E0'},
  listening:{label:'Listening', icon:'🎧', color:'#3FBF83'},
  writing:{label:'Writing', icon:'✍️', color:'#F59E0B'},
  speaking:{label:'Speaking', icon:'🗣️', color:'#EC4899'}
};
function skillLabel(sk){ return (SKILL_META[sk]&&SKILL_META[sk].label) || sk; }
function skillIcon(sk){ return (SKILL_META[sk]&&SKILL_META[sk].icon) || '📄'; }
function skillColor(sk){ return (SKILL_META[sk]&&SKILL_META[sk].color) || '#64748b'; }

/* ================================================================
   NHẬP ĐỀ THI TỰ ĐỘNG TỪ FILE PDF / WORD / VĂN BẢN
   Đây là bộ phân tích theo quy tắc định dạng (rule-based), không phải AI
   hiểu ngữ nghĩa — hoạt động tốt với các file đề thi được đánh số câu rõ
   ràng (Câu 1/Question 1/1.) kèm phương án A/B/C/D và có đáp án (inline
   hoặc bảng đáp án ở cuối file). Luôn có bước xem lại & chỉnh sửa trước
   khi lưu vào kho đề, để tránh sai sót do nhận dạng tự động.
   ================================================================ */

/* Chuyển HTML (do mammoth trả về) thành văn bản thuần, thay mỗi thẻ <img> bằng một
   token [[IMG:n]] để giữ lại vị trí hình ảnh trong dòng câu hỏi tương ứng; danh sách
   ảnh (base64 data URI) được trả về riêng theo đúng thứ tự token. */
function htmlToTokenText(html){
  var images = [];
  var withTokens = String(html||'').replace(/<img[^>]*src="([^"]*)"[^>]*>/gi, function(m, src){
    images.push(src);
    return '[[IMG:'+(images.length-1)+']]';
  });
  var text = withTokens
    .replace(/<\/(p|div|li|h[1-6])>/gi, '\n')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/g, ' ')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  return {text: text, images: images};
}

/* Trích xuất văn bản (+ hình ảnh nếu có, hiện hỗ trợ với file Word) từ file PDF / DOCX / TXT.
   Luôn trả về {text, images}. */
function extractTextFromFile(file){
  var name = (file.name||'').toLowerCase();
  if(name.endsWith('.pdf')){
    if(typeof pdfjsLib==='undefined'){
      return Promise.reject(new Error('Không tải được thư viện đọc PDF (cần kết nối Internet ở lần dùng đầu tiên). Hãy thử lại hoặc dán trực tiếp nội dung văn bản.'));
    }
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }catch(e){}
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({data:buf}).promise.then(function(pdf){
        var pagePromises = [];
        for(var i=1;i<=pdf.numPages;i++){
          pagePromises.push(pdf.getPage(i).then(function(page){
            return page.getTextContent().then(function(content){
              var lines = {};
              content.items.forEach(function(item){
                var y = Math.round(item.transform[5]);
                if(!lines[y]) lines[y]=[];
                lines[y].push({x:item.transform[4], text:item.str});
              });
              var ys = Object.keys(lines).map(Number).sort(function(a,b){return b-a;});
              return ys.map(function(y){
                return lines[y].sort(function(a,b){return a.x-b.x;}).map(function(t){return t.text;}).join(' ');
              }).join('\n');
            });
          }));
        }
        return Promise.all(pagePromises).then(function(pageTexts){ return {text: pageTexts.join('\n\n'), images: []}; });
      });
    });
  } else if(name.endsWith('.docx')){
    if(typeof mammoth==='undefined'){
      return Promise.reject(new Error('Không tải được thư viện đọc Word (cần kết nối Internet ở lần dùng đầu tiên). Hãy thử lại hoặc dán trực tiếp nội dung văn bản.'));
    }
    return file.arrayBuffer().then(function(buf){
      var imgOpts = {
        convertImage: mammoth.images.imgElement(function(image){
          return image.read('base64').then(function(imageBuffer){
            return { src: 'data:'+image.contentType+';base64,'+imageBuffer };
          });
        })
      };
      return mammoth.convertToHtml({arrayBuffer:buf}, imgOpts).then(function(result){
        return htmlToTokenText(result.value);
      });
    });
  } else {
    return file.text().then(function(t){ return {text: t, images: []}; });
  }
}

/* Phân tích văn bản thô thành danh sách câu hỏi có cấu trúc */
function parseExamText(rawText){
  var warnings = [];
  var text = String(rawText||'').replace(/\r\n?/g,'\n');

  /* 1. Tách vùng "đáp án" (nếu có) ra khỏi phần câu hỏi chính. Chấp nhận cả các tiêu đề
     có tiền tố như "Bảng đáp án" / "Table answer key", không chỉ đúng nguyên dòng "đáp án". */
  var answerZoneRegex = /(^|\n)[ \t]*(?:bảng|bang|table)?[ \t]*(đáp\s*án(?:\s*đúng)?|dap\s*an|answer\s*key|key|hướng\s*dẫn\s*chấm|huong\s*dan\s*cham)[ \t]*[:\-]?[ \t]*(\n|$)/i;
  var azMatch = text.match(answerZoneRegex);
  var questionText = text, answerZoneText = '';
  if(azMatch){
    var idx = azMatch.index + azMatch[0].length;
    questionText = text.slice(0, azMatch.index);
    answerZoneText = text.slice(idx);
  }

  /* Bản đồ số câu -> đáp án, lấy từ vùng đáp án riêng (nếu có). Ho tro toi da 10 phuong an
     (A-J — du cho de Cambridge Listening Part ghep noi 8 lua chon A-H), tien to "Câu"/"Question"
     tuy chon truoc so thu tu, va nhieu kieu dau phan cach (. ) - – — : /).
     TACH RIENG 2 loai: answerMap (so cau -> 1 CHU CAI duy nhat, dung cho trac nghiem) va
     shortAnswerMap (so cau -> CA CUM TU/SO, dung cho cau dien tu — VD dap an that "6-August",
     "9-65" cua de Cambridge Listening Part 2 — TRUOC DAY bi bo qua hoan toan vi regex cu chi
     nhan 1 ky tu A-F, khien 5 cau dien tu bien thanh tu luan khong dap an ma khong canh bao). */
  var answerMap = {};
  var shortAnswerMap = {};
  if(answerZoneText){
    var amRe = /(?:^|\n)\s*(?:Câu|Cau|Question|Q)?\s*(\d{1,3})\s*[\.\)\-–—:\/]\s*([^\n]+)/g;
    var m;
    while((m = amRe.exec(answerZoneText))){
      var amNum = parseInt(m[1],10);
      var amVal = m[2].trim();
      var amLetterOnly = amVal.match(/^([A-Ja-j])$/);
      if(amLetterOnly){
        answerMap[amNum] = amLetterOnly[1].toUpperCase();
      } else if(amVal){
        shortAnswerMap[amNum] = amVal;
      }
    }
  }

  /* 2. Tách các câu hỏi theo số thứ tự đầu dòng: "Câu 1:", "Question 2.", "3)" ... */
  var qStartRegex = /(^|\n)\s*(?:Câu|Cau|Question|Bài|Bai|Q)?\s*(\d{1,3})\s*[\.\):]\s+/gi;
  var starts = [];
  var m2;
  while((m2 = qStartRegex.exec(questionText))){
    starts.push({index:m2.index + m2[1].length, bodyStart:qStartRegex.lastIndex, number:parseInt(m2[2],10)});
  }
  if(starts.length===0){
    warnings.push('Không nhận diện được số thứ tự câu hỏi (VD: "Câu 1:", "1.") — vui lòng kiểm tra định dạng file hoặc nhập thủ công.');
    return {questions:[], warnings:warnings};
  }

  var chunks = [];
  for(var i=0;i<starts.length;i++){
    var end = (i+1<starts.length) ? starts[i+1].index : questionText.length;
    chunks.push({number:starts[i].number, text: questionText.slice(starts[i].bodyStart, end).trim()});
  }

  var questions = chunks.map(function(chunk){
    /* Tách các dòng của câu hỏi, GIỮ NGUYÊN token [[IMG:n]] khi tách dòng (khác bản trước) —
       để có thể gán đúng từng ảnh vào phương án tương ứng (A/B/C/D/E) thay vì gộp chung một chỗ.
       Nhiều đề kiểu Kangaroo/IKMC có phương án là HÌNH ẢNH thuần (không có chữ), nên cần tách
       ảnh theo TỪNG DÒNG, không tách một lần cho cả câu như trước. */
    var rawLines = chunk.text.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>0;});
    var optRegex = /^([A-Ja-j])[\.\)]\s*(.*)$/;
    var inlineAnsRegex = /(?:đáp\s*án|dap\s*an|answer)\s*[:\-]?\s*([A-Ja-j])\b/i;
    var answerLineRegex = /^(?:đáp\s*án|dap\s*an|answer)\s*[:\-]?\s*(.*)$/i;
    var bodyLines = [], options = {}, optionImages = {}, imageRefs = [];
    var inlineAnswerLetter = null, inlineShortAnswer = null;

    rawLines.forEach(function(rawLine){
      var lineImageIdxs = [];
      var line = rawLine.replace(/\[\[IMG:(\d+)\]\]/g, function(mm, idx){ lineImageIdxs.push(parseInt(idx,10)); return ''; });
      var trimmed = line.trim();

      if(trimmed===''){
        /* Dòng chỉ chứa hình ảnh, không có chữ: nếu đã có phương án đứng trước (A/B/C...) thì
           gắn ảnh này vào phương án gần nhất — thường là ảnh minh họa cho chính phương án đó
           (VD: "A." rồi tới hình vẽ). Nếu chưa có phương án nào, coi là ảnh minh họa của đề bài. */
        if(lineImageIdxs.length){
          var seenLetters = Object.keys(options);
          if(seenLetters.length){
            var lastLetter = seenLetters[seenLetters.length-1];
            optionImages[lastLetter] = (optionImages[lastLetter]||[]).concat(lineImageIdxs);
          } else {
            imageRefs = imageRefs.concat(lineImageIdxs);
          }
        }
        return;
      }

      var om = line.match(optRegex);
      if(om){
        var letter = om[1].toUpperCase();
        var optText = om[2];
        var inlineHere = optText.match(inlineAnsRegex);
        if(inlineHere){ inlineAnswerLetter = inlineHere[1].toUpperCase(); }
        var cleanedOpt = optText.replace(inlineAnsRegex,'').trim();
        options[letter] = cleanedOpt || (lineImageIdxs.length ? '(Hình ảnh minh họa)' : '');
        if(lineImageIdxs.length){ optionImages[letter] = (optionImages[letter]||[]).concat(lineImageIdxs); }
        return;
      }
      var alm = trimmed.match(answerLineRegex);
      if(alm && bodyLines.length>0){
        var rest = alm[1].trim();
        var letterOnly = rest.match(/^([A-Ja-j])\b/);
        if(letterOnly){ inlineAnswerLetter = letterOnly[1].toUpperCase(); }
        else if(rest){ inlineShortAnswer = rest; }
        return;
      }
      bodyLines.push(trimmed);
      if(lineImageIdxs.length) imageRefs = imageRefs.concat(lineImageIdxs);
    });

    var content = bodyLines.join(' ').trim();
    var letters = Object.keys(options).sort();
    var q = {content:content, difficulty:'medium', points:1, sourceNumber:chunk.number, needsReview:false};
    if(imageRefs.length) q.imageRefs = imageRefs;

    if(letters.length>=2){
      q.type = 'mc';
      q.choices = letters.map(function(l){ return options[l]; });
      if(letters.some(function(l){ return optionImages[l] && optionImages[l].length; })){
        q.choiceImageRefs = letters.map(function(l){ return optionImages[l] || null; });
      }
      var correctLetter = inlineAnswerLetter || answerMap[chunk.number] || null;
      if(correctLetter && letters.indexOf(correctLetter)>=0){
        q.correctIndex = letters.indexOf(correctLetter);
      } else {
        q.correctIndex = 0;
        q.needsReview = true;
        warnings.push('Câu '+chunk.number+': chưa xác định được đáp án đúng — vui lòng kiểm tra lại trong bảng bên dưới.');
      }
    } else if(inlineShortAnswer){
      q.type = 'short';
      q.correctAnswer = inlineShortAnswer;
    } else if(shortAnswerMap[chunk.number]){
      /* Cau dien tu (khong co phuong an A/B/C) MA bang dap an rieng co dung so thu tu nay —
         VD de Cambridge Listening Part 2 "6-August", "9-65". TRUOC DAY bi bo qua hoan toan. */
      q.type = 'short';
      q.correctAnswer = shortAnswerMap[chunk.number];
    } else if(/\.{3,}|_{3,}/.test(content)){
      /* Phat hien dau hieu "cho trong can dien" (chuoi cham/gach lien tiep) nhung KHONG tim
         thay dap an tuong ung trong bang dap an — PHAI bao ro cho giao vien biet con thieu,
         khong duoc am tham bien thanh cau tu luan nhu truoc (giao vien se khong biet ma sua). */
      q.type = 'short';
      q.correctAnswer = '';
      q.needsReview = true;
      warnings.push('Câu '+chunk.number+': có vẻ là câu điền từ (có chỗ trống) nhưng chưa tìm thấy đáp án đúng trong file — vui lòng tự nhập đáp án ở bảng bên dưới.');
    } else {
      q.type = 'essay';
      q.points = 3;
      if(!content){
        q.needsReview = true;
        warnings.push('Câu '+chunk.number+': không rõ đáp án, đã đưa vào dạng tự luận — vui lòng kiểm tra lại.');
      }
    }
    return q;
  }).filter(function(q){ return q.content && q.content.length>0; });

  if(questions.length===0){
    warnings.push('Không trích xuất được nội dung câu hỏi nào từ file này.');
  }
  return {questions:questions, warnings:warnings};
}

/* Đoán chứng chỉ/môn thi phù hợp nhất theo từ khóa trong tên file & nội dung đề, để tự
   động điền vào ô "Chứng chỉ/môn thi" khi nhập file — giáo viên vẫn xem lại và có thể
   sửa tay ngay ở bước xem lại nếu hệ thống đoán sai (không phải quyết định cuối cùng). */
var CATEGORY_KEYWORDS = {
  flyers: ['flyers'],
  movers: ['movers'],
  starters: ['starters'],
  ket: ['ket', 'a2 key', 'key english test'],
  pet: ['pet', 'b1 preliminary', 'preliminary english test'],
  maththinking: ['toán', 'toan', 'math', 'mathematic', 'kangaroo', 'ikmc', 'olympiad'],
  science: ['khoa học', 'khoa hoc', 'science', 'sinh học', 'sinh hoc', 'vật lý', 'vat ly', 'hóa học', 'hoa hoc'],
  history: ['lịch sử', 'lich su', 'history'],
  geography: ['địa lý', 'dia ly', 'geography'],
  literature: ['văn học', 'van hoc', 'literature', 'tác phẩm', 'tac pham', 'tác giả', 'tac gia']
};
function guessCategory(text, fileName){
  var full = String(text||'').toLowerCase();
  var head = full.slice(0, 400);
  var name = String(fileName||'').toLowerCase().replace(/[_\-\.]/g,' ');
  var bestId = null, bestScore = 0;
  Object.keys(CATEGORY_KEYWORDS).forEach(function(id){
    var score = 0;
    CATEGORY_KEYWORDS[id].forEach(function(kw){
      score += (name.split(kw).length-1) * 4;
      score += (head.split(kw).length-1) * 3;
      score += (full.split(kw).length-1) * 1;
    });
    if(score > bestScore){ bestScore = score; bestId = id; }
  });
  return bestScore>0 ? bestId : null;
}

/* Gioi han thoi gian cho cho 1 Promise bat ky — LOI THAT DA GAP: neu Firebase Storage chua duoc
   "Get started" (bat) trong Firebase Console, request tao metadata file dau tien tra ve 404 va
   Firebase SDK KHONG BAO GIO resolve/reject Promise upload — treo vinh vien o "0%" (khong phai
   loi bi nuot, ma la khong bao gio ket thuc), khien nguoi dung cho mai khong ra ket qua. Boc
   Promise bang withTimeout() de SAU N giay khong xong thi tu dong coi la that bai va bao ro ly
   do co the xay ra, thay vi treo man hinh vo thoi han. */
function withTimeout(promise, ms, timeoutMsg){
  return new Promise(function(resolve, reject){
    var settled = false;
    var timer = setTimeout(function(){
      if(settled) return;
      settled = true;
      reject(new Error(timeoutMsg || ('Hết thời gian chờ ('+Math.round(ms/1000)+'s), không có phản hồi.')));
    }, ms);
    promise.then(function(v){
      if(settled) return;
      settled = true; clearTimeout(timer); resolve(v);
    }, function(e){
      if(settled) return;
      settled = true; clearTimeout(timer); reject(e);
    });
  });
}
/* Firestore KHONG cho phep mang long mang (nested array, vi du choiceImages:[["data:...","data:..."],[...]])
   — chi cho phep mang cua "map"/gia tri don. Cac ham nay chuyen doi 2 chieu de luu/doc an toan:
   sanitizeArraysForFirestore(): truoc khi ghi, boc moi mang-con nam TRUC TIEP ben trong 1 mang khac
   thanh {__nestedArray:true, items:[...]}. desanitizeArraysFromFirestore(): sau khi doc, mo boc lai
   thanh mang binh thuong nhu du lieu goc, de code hien thi (vd t.choiceImages[i]) khong bi anh huong. */
function sanitizeArraysForFirestore(value){
  if(Array.isArray(value)){
    return value.map(function(item){
      if(Array.isArray(item)) return {__nestedArray:true, items: sanitizeArraysForFirestore(item)};
      return sanitizeArraysForFirestore(item);
    });
  } else if(value && typeof value==='object'){
    var out = {};
    Object.keys(value).forEach(function(k){ out[k] = sanitizeArraysForFirestore(value[k]); });
    return out;
  }
  return value;
}
function desanitizeArraysFromFirestore(value){
  if(Array.isArray(value)){
    return value.map(function(item){ return desanitizeArraysFromFirestore(item); });
  } else if(value && typeof value==='object'){
    if(value.__nestedArray===true && Array.isArray(value.items)) return desanitizeArraysFromFirestore(value.items);
    var out = {};
    Object.keys(value).forEach(function(k){ out[k] = desanitizeArraysFromFirestore(value[k]); });
    return out;
  }
  return value;
}
var CloudDB = {

     Dung chinh test.id lam ID tren Firestore de dam bao dong bo 1-1, khong bi trung lap. */
  catalogDoc:function(test){
    var c = JSON.parse(JSON.stringify(test));
    delete c.source; delete c.questions; delete c.audio; delete c.speaking; delete c._stub; delete c.qMeta;
    var qs = test.questions || [];
    c.qMeta = qs.map(function(q){ return {id:q.id, type:q.type||null, points:(q.points==null?1:q.points), skill:q.skill||null, part:(q.part==null?null:q.part)}; });

  fetchCatalog:function(cb){

        d.questions = (d.qMeta||[]).map(function(m){
          var o = {id:m.id, points:m.points, _stub:true};
          if(m.type) o.type = m.type; if(m.skill) o.skill = m.skill; if(m.part!=null) o.part = m.part;

  fetchTestFull:function(testId, cb){

      if(!doc.exists){ cb(false, 'Đề không còn tồn tại.'); return; }

  /* Tu dong doi chieu danh muc voi kho de (chi Giao vien/Admin): bo sung dong thieu/lech, don dong mo coi. */
  syncCatalog:function(tests, cb){
    var self = this;
    if(!this.ready || !this.currentAdmin || !this._testsOk || !tests.length){ cb(false); return; }
    this.db.collection('testCatalog').get().then(function(snap){
      var have = {}, haveN = 0; snap.forEach(function(d){ have[d.id] = d.data(); haveN++; });
      var upserts = [], ids = {};
      tests.forEach(function(t){
        ids[t.id] = 1; var c = have[t.id];
        var stale = !c || c.qCount !== (t.questions||[]).length || c.title !== t.title || c.subject !== t.subject ||
          !!c.isPremium !== !!t.isPremium || (c.creditCost||0) !== (t.creditCost||0) || c.duration !== t.duration;
        if(stale) upserts.push(t);
      });
      var orphans = Object.keys(have).filter(function(id){ return !ids[id]; });
      if(orphans.length > Math.max(3, haveN*0.2)){ console.warn('syncCatalog: qua nhieu dong mo coi, bo qua xoa'); orphans = []; }
      if(!upserts.length && !orphans.length){ cb(true, 0, 0); return; }
      var ops = upserts.map(function(t){ return {t:t}; }).concat(orphans.map(function(id){ return {del:id}; }));
      var chunks = []; for(var i=0;i<ops.length;i+=40) chunks.push(ops.slice(i,i+40));
      var idx = 0;
      (function next(){
        if(idx>=chunks.length){ cb(true, upserts.length, orphans.length); return; }
        var b = self.db.batch();
        chunks[idx].forEach(function(op){
          if(op.t) b.set(self.db.collection('testCatalog').doc(op.t.id), self.catalogDoc(op.t));
          else b.delete(self.db.collection('testCatalog').doc(op.del));
        });
        b.commit().then(function(){ idx++; next(); }).catch(function(e){ console.error('syncCatalog', e); cb(false); });
      })();
    }).catch(function(e){ console.error('syncCatalog', e); cb(false); });
  },
  saveTest:function(test, cb){

    b.set(this.db.collection('tests').doc(test.id), data);

  /* Tai file audio GOC (khong can nen, khong gioi han ~8MB nhu nhung base64) len Firebase

  uploadAudio:function(file, testId, onProgress){

  /* Tru tin dung AN TOAN bang Firestore Transaction (doc so du MOI NHAT tren Cloud roi moi quyet
     dinh, khong dung cache tren may) — tranh bam nhanh 2 lan / mo 2 tab lam tru tien 2 lan. */
  /* Mo khoa de bang tin dung: tru tin dung VA ghi ban ghi mo khoa trong CUNG 1 giao dich (Firestore Rules kiem tra cap doi nay). */
  spendStudentCreditForTest:function(studentUid, cost, reason, testId, cb){
    if(!this.ready){ cb(false,'Cloud chưa được cấu hình.'); return; }
    var ref = this.db.collection('students').doc(studentUid);
    var unlockRef = ref.collection('unlocks').doc(testId);
    this.db.runTransaction(function(tx){
      return tx.get(ref).then(function(doc){
        if(!doc.exists) throw new Error('Không tìm thấy hồ sơ học sinh.');
        var data = doc.data();
        var balance = data.credits||0;
        if(balance < cost){ throw new Error('INSUFFICIENT_CREDIT'); }
        var newBalance = balance - cost;
        var log = desanitizeArraysFromFirestore(data.creditLog||[]);
        log.push({id: uid('cl'), delta: -cost, reason: reason, at: Date.now()});
        tx.update(ref, {credits: newBalance, creditLog: sanitizeArraysForFirestore(log)});
        tx.set(unlockRef, {testId: testId, type: 'credit', cost: cost, at: Date.now()});
        return {newBalance: newBalance, newLog: log};
      });
    }).then(function(result){ cb(true, result); })
    .catch(function(e){
      if(e && e.message==='INSUFFICIENT_CREDIT'){ cb(false, 'INSUFFICIENT_CREDIT'); return; }
      cb(false, e && e.message);
    });

      if(d.exists){ cb(true); return; }

  /* ============ TÀI LIỆU HỌC (thêm bởi Claude) ============
     Danh sách tài liệu học tập giáo viên gửi cho học sinh. KHÔNG phân loại theo lớp/môn —
     mọi học sinh (kể cả học sinh tự đăng ký) đều thấy chung MỘT danh sách duy nhất, mới nhất
     lên trước. Document collection 'materials': {id, title, description, fileUrl, fileName,
     fileSize, externalUrl, createdAt}. Đọc: bất kỳ ai đã đăng nhập (giáo viên + học sinh —
     giống hệt cách 'assignments' đang hoạt động). Ghi/Xóa: chỉ Admin Cloud (giáo viên). */
  fetchMaterials:function(cb){
    if(!this.ready){ cb([]); return; }
    var self = this;
    function collectFrom(snap){
      var arr = [];
      snap.forEach(function(doc){
        var data = desanitizeArraysFromFirestore(doc.data());
        data.id = doc.id;
        arr.push(data);
      });
      return arr;
    }
    this.db.collection('materials').orderBy('createdAt','desc').get().then(function(snap){
      cb(collectFrom(snap));
    }).catch(function(e){
      /* Co the do thieu index cho orderBy — thu lai khong sap xep tren Cloud roi sap xep tai cho. */
      console.error('CloudDB.fetchMaterials lỗi:', e);
      self.db.collection('materials').get().then(function(snap){
        var arr = collectFrom(snap);
        arr.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
        cb(arr);
      }).catch(function(e2){ console.error('CloudDB.fetchMaterials (fallback) lỗi:', e2); cb([]); });
    });
  },

  /* Tải file tài liệu (PDF/Word/ảnh...) lên Firebase Storage — chỉ Admin Cloud. Giống hệt
     uploadAudio() ở trên nhưng lưu vào thư mục 'materials/' riêng. Trả về URL tải xuống. */
  uploadMaterialFile:function(file, materialId, onProgress){
    var self = this;

      if(!self.currentAdmin){ reject(new Error('Bạn chưa đăng nhập Admin Cloud.')); return; }

      }, function(err){
        reject(err);
      }, function(){
        task.snapshot.ref.getDownloadURL().then(function(url){ resolve(url); }, reject);
      });

  }
};

var DB_KEY = 'mocktest_db_v1';
var DB = {
  data:null,
  load:function(){
    var raw = localStorage.getItem(DB_KEY);
    if(raw){
      try{
        this.data = JSON.parse(raw);
        this.migrate();
        return;
      }catch(e){ /* fallthrough seed */ }
    }
    this.seed();
    this.migrate();
    this.save();
  },
  /* Luu du lieu xuong localStorage cua trinh duyet. BOC try/catch: neu bo nho trinh duyet da day
     (QuotaExceededError - thuong do audio cu nhung base64 qua nang), KHONG duoc de loi nay
     "leak" ra ngoai va bi nham la loi cua Cloud/Firebase (2 thu hoan toan doc lap). Tra ve
     true/false de noi goi biet ma quyet dinh thong bao phu hop. */
  save:function(){
    try{
      /* QUAN TRONG: this.data.tests co the dang CHUA CA de tu Cloud (duoc mergeCloudTests() gop
         vao bo nho de hien thi — xem ham do). KHONG duoc luu nhung de nguon 'cloud' nay xuong
         localStorage: chung co the rat nang (anh nhung base64) va se lam vuot han muc luu tru
         (loi 'LUU THAT BAI') NGAY CA KHI thao tac cua giao vien (tao lop, giao bai...) hoan toan
         nho gon. Chi luu phan de CUC BO (source khac 'cloud') — de Cloud se duoc tai lai binh
         thuong qua CloudDB.fetchTests() o lan mo trang ke tiep. */
      var d = this.data;
      var toSave = d;
      if(d && Array.isArray(d.tests) && d.tests.some(function(t){ return t.source==='cloud'; })){
        toSave = {};
        for(var k in d){ if(Object.prototype.hasOwnProperty.call(d,k)) toSave[k] = d[k]; }
        toSave.tests = d.tests.filter(function(t){ return t.source!=='cloud'; });
      }
      localStorage.setItem(DB_KEY, JSON.stringify(toSave));
      this.lastSaveError = null;
      return true;
    }catch(e){
      this.lastSaveError = e;
      if(window.console) console.error('DB.save() loi (co the do bo nho trinh duyet day):', e);
        if(typeof alert==='function'){ alert('⚠️ LƯU THẤT BẠI! Bộ nhớ trình duyệt (localStorage) đã đầy hoặc bị lỗi — thay đổi VỪA RỒI CHƯA được lưu và sẽ mất khi tải lại trang.\n\nNguyên nhân thường gặp: đề thi có audio/ảnh nhúng quá nặng, khiến dữ liệu vượt quá dung lượng lưu trữ cho phép của trình duyệt.\nGợi ý: xóa bớt đề/audio cũ, hoặc tải audio lên Cloud (đăng nhập Admin Cloud) thay vì nhúng trực tiếp vào trình duyệt.'); }
      return false;
    }
  },
  reset:function(){ localStorage.removeItem(DB_KEY); this.load(); },
  /* Tron danh sach de tu Cloud vao du lieu dang hien thi. Cac de co nguon goc Cloud (source:'cloud')
     tu lan tron truoc se duoc thay the bang ban moi nhat; de tao/luu chi tren may (khong co source,
     hoac source khac 'cloud') giu nguyen, KHONG bi anh huong. Khong tu dong ghi vao localStorage o
     day (chi trong bo nho) de tranh luu de "cu" khi chua ket noi lai duoc Cloud. */
  mergeCloudTests:function(cloudTests){
    var d = this.data;
    if(!d) return;
    /* Hoc sinh khong tu tao de: bo cac ban de CUC BO cu con sot trong trinh duyet (chi o may hoc sinh, khong dong cham Cloud). */
    var _u = (typeof CloudDB!=='undefined' && CloudDB.auth) ? CloudDB.auth.currentUser : null;
    var _isStu = !!(_u && String(_u.email||'').indexOf('@'+STUDENT_AUTH_DOMAIN) >= 0);
    var localOnly = _isStu ? [] : (d.tests||[]).filter(function(t){ return t.source!=='cloud'; });
    d.tests = localOnly.concat(cloudTests||[]);
  },
  mergeCloudAssignments:function(cloudAssignments){
    var d = this.data;
    if(!d) return;
    var localOnly = (d.assignments||[]).filter(function(a){ return a.source!=='cloud'; });
    d.assignments = localOnly.concat(cloudAssignments||[]);
  },
  /* Tài liệu học (thêm bởi Claude): luôn đồng bộ TOÀN BỘ từ Cloud — không có khái niệm
     "tài liệu cục bộ" (chỉ Admin Cloud mới thêm được, xem CloudDB.saveMaterial). */
  mergeCloudMaterials:function(cloudMaterials){

    if(!d) return;
    d.materials = cloudMaterials || [];

  mergeCloudSubmissions:function(cloudSubmissions){

  seed:function(){

    this.data = {

/* --------------------------------- Grading Engine (Writing/Speaking tự động, miễn phí) --------------- */
/* Chấm điểm Writing & Speaking hoàn toàn tự động, không cần giáo viên duyệt lại.
   Dùng công nghệ miễn phí, không cần API key trả phí:

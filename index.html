/* ============================================================
   Nhap lai du lieu tu file backup (.json) da xuat boi exportBackup().
   GHI DE toan bo classes/students/bank/tests/assignments/submissions/
   progress hien tai bang noi dung trong file. Khong dung mat khau giao
   vien (backup khong luu mat khau) - giu nguyen mat khau cu. Them boi Claude.
   ============================================================ */
App.importBackupData = function(parsed){
  if(!parsed || typeof parsed!=='object'){ this.showToast('File backup không đúng định dạng.', 'error'); return; }
  var summary = 'Sẽ GHI ĐÈ dữ liệu hiện tại trên máy bằng nội dung file backup này:\n'
    + '- Lớp học: '+((parsed.classes||[]).length)+'\n'
    + '- Học sinh: '+((parsed.students||[]).length)+'\n'
    + '- Ngân hàng câu hỏi: '+((parsed.bank||[]).length)+'\n'
    + '- Đề thi: '+((parsed.tests||[]).length)+'\n'
    + '- Lượt giao bài: '+((parsed.assignments||[]).length)+'\n'
    + '- Bài làm/điểm: '+((parsed.submissions||[]).length)+'\n'
    + (parsed.exportedAt ? ('- File xuất lúc: '+parsed.exportedAt+'\n') : '')
    + '\nDữ liệu hiện tại sẽ bị THAY THẾ và KHÔNG thể hoàn tác. Tiếp tục?';
  if(!window.confirm(summary)) return;
  var d = DB.get();
  if(parsed.teacher){ d.teacher = Object.assign({}, d.teacher||{}, parsed.teacher); }
  d.classes = parsed.classes || [];
  d.students = parsed.students || [];
  d.bank = parsed.bank || [];
  d.tests = parsed.tests || [];
  d.assignments = parsed.assignments || [];
  d.submissions = parsed.submissions || [];
  d.progress = parsed.progress || {};
  var ok = DB.save();
  if(ok){ this.showToast('✅ Đã khôi phục dữ liệu từ file backup.', 'success'); }
  this.state.role = null; this.state.user = null;
  this.render();
};
(function(){
  function addRestoreBackupButton(){
    if(document.getElementById('restoreBackupBtn')) return;
    var btn = document.createElement('button');
    btn.id = 'restoreBackupBtn';
    btn.type = 'button';
    btn.textContent = '📥 Khôi phục từ file backup';
    btn.title = 'Nạp lại dữ liệu (lớp, học sinh, đề thi, điểm, giao bài...) từ file .json đã tải trước đó — sẽ GHI ĐÈ dữ liệu hiện tại';
    btn.style.cssText = 'position:fixed;bottom:112px;right:16px;z-index:99999;padding:10px 16px;background:#0f766e;color:#fff;border:none;border-radius:8px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;font-weight:600;';
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.json,application/json';
    fileInput.style.display = 'none';
    fileInput.onchange = function(){
      if(!fileInput.files || !fileInput.files[0]) return;
      var file = fileInput.files[0];
      var reader = new FileReader();
      reader.onload = function(e){
        var parsed;
        try{ parsed = JSON.parse(e.target.result); }catch(err){ App.showToast('File không hợp lệ (không đọc được JSON): '+(err&&err.message||err), 'error'); fileInput.value=''; return; }
        App.importBackupData(parsed);
        fileInput.value = '';
      };
      reader.onerror = function(){ App.showToast('Không đọc được file.', 'error'); };
      reader.readAsText(file);
    };
    btn.onclick = function(){ fileInput.click(); };
    document.body.appendChild(fileInput);
    document.body.appendChild(btn);
  }
  if(document.readyState!=='loading') addRestoreBackupButton();
  else document.addEventListener('DOMContentLoaded', addRestoreBackupButton);
})();

/* ============================================================
   DANG DE MOI TRUC TIEP LEN GITHUB (khong can Codespace/Terminal).
   Dung GitHub Git Data API (blobs/trees/commits) de gop anh moi +
   du lieu de moi vao 1 commit duy nhat, day thang len repo.
   Chi hien voi vai tro Giao vien (xem CSS o dau file). Them boi Claude.
   ============================================================ */
var GithubPublish = {
  CFG_KEY: 'mocktest_github_cfg',
  getConfig: function(){
    try{ return JSON.parse(localStorage.getItem(this.CFG_KEY) || 'null'); }catch(e){ return null; }
  },
  saveConfig: function(cfg){ localStorage.setItem(this.CFG_KEY, JSON.stringify(cfg)); },
  api: function(cfg, pathAndQuery, opts){
    opts = opts || {};
    var url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + pathAndQuery;
    var headers = { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json' };
    if(opts.body) headers['Content-Type'] = 'application/json';
    return fetch(url, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(r){
      if(!r.ok){
        return r.json().catch(function(){ return {}; }).then(function(errBody){
          throw new Error('GitHub API lỗi ' + r.status + ': ' + (errBody.message || r.statusText));
        });
      }
      return r.json();
    });
  },
  utf8ToBase64: function(str){
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  },
  base64ToUtf8: function(b64){
    var bin = atob(b64.replace(/\n/g,''));
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
};

App.openGithubSettings = function(){
  var cfg = GithubPublish.getConfig() || {owner:'', repo:'', branch:'main', token:''};
  var owner = prompt('Tên tài khoản/tổ chức GitHub (ví dụ: duc2006nm-crypto):', cfg.owner || '');
  if(owner===null) return;
  var repo = prompt('Tên repo (ví dụ: mocktest-mathpath):', cfg.repo || '');
  if(repo===null) return;
  var branch = prompt('Tên nhánh (thường là "main"):', cfg.branch || 'main');
  if(branch===null) return;
  var token = prompt('Personal Access Token của GitHub (dán vào đây — sẽ được lưu trên trình duyệt này, không gửi đi đâu khác ngoài GitHub). Để trống nếu muốn giữ token cũ:', '');
  if(token===null) return;
  if(!token) token = cfg.token || '';
  if(!token){ this.showToast('Cần nhập Personal Access Token để dùng tính năng này.', 'error'); return; }
  GithubPublish.saveConfig({owner:owner.trim(), repo:repo.trim(), branch:(branch.trim()||'main'), token:token.trim()});
  this.showToast('✅ Đã lưu cấu hình GitHub trên trình duyệt này.', 'success');
};

App.publishToGithub = function(){
  var cfg = GithubPublish.getConfig();
  if(!cfg || !cfg.token){ this.showToast('Cần thiết lập GitHub trước — bấm nút ⚙️ Cấu hình GitHub.', 'error'); this.openGithubSettings(); return; }
  var db = DB.get();
  if(!db.migratedPublishFlagV1){
    (db.tests||[]).forEach(function(t){ if(t.publishedToWeb===undefined) t.publishedToWeb = true; });
    db.migratedPublishFlagV1 = true;
    DB.save();
  }
  var unpublished = (db.tests||[]).filter(function(t){ return t.publishedToWeb !== true; });
  if(unpublished.length===0){ this.showToast('Không có đề mới cần đăng — mọi thứ đã lên web rồi.', 'info'); return; }
  var titles = unpublished.map(function(t,i){ return (i+1)+'. '+t.title; }).join('\n');
  if(!window.confirm('Sẽ đăng '+unpublished.length+' đề lên web:\n\n'+titles+'\n\nQuá trình có thể mất 1-2 phút, đừng đóng tab. Tiếp tục?')) return;

  var self = this;
  this.showToast('⏳ Đang chuẩn bị đăng lên GitHub...', 'info');

  GithubPublish.api(cfg, '/git/refs/heads/'+cfg.branch).then(function(refData){
    var latestCommitSha = refData.object.sha;
    return GithubPublish.api(cfg, '/git/commits/'+latestCommitSha).then(function(commitData){
      return {latestCommitSha: latestCommitSha, treeSha: commitData.tree.sha};
    });
  }).then(function(info){
    return GithubPublish.api(cfg, '/git/trees/'+info.treeSha+'?recursive=1').then(function(treeData){
      info.tree = treeData.tree; return info;
    });
  }).then(function(info){
    var indexEntry = info.tree.find(function(e){ return e.path==='index.html'; });
    if(!indexEntry) throw new Error('Không tìm thấy index.html trong repo.');
    var maxImgIdx = -1;
    info.tree.forEach(function(e){
      var m = /^images\/img_(\d+)\./.exec(e.path);
      if(m){ var n=parseInt(m[1],10); if(n>maxImgIdx) maxImgIdx=n; }
    });
    info.nextImgIdx = maxImgIdx+1;
    info.indexBlobSha = indexEntry.sha;
    return info;
  }).then(function(info){
    return GithubPublish.api(cfg, '/git/blobs/'+info.indexBlobSha).then(function(blobData){
      info.indexHtml = GithubPublish.base64ToUtf8(blobData.content); return info;
    });
  }).then(function(info){
    var newTreeEntries = [];
    var imgCounter = { n: info.nextImgIdx };
    var uploadPromise = Promise.resolve();
    var totalImgs = 0;
    unpublished.forEach(function(t){
      (t.questions||[]).forEach(function(q){
        function handleArr(arr){
          if(!Array.isArray(arr)) return;
          for(var i=0;i<arr.length;i++){
            (function(i){
              var v = arr[i];
              if(typeof v==='string' && v.indexOf('data:image')===0){
                totalImgs++;
                var idx = imgCounter.n++;
                var m = /^data:(image\/[a-zA-Z0-9.+-]+);base64,(.+)$/.exec(v);
                if(!m) return;
                var mime = m[1], b64 = m[2];
                var ext = /jpeg/.test(mime)?'jpg':(/svg/.test(mime)?'svg':(mime.split('/')[1]||'png'));
                var fileName = 'images/img_'+idx+'.'+ext;
                uploadPromise = uploadPromise.then(function(){
                  self.showToast('⏳ Đang tải ảnh #'+idx+'...', 'info');
                  return GithubPublish.api(cfg, '/git/blobs', {method:'POST', body:{content:b64, encoding:'base64'}});
                }).then(function(blobRes){
                  newTreeEntries.push({path:fileName, mode:'100644', type:'blob', sha:blobRes.sha});
                  arr[i] = fileName;
                });
              }
            })(i);
          }
        }
        handleArr(q.images);
        if(q.choiceImages){ q.choiceImages.forEach(function(carr){ handleArr(carr); }); }
      });
    });
    return uploadPromise.then(function(){ info.newTreeEntries = newTreeEntries; info.totalImgs = totalImgs; return info; });
  }).then(function(info){
    var marker = '/* === NEW_EXAM_PACK_DATA_INSERT_POINT === */';
    if(info.indexHtml.indexOf(marker)===-1) throw new Error('Không tìm thấy điểm chèn trong index.html — dừng lại để tránh hỏng file.');
    var block = '\n/* ==== Đề mới đăng từ app lúc '+new Date().toISOString()+' ==== */\n'+
      '(function(){\n  var NEW_TESTS_FROM_APP = '+JSON.stringify(unpublished, null, 2)+';\n'+
      '  NEW_TESTS_FROM_APP.forEach(function(t){ tests.push(t); });\n})();\n\n';
    info.newIndexHtml = info.indexHtml.replace(marker, block+marker);
    return info;
  }).then(function(info){
    self.showToast('⏳ Đang cập nhật index.html...', 'info');
    return GithubPublish.api(cfg, '/git/blobs', {method:'POST', body:{content: GithubPublish.utf8ToBase64(info.newIndexHtml), encoding:'base64'}}).then(function(blobRes){
      info.newTreeEntries.push({path:'index.html', mode:'100644', type:'blob', sha:blobRes.sha});
      return info;
    });
  }).then(function(info){
    return GithubPublish.api(cfg, '/git/trees', {method:'POST', body:{base_tree: info.treeSha, tree: info.newTreeEntries}}).then(function(treeRes){
      info.newTreeSha = treeRes.sha; return info;
    });
  }).then(function(info){
    var msg = 'Đăng '+unpublished.length+' đề mới từ app - '+new Date().toISOString().slice(0,10);
    return GithubPublish.api(cfg, '/git/commits', {method:'POST', body:{message:msg, tree:info.newTreeSha, parents:[info.latestCommitSha]}}).then(function(commitRes){
      info.newCommitSha = commitRes.sha; return info;
    });
  }).then(function(info){
    return GithubPublish.api(cfg, '/git/refs/heads/'+cfg.branch, {method:'PATCH', body:{sha: info.newCommitSha}}).then(function(){ return info; });
  }).then(function(info){
    unpublished.forEach(function(t){ t.publishedToWeb = true; });
    DB.save();
    self.showToast('✅ Đã đăng '+unpublished.length+' đề ('+info.totalImgs+' ảnh) lên web thành công!', 'success');
    self.render();
  }).catch(function(err){
    if(window.console) console.error(err);
    self.showToast('❌ Lỗi khi đăng lên GitHub: '+(err && err.message ? err.message : err), 'error');
  });
};

      btn.style.cssText = 'position:fixed;bottom:160px;right:16px;z-index:99999;padding:10px 16px;background:#059669;color:#fff;border:none;border-radius:8px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;font-weight:600;';

<script>
/* ===== TIM KIEM DE THI trong "Danh sach de thi" (them 2026-10-30) ===== */
(function(){
  if(typeof App === 'undefined' || App.__testSearchInstalled) return;
  App.__testSearchInstalled = true;
  App.testSearchQuery = '';

  /* Bo dau tieng Viet + chu thuong, de go "toan" van tim ra "Toán" */
  function norm(s){
    return String(s || '').toLowerCase().replace(/đ/g, 'd')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
  }

  function applyFilter(){
    var q = norm(App.testSearchQuery), words = q ? q.split(' ') : [];
    var total = 0, shown = 0;
    var cards = document.querySelectorAll('.main .card .table-wrap');
    Array.prototype.forEach.call(cards, function(wrap){
      var card = wrap.parentElement, rows = wrap.querySelectorAll('tbody tr'), cardShown = 0;
      Array.prototype.forEach.call(rows, function(tr){
        var cell = tr.querySelector('td');
        var text = norm(cell ? cell.textContent : tr.textContent);
        var ok = words.every(function(w){ return text.indexOf(w) !== -1; });
        tr.style.display = ok ? '' : 'none';
        total++; if(ok){ shown++; cardShown++; }
      });
      card.style.display = (words.length && !cardShown) ? 'none' : '';
      var badge = card.querySelector('h4 .badge');
      if(badge){
        if(badge.getAttribute('data-orig') === null) badge.setAttribute('data-orig', badge.textContent);
        badge.textContent = words.length ? (cardShown + '/' + rows.length + ' đề') : badge.getAttribute('data-orig');
      }
    });
    var info = document.getElementById('testSearchInfo');
    if(info){
      info.textContent = !words.length ? (total + ' đề')
        : (shown ? ('Tìm thấy ' + shown + '/' + total + ' đề') : 'Không tìm thấy đề nào khớp "' + App.testSearchQuery.trim() + '"');
      info.style.color = (words.length && !shown) ? '#dc2626' : '';
    }
  }

  function setupBar(){
    var main = document.querySelector('.main');
    if(!main) return;
    var old = document.getElementById('testSearchBar');
    if(old) old.parentNode.removeChild(old);
    var bar = document.createElement('div');
    bar.id = 'testSearchBar';
    bar.className = 'card';
    bar.style.cssText = 'position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px';
    bar.innerHTML = '<span style="font-size:18px">🔍</span>' +
      '<input id="testSearchInput" type="search" autocomplete="off" placeholder="Tìm đề theo tên… (vd: Phân số, GHK1, PET Test 2 — không cần gõ dấu)" ' +
      'style="flex:1;min-width:220px;padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:transparent;color:inherit">' +
      '<button type="button" id="testSearchClear" class="btn btn-sm btn-outline">✕ Xóa</button>' +
      '<span id="testSearchInfo" class="hint"></span>';
    var topbar = main.querySelector('.topbar');
    if(topbar && topbar.parentNode === main) main.insertBefore(bar, topbar.nextSibling);
    else main.insertBefore(bar, main.firstChild);
    var input = document.getElementById('testSearchInput');
    input.value = App.testSearchQuery;
    input.addEventListener('input', function(){ App.testSearchQuery = input.value; applyFilter(); });
    input.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ input.value = ''; App.testSearchQuery = ''; applyFilter(); } });
    document.getElementById('testSearchClear').addEventListener('click', function(){
      input.value = ''; App.testSearchQuery = ''; applyFilter(); input.focus();
    });
    applyFilter();
  }

  /* Sau moi lan ve lai man hinh "Danh sach de thi" thi gan lai o tim kiem (va giu nguyen tu khoa dang go) */
  var origRender = App.render;
  App.render = function(){
    var r = origRender.apply(this, arguments);
    try{ if(this.state && this.state.view === 'teacherTests') setupBar(); }
    catch(err){ if(window.console) console.error('Loi o tim kiem de:', err); }
    return r;
  };
})();
</script>

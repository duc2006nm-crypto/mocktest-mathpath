   - Kiểm tra ngữ pháp/chính tả qua endpoint cộng đồng miễn phí của LanguageTool (api.languagetool.org).
     Nếu không có mạng hoặc endpoint lỗi, hệ thống tự chuyển sang chấm chỉ dựa vào chỉ số văn bản (không chặn việc nộp bài). */
var GradingEngine = {
  FILLER_RE: /\b(um+|uh+|erm+|hmm+|like|you know|i mean|actually|basically|sort of|kind of)\b/gi,
  STOPWORDS: {the:1,a:1,an:1,to:1,is:1,are:1,was:1,were:1,be:1,been:1,being:1,you:1,your:1,yours:1,and:1,that:1,this:1,these:1,those:1,with:1,for:1,of:1,in:1,on:1,at:1,it:1,its:1,he:1,she:1,they:1,them:1,we:1,i:1,my:1,me:1,do:1,did:1,does:1,will:1,would:1,can:1,could:1,should:1,must:1,from:1,by:1,as:1,or:1,but:1,if:1,so:1,not:1,no:1,yes:1,have:1,has:1,had:1,there:1,here:1,about:1,also:1,very:1,much:1,many:1,than:1,then:1,when:1,what:1,which:1,who:1,whom:1,where:1,why:1,how:1,into:1,out:1,up:1,down:1,over:1,under:1,again:1,all:1,any:1,each:1,other:1,some:1,such:1,own:1,same:1,too:1,just:1,because:1,dear:1,hi:1,hello:1,thanks:1,thank:1,best:1,regards:1,love:1,am:1,im:1,us:1,our:1,want:1,wants:1,wanted:1},
  INSTRUCTION_WORDS: {write:1,words:1,word:1,more:1,email:1,question:1,questions:1,look:1,picture:1,pictures:1,story:1,shown:1,following:1,below:1,part:1,friend:1,english:1,say:1,tell:1,ask:1,answer:1},

  extractKeywords:function(text, opts){
    opts = opts || {};
    var stop = this.STOPWORDS, instr = opts.dropInstructionWords ? this.INSTRUCTION_WORDS : {};
    var words = String(text||'').toLowerCase().replace(/[^a-zà-ỹ\s']/g,' ').split(/\s+/).filter(Boolean);
    var out = [];
    var seen = {};
    words.forEach(function(w){
      w = w.replace(/'s$/,'');
      if(w.length<3 || stop[w] || instr[w] || seen[w]) return;
      seen[w]=true; out.push(w);
    });
    return out;
  },

  /* Tách các gạch đầu dòng yêu cầu nội dung (VD: "- ask Toni to go swimming...") từ đề bài,
     dùng để kiểm tra học sinh có thực sự trả lời đúng yêu cầu hay bị lạc đề. */
  extractRequirementBullets:function(content){
    var lines = String(content||'').split(/\n/).map(function(l){return l.trim();});
    return lines.filter(function(l){ return /^[-•*]\s*\S/.test(l); }).map(function(l){ return l.replace(/^[-•*]\s*/,''); });
  },

  /* So sánh nội dung bài làm với yêu cầu đề bài (dựa trên từ khóa) để phát hiện bài LẠC ĐỀ —
     đây là phần quan trọng để tránh cho điểm cao nhầm cho bài viết đúng ngữ pháp nhưng không
     trả lời đúng yêu cầu đề. Không dùng AI/LLM (miễn phí, chạy hoàn toàn offline trong trình duyệt). */
  computeTopicRelevance:function(promptContent, answerText){
    var self = this;
    var answerLower = ' '+String(answerText||'').toLowerCase().replace(/[^a-zà-ỹ\s']/g,' ')+' ';
    function present(word){ return answerLower.indexOf(' '+word+' ')>=0 || answerLower.indexOf(' '+word)>=0; }
    var bullets = this.extractRequirementBullets(promptContent);
    if(bullets.length>=2){
      var bulletKeywords = bullets.map(function(b){ return self.extractKeywords(b, {dropInstructionWords:true}); });
      var freq = {};
      bulletKeywords.forEach(function(kws){ kws.forEach(function(w){ freq[w]=(freq[w]||0)+1; }); });
      var bulletScores = bulletKeywords.map(function(kws){
        if(!kws.length) return 1;
        // Chi xet cac tu khoa RIENG cua gach dau dong nay (khong dung chung voi gach dau dong khac) —
        // tu chung (VD: lap lai o nhieu gach dau dong) khong giup phan biet duoc y nay co duoc tra loi hay khong.
        var unique = kws.filter(function(w){ return freq[w]===1; });
        if(!unique.length) return 0.4; // khong con tu khoa nao dac trung rieng -> khong the xac dinh chac chan, cho diem trung tinh thap
        var matched = unique.filter(present).length;
        return matched/unique.length;
      });
      var missingBullets = bullets.filter(function(b,i){ return bulletScores[i]<0.4; });
      var ratio = bulletScores.reduce(function(a,b){return a+b;},0)/bulletScores.length;
      return {ratio:ratio, bulletsTotal:bullets.length, bulletsAddressed:bullets.length-missingBullets.length, missingBullets:missingBullets};
    }
    // Khong co gach dau dong ro rang (VD: de ta tranh) -> so sanh tong quat tu khoa cua ca de bai
    var promptKeywords = this.extractKeywords(promptContent, {dropInstructionWords:true});
    if(!promptKeywords.length) return {ratio:1, bulletsTotal:0, bulletsAddressed:0, missingBullets:[]};
    var matched = promptKeywords.filter(function(w){ return present(w); });
    return {ratio: matched.length/promptKeywords.length, bulletsTotal:0, bulletsAddressed:0, missingBullets:[]};
  },

  /* Trich danh sach loi ngu phap/chinh ta cu the (kem goi y sua) tu ket qua LanguageTool,
     de hoc sinh biet CHINH XAC cho nao sai va nen sua thanh gi — thay vi chi bao % chung chung. */
  extractGrammarIssuesDetail:function(matches, limit){
    limit = limit || 8;
    return (matches||[]).slice(0, limit).map(function(m){
      var original = '';
      try{
        if(m.context && typeof m.context.text==='string'){
          original = m.context.text.substr(m.context.offset, m.context.length);
        }
      }catch(e){}
      var suggestion = (m.replacements && m.replacements.length) ? m.replacements.slice(0,3).map(function(r){return r.value;}).join(' / ') : '';
      return {original:original, suggestion:suggestion, message:m.message||m.shortMessage||''};
    });
  },

  computeTextMetrics:function(text){
    text = String(text||'');
    var words = text.trim().length ? text.trim().split(/\s+/) : [];
    var wordCount = words.length;
    var sentences = text.split(/[.!?]+/).map(function(s){return s.trim();}).filter(Boolean);
    var sentenceCount = Math.max(1, sentences.length);
    var avgSentenceLen = wordCount / sentenceCount;
    var lower = words.map(function(w){ return w.toLowerCase().replace(/[^a-zà-ỹ']/g,''); }).filter(Boolean);
    var uniq = {};
    lower.forEach(function(w){ uniq[w]=true; });
    var uniqCount = Object.keys(uniq).length;
    var ttr = lower.length ? uniqCount/lower.length : 0;
    var longWords = lower.filter(function(w){ return w.length>=7; }).length;
    var longWordRatio = lower.length ? longWords/lower.length : 0;
    return {wordCount:wordCount, sentenceCount:sentenceCount, avgSentenceLen:avgSentenceLen, ttr:ttr, longWordRatio:longWordRatio};
  },

  computeSpeakingMetrics:function(transcript, durationSec){
    var base = this.computeTextMetrics(transcript);
    var dur = Math.max(1, durationSec||1);
    var wpm = base.wordCount / (dur/60);
    var fillerMatches = String(transcript||'').match(this.FILLER_RE) || [];
    var fillerCount = fillerMatches.length;
    var fillerRatio = base.wordCount ? fillerCount/base.wordCount : 0;
    base.wpm = wpm;
    base.fillerCount = fillerCount;
    base.fillerRatio = fillerRatio;
    return base;
  },

  fetchGrammarMatches:function(text){
    text = String(text||'').trim();
    if(!text) return Promise.resolve({matches:[], offline:false});
    if(typeof fetch !== 'function') return Promise.resolve({matches:[], offline:true});
    return fetch('https://api.languagetool.org/v2/check', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'text='+encodeURIComponent(text)+'&language=en-US'
    }).then(function(res){
      if(!res.ok) throw new Error('languagetool http '+res.status);
      return res.json();
    }).then(function(data){
      return {matches: (data && data.matches) || [], offline:false};
    }).catch(function(){
      return {matches:[], offline:true};
    });
  },

  grammarScoreRatio:function(matches, wordCount){
    matches = matches || [];
    if(!wordCount) wordCount = 1;
    var weighted = matches.reduce(function(sum, m){
      var cat = (m.rule && m.rule.issueType) || (m.rule && m.rule.category && m.rule.category.id) || '';
      cat = String(cat).toLowerCase();
      var weight = (cat.indexOf('spell')>=0 || cat.indexOf('grammar')>=0) ? 1.0 : 0.5;
      return sum + weight;
    }, 0);
    var errorsPer100 = (weighted / wordCount) * 100;
    var ratio = 1 - (errorsPer100 / 15);
    return Math.max(0, Math.min(1, ratio));
  },

  scoreWriting:function(question, metrics, grammarResult, answerText){
    var maxPoints = question.points || 1;
    var minWords = question.minWords || 25;
    var lengthRatio = metrics.wordCount>=minWords ? 1 : (metrics.wordCount / Math.max(1,minWords));
    var relevance = this.computeTopicRelevance(question.content, answerText||'');
    var grammarRatio = this.grammarScoreRatio(grammarResult.matches, metrics.wordCount);
    var lexicalRatio = Math.min(1, metrics.ttr*1.3 + metrics.longWordRatio*0.8);
    var idealLen = 12;
    var lenDiff = Math.abs(metrics.avgSentenceLen - idealLen) / idealLen;
    var coherenceRatio = Math.max(0, 1 - lenDiff*0.6) * Math.min(1, metrics.sentenceCount/3);
    var overallRatio = lengthRatio*0.15 + relevance.ratio*0.25 + grammarRatio*0.25 + lexicalRatio*0.15 + coherenceRatio*0.20;
    // Chan diem toi da neu bai LAC DE nghiem trong (khong dat yeu cau noi dung de bai) — du ngu phap/tu vung tot
    // van khong duoc cham diem cao, giong nhu cach giao vien thuc te se cham (Task Achievement).
    if(relevance.ratio < 0.35){
      var cap = 0.15 + relevance.ratio*0.6;
      overallRatio = Math.min(overallRatio, cap);
    }
    overallRatio = Math.max(0, Math.min(1, overallRatio));
    var score = Math.round(overallRatio*maxPoints*2)/2;
    var issues = [];
    if(metrics.wordCount < minWords) issues.push('Bài viết chưa đủ số từ tối thiểu ('+metrics.wordCount+'/'+minWords+' từ).');
    if(relevance.ratio < 0.35){
      if(relevance.bulletsTotal>0){
        issues.push('⚠️ Bài viết CHƯA trả lời đúng yêu cầu đề bài (lạc đề) — còn thiếu '+relevance.missingBullets.length+'/'+relevance.bulletsTotal+' ý bắt buộc: '+relevance.missingBullets.map(function(b){return '"'+b+'"';}).join('; ')+'.');
      } else {
        issues.push('⚠️ Bài viết có vẻ CHƯA bám sát nội dung/chủ đề của đề bài.');
      }
    } else if(relevance.bulletsTotal>0 && relevance.bulletsAddressed<relevance.bulletsTotal){
      issues.push('Còn thiếu '+(relevance.bulletsTotal-relevance.bulletsAddressed)+'/'+relevance.bulletsTotal+' ý yêu cầu trong đề bài: '+relevance.missingBullets.map(function(b){return '"'+b+'"';}).join('; ')+'.');
    }
    var grammarIssues = this.extractGrammarIssuesDetail(grammarResult.matches);
    if(grammarResult.offline) issues.push('Không kết nối được dịch vụ kiểm tra ngữ pháp trực tuyến — điểm chỉ dựa trên độ dài, chủ đề & từ vựng.');
    return {
      score:score, maxPoints:maxPoints,
      breakdown:{task:Math.round(lengthRatio*100), relevance:Math.round(relevance.ratio*100), grammar:Math.round(grammarRatio*100), lexical:Math.round(lexicalRatio*100), coherence:Math.round(coherenceRatio*100)},
      wordCount:metrics.wordCount, grammarMatches:(grammarResult.matches||[]).length, grammarIssues:grammarIssues,
      relevanceInfo:relevance, issues:issues, offline:!!grammarResult.offline
    };
  },

  scoreSpeaking:function(question, metrics, grammarResult, transcript){
    var maxPoints = question.points || 1;
    var minWords = question.minWords || 15;
    var wpmRatio;
    if(metrics.wpm>=90 && metrics.wpm<=150) wpmRatio = 1;
    else if(metrics.wpm<90) wpmRatio = Math.max(0, metrics.wpm/90);
    else wpmRatio = Math.max(0, 1 - (metrics.wpm-150)/150);
    var fillerPenalty = Math.min(0.5, metrics.fillerRatio*3);
    var fluencyRatio = Math.max(0, wpmRatio - fillerPenalty);
    var grammarRatio = this.grammarScoreRatio(grammarResult.matches, metrics.wordCount);
    var lexicalRatio = Math.min(1, metrics.ttr*1.3 + metrics.longWordRatio*0.8);
    var lengthRatio = Math.min(1, metrics.wordCount / Math.max(1,minWords));
    var relevance = this.computeTopicRelevance(question.content, transcript||'');
    var contentRatio = lengthRatio * (0.15 + 0.85*relevance.ratio);
    var overallRatio = fluencyRatio*0.30 + grammarRatio*0.20 + lexicalRatio*0.15 + contentRatio*0.35;
    if(relevance.ratio < 0.35){
      var cap2 = 0.15 + relevance.ratio*0.6;
      overallRatio = Math.min(overallRatio, cap2);
    }
    overallRatio = Math.max(0, Math.min(1, overallRatio));
    var score = Math.round(overallRatio*maxPoints*2)/2;
    var issues = [];
    if(metrics.wordCount < minWords) issues.push('Câu trả lời quá ngắn ('+metrics.wordCount+'/'+minWords+' từ tối thiểu).');
    if(metrics.fillerCount>0) issues.push('Có '+metrics.fillerCount+' từ đệm (um, uh, like...) — nên nói trôi chảy hơn.');
    if(relevance.ratio < 0.35) issues.push('⚠️ Câu trả lời có vẻ CHƯA đúng chủ đề câu hỏi.');
    var grammarIssues = this.extractGrammarIssuesDetail(grammarResult.matches);
    if(grammarResult.offline) issues.push('Không kết nối được dịch vụ kiểm tra ngữ pháp trực tuyến — điểm chỉ dựa trên tốc độ nói, chủ đề & từ vựng.');
    return {
      score:score, maxPoints:maxPoints,
      breakdown:{fluency:Math.round(fluencyRatio*100), grammar:Math.round(grammarRatio*100), lexical:Math.round(lexicalRatio*100), content:Math.round(contentRatio*100)},
      wordCount:metrics.wordCount, wpm:Math.round(metrics.wpm), fillerCount:metrics.fillerCount, grammarMatches:(grammarResult.matches||[]).length,
      grammarIssues:grammarIssues, relevanceInfo:relevance, issues:issues, offline:!!grammarResult.offline
    };
  },

  gradeWritingAnswer:function(question, text){
    var self = this;
    var metrics = this.computeTextMetrics(text);
    return this.fetchGrammarMatches(text).then(function(grammarResult){
      return self.scoreWriting(question, metrics, grammarResult, text);
    });
  },

  gradeSpeakingAnswer:function(question, transcript, durationSec){
    var self = this;
    var metrics = this.computeSpeakingMetrics(transcript, durationSec);
    return this.fetchGrammarMatches(transcript).then(function(grammarResult){
      return self.scoreSpeaking(question, metrics, grammarResult, transcript);
    });
  }
};

/* --------------------------------- App state ------------------------------ */
var App = {
  state:{
    role:null,          // 'teacher' | 'student'
    user:null,           // student object or teacher object
    view:'login',
    loginRole:'teacher',
    loginError:'',
    params:{},
    testBuilder:null,    // temp state while building a test
    gradeTemp:{},        // temp manual scores while grading
    toast:null           // {msg, type} - transient success/error banner
  },

  init:function(){
    DB.load();
    this.render();
    this.initCloud();
  },
  /* Ket noi Cloud (neu da cau hinh FIREBASE_CONFIG) va tai ve de thi moi nhat. Neu chua cau hinh,
     hoac dang offline, app van chay binh thuong voi du lieu tren may — khong co loi hien thi cho
     hoc sinh. */
  _fetchTestsForRole:function(cb){
    var u = CloudDB.auth && CloudDB.auth.currentUser;
    var isStudent = !!(u && String(u.email||'').indexOf('@'+STUDENT_AUTH_DOMAIN) >= 0);
    var self = this;
    if(!isStudent){
      CloudDB.fetchTests(function(tests){
        cb(tests);
        try{
          CloudDB.syncCatalog((tests||[]).filter(function(t){ return t.source==='cloud'; }), function(ok, up, del){
            if(ok && (up||del)) self.showToast('🔄 Đã đồng bộ danh mục đề ('+up+' cập nhật, '+del+' xóa).', 'info');
          });
        }catch(err){ if(window.console) console.error(err); }
      });
      return;
    }
    CloudDB.fetchCatalog(function(ok, arr){
      if(ok && arr.length){ cb(arr); return; }
      CloudDB.fetchTests(cb);
    });
  },
  hydrateThenRender:function(testId){
    var self = this;
    if(!this._hydrating) this._hydrating = {};
    var st = this._hydrating[testId];
    if(!st){
      this._hydrating[testId] = 'loading'; st = 'loading';
      CloudDB.fetchTestFull(testId, function(ok, full){
        if(ok){
          var d = DB.get(); var i = d.tests.findIndex(function(x){ return x.id===testId; });
          if(i>=0) d.tests[i] = full; else d.tests.push(full);
          delete self._hydrating[testId];
        } else { self._hydrating[testId] = 'error:'+full; }
        self.render();
      });
    }
    if(String(st).indexOf('error:')===0){
      return '<div class="card"><div class="empty-state">⚠️ Không tải được nội dung đề ('+esc(String(st).slice(6))+').</div>'+
        '<div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><button class="btn btn-primary" onclick="App.retryHydrate(\''+testId+'\')">Thử lại</button> '+
        '<button class="btn btn-outline" onclick="App.goto(\'studentPractice\')">← Quay lại</button></div></div>';
    }
    return '<div class="card"><div class="empty-state">⏳ Đang tải nội dung đề...</div></div>';
  },
  retryHydrate:function(testId){ if(this._hydrating) delete this._hydrating[testId]; this.render(); },
  loadCloudContent:function(){
var self = this; var pending = 3; var done = false;
self._contentReady = false;
function fin(){
if(--pending>0 || done) return;
done = true; self._contentReady = true;
var q = self._contentWaiters || []; self._contentWaiters = [];
q.forEach(function(f){ try{ f(); }catch(err){ if(window.console) console.error(err); } });
}
self._fetchTestsForRole(function(cloudTests){
try{ DB.mergeCloudTests(cloudTests); }catch(err){ if(window.console) console.error(err); }
self.render(); fin();
});
CloudDB.fetchAllAssignments(function(cloudAssignments){
try{ DB.mergeCloudAssignments(cloudAssignments); }catch(err){ if(window.console) console.error(err); }
self.render(); fin();
});
/* Tài liệu học (thêm bởi Claude): tải cùng lúc cho CẢ giáo viên và học sinh, giống assignments. */
CloudDB.fetchMaterials(function(cloudMaterials){
try{ DB.mergeCloudMaterials(cloudMaterials); }catch(err){ if(window.console) console.error(err); }
self.render(); fin();
});
setTimeout(function(){ if(!done){ pending = 1; fin(); } }, 20000);
},
afterContent:function(fn){
if(this._contentReady || !this._contentUid){ fn(); return; }
(this._contentWaiters = this._contentWaiters || []).push(fn);
},
initCloud:function(){
    var ok = CloudDB.init();
    if(!ok) return;
    var self = this;
    this.wireAuthStateRouting();
  },
  /* Theo doi trang thai dang nhap Firebase de TU DONG khoi phuc phien (giao vien HOAC hoc sinh)
     moi khi tai lai trang, va de MOI THIET BI deu thay dung tai khoan/tin dung tren Cloud thay vi
     localStorage rieng tung may (them boi Claude — sua loi tin dung khong dong bo giua cac thiet
     bi). Phan biet giao vien/hoc sinh bang cach kiem tra co document students/{uid} hay khong:
     hoc sinh luon co doc nay (tao luc dang ky/duoc giao vien cap), tai khoan giao vien Admin Cloud
     thi khong bao gio co doc students/{uid} tuong ung. */
  wireAuthStateRouting:function(){
    var self = this;
    CloudDB.auth.onAuthStateChanged(function(user){
/* BAO VE DU LIEU: chi tai de thi/bai giao SAU KHI da dang nhap (luat Firestore chi cho tai khoan da dang nhap doc). */
if(user){ if(self._contentUid !== user.uid){ self._contentUid = user.uid; self.loadCloudContent(); } }
else{ self._contentUid = null; self._contentReady = false; try{ var d0 = DB.get(); d0.tests = (d0.tests||[]).filter(function(t){ return t.source!=='cloud'; }); }catch(err){} }
if(self._suppressAuthRoute) return;
      var cameFromLoginScreen = (!self.state.role || self.state.view==='login');
      if(!user){
        if(self.state.role){ self.state.role=null; self.state.user=null; self.goto('login'); }
        return;
      }
      var looksLikeStudentEmail = String(user.email||'').indexOf('@'+STUDENT_AUTH_DOMAIN) >= 0;
      CloudDB.fetchMyStudentDoc(user.uid, function(found, studentDataOrErr){
        if(found){
          var db = DB.get();
          db.students = [studentDataOrErr];
          self.state.role='student'; self.state.user=studentDataOrErr;
          CloudDB.fetchMySubmissions(user.uid, function(subs){
            DB.mergeCloudSubmissions(subs);
            self.afterContent(function(){ if(cameFromLoginScreen) self.goto('studentPractice'); else self.render(); });
          });
        } else if(looksLikeStudentEmail){
          CloudDB.auth.signOut();
          self.state.role=null; self.state.user=null;
          self.state.loginError = 'Tài khoản học sinh này đã bị xoá hoặc không hợp lệ. Liên hệ giáo viên.';
          self.goto('login');
        } else {
          var db2 = DB.get();
          self.state.role='teacher'; self.state.user=db2.teacher;
          CloudDB.fetchAllStudents(function(students){
            CloudDB.fetchAllClasses(function(classes){
              CloudDB.fetchAllSubmissions(function(subs){
                var db3 = DB.get();
                db3.students = students;
                db3.classes = classes;
                DB.mergeCloudSubmissions(subs);
                self.afterContent(function(){ if(cameFromLoginScreen) self.goto('teacherDashboard'); else self.render(); });
              });
            });
          });
        }
      });
    });
  },
  /* Goi ngay sau khi tao/sua 1 de thi tren may — NEU dang dang nhap Admin Cloud thi tu dong day
     de len Cloud de moi hoc sinh o moi thiet bi khac deu thay ban moi nhat. Neu chua dang nhap
     Admin Cloud (hoac chua cau hinh Cloud), khong lam gi ca — de chi luu tren may nhu truoc. */
  syncTestToCloudIfAdmin:function(test){
    if(!(CloudDB.ready && CloudDB.currentAdmin)) return;
    test.source = 'cloud';
    var self = this;
    CloudDB.saveTest(test, function(ok, info){
      self.showToast(ok ? '☁️ Đã đồng bộ đề lên Cloud — mọi người sẽ thấy bản mới nhất.' : ('⚠️ Không đồng bộ được lên Cloud: '+info), ok?'success':'error');
      self.render();
    });
  },
  syncTestDeleteIfAdmin:function(testId){
    if(!(CloudDB.ready && CloudDB.currentAdmin)) return;
    CloudDB.deleteTest(testId, function(ok, info){
      if(!ok){ App.showToast('⚠️ Không xoá được trên Cloud: '+info, 'error'); App.render(); }
    });
  },
  syncSubmissionToCloud:function(sub, opts){
    if(!(isCloudConfigured() && CloudDB.ready)) return;
    var showErrorToast = opts && opts.showErrorToast;
    var self = this;
    CloudDB.saveSubmissionCloud(sub, function(ok, err){
      if(!ok){
        if(window.console) console.error('Đồng bộ bài nộp lên Cloud thất bại:', err);
        if(showErrorToast) self.showToast('⚠️ Đã lưu điểm trên máy nhưng KHÔNG đồng bộ được lên Cloud: '+err, 'error');
      }
    });
  },
  /* Nut "Day len Cloud" THU CONG cho 1 de da co san (vi du: de duoc tao qua seed()/migrate() khi
     mo file lan dau, hoac de da tung tao truoc khi dang nhap Admin Cloud) — khac voi
     syncTestToCloudIfAdmin (chi tu chay ngam sau khi tao/sua de qua form), ham nay CHO PHEP giao
     vien chu dong bam de day BAT KY de co san nao len Cloud, va LUON bao ro ket qua (kem huong dan
     neu chua cau hinh/chua dang nhap) thay vi im lang bo qua. */
  pushTestToCloud:function(testId){
    var db = DB.get();
    var t = (db.tests||[]).find(function(x){ return x.id===testId; });
    if(!t){ this.showToast('Không tìm thấy đề thi này.', 'error'); return; }
    if(!isCloudConfigured()){
      this.showToast('☁️ Cloud chưa được cấu hình — xem hướng dẫn HUONG-DAN-KET-NOI-CLOUD.md trước.', 'error');
      return;
    }
    if(!(CloudDB.ready && CloudDB.currentAdmin)){
      this.showToast('Bạn cần đăng nhập Admin Cloud trước khi đẩy đề lên.', 'error');
      this.openCloudLoginModal();
      return;
    }
    var self = this;
    t.source = 'cloud';
    CloudDB.saveTest(t, function(ok, info){
      if(ok){
        var savedLocally = DB.save();
        if(savedLocally){
          self.showToast('☁️ Đã đẩy đề "'+t.title+'" lên Cloud — mọi thiết bị khác sẽ thấy bản này.', 'success');
        }else{
          /* Cloud da luu thanh cong (Firestore OK) - chi la cache tren MAY nay khong luu duoc vi
             bo nho trinh duyet day. Phai bao dung su that, KHONG duoc noi "day len Cloud that bai"
             vi de nay THUC SU da co tren Cloud roi. */
          self.showToast('☁️ Đã đẩy đề "'+t.title+'" lên Cloud thành công. (Lưu ý: máy này không lưu được bản cache cục bộ vì bộ nhớ trình duyệt đã đầy — không ảnh hưởng dữ liệu trên Cloud. Nên xuất file sao lưu rồi dọn bớt audio cũ.)', 'success');
        }
      }else{
        self.showToast('⚠️ Đẩy lên Cloud thất bại: '+info, 'error');
      }
      self.render();
    });
  },
  /* Xuat file sao luu (.json) toan bo du lieu (de thi, ngan hang cau hoi, lop, hoc sinh...) xuong
     may cua giao vien -- phong khi Cloud gap su co (mat mang, sai cau hinh, lo tai khoan...) thi
     van co ban sao rieng tren may de khoi phuc thu cong. Tach rieng buildBackupData() (thuan tuy
     tao du lieu, de test duoc) voi exportBackup() (phan kich hoat tai file xuong trinh duyet). */
  buildBackupData:function(){
    var d = DB.get();
    return {
      exportedAt: new Date().toISOString(),
      appVersion: 'v16',
      teacher: d.teacher ? {username: d.teacher.username, name: d.teacher.name} : null,
      classes: d.classes || [],
      students: d.students || [],
      bank: d.bank || [],
      tests: d.tests || [],
      assignments: d.assignments || [],
      submissions: d.submissions || [],
      progress: d.progress || {}
    };
  },
  exportBackup:function(){
    try{
      var data = this.buildBackupData();
      var json = JSON.stringify(data, null, 2);
      var blob = new Blob([json], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      var dateStr = new Date().toISOString().slice(0,10);
      a.download = 'mocktest-sao-luu-' + dateStr + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      this.showToast('⬇️ Đã tải file sao lưu về máy — giữ file này phòng khi Cloud gặp sự cố.', 'success');
    }catch(e){
      this.showToast('Không thể tạo file sao lưu: ' + (e && e.message ? e.message : e), 'error');
    }
  },

  /* Mo modal dang nhap Admin Cloud (Firebase Auth) — tach rieng voi tai khoan "giao vien" cuc bo
     hien tai (chi la kiem tra don gian, khong phai xac thuc that). Chi tai khoan Admin Cloud moi
     co quyen ghi/xoa de len Cloud (theo Firestore Security Rules ban thiet lap). */
  openCloudLoginModal:function(){
    var html = ''+
      '<h3>☁️ Đăng nhập Admin Cloud</h3>'+
      '<div class="hint" style="margin-bottom:12px">Đăng nhập để đề thi bạn tạo/sửa tự động đồng bộ lên Cloud cho mọi học sinh, mọi thiết bị.</div>'+
      '<form onsubmit="return App.submitCloudLogin(event)">'+
        '<label>Email Admin</label><input name="email" type="email" required>'+
        '<label>Mật khẩu</label><input name="password" type="password" required>'+
        (CloudDB.lastError ? '<div class="import-warning">'+esc(CloudDB.lastError)+'</div>' : '')+
        '<button class="btn btn-primary" style="margin-top:10px" type="submit">Đăng nhập</button>'+
      '</form>';
    this.openModal(html);
  },
  submitCloudLogin:function(e){
    e.preventDefault();
    var f = e.target;
    var email = f.email.value.trim(), pass = f.password.value;
    var self = this;
    CloudDB.loginAdmin(email, pass, function(ok, info){
      if(ok){ self.closeModal(); self.showToast('☁️ Đã đăng nhập Admin Cloud.', 'success'); }
      else{ CloudDB.lastError = info; self.openCloudLoginModal(); }
      self.render();
    });
    return false;
  },
  cloudLogout:function(){
    CloudDB.logoutAdmin();
    this.showToast('Đã đăng xuất Admin Cloud — đề thi mới sẽ chỉ lưu trên máy này.', 'info');
  },
  renderCloudStatusWidget:function(){
    if(!isCloudConfigured()){
      return '<div class="hint">☁️ Chưa kết nối Cloud — đề thi hiện chỉ lưu trên máy này. Xem hướng dẫn thiết lập để admin cập nhật đề liên tục cho mọi người.</div>';
    }
    if(CloudDB.currentAdmin){
      return '<div class="hint">☁️ Đã đăng nhập Cloud: <b>'+esc(CloudDB.currentAdmin.email||'')+'</b> — đề tạo/sửa sẽ tự đồng bộ. <a onclick="App.cloudLogout()">Đăng xuất</a></div>';
    }
    return '<div class="hint">☁️ Cloud đã sẵn sàng nhưng chưa đăng nhập Admin. <a onclick="App.openCloudLoginModal()">🔑 Đăng nhập Admin Cloud</a> để đề tự đồng bộ cho mọi người.</div>';
  },

  goto:function(view, params){
    this.state.view = view;
    this.state.params = params || {};
    this.state.loginError='';
    if(view!=='teacherTests') this.state.justPublishedId = null;
    this.render();

  submitLogin:function(e){
    e.preventDefault();

          this.state.role='teacher'; this.state.user=db.teacher;

        } else {
          this.state.loginError = 'Sai tài khoản hoặc mật khẩu giáo viên.'; this.render();
        }
      } else {
        var stu = db.students.find(function(s){ return s.username===u && s.password===p; });
        if(stu){
          this.state.role='student'; this.state.user=stu;
          this.goto('studentPractice');
        } else {
          this.state.loginError = 'Sai tài khoản hoặc mật khẩu học sinh.'; this.render();
        }
      }
      return false;
    }
    this.state.loginError='';
    this.state.loginPending = true;
    this.render();
    if(this.state.loginRole==='teacher'){
      CloudDB.loginAdmin(u, p, function(ok, info){
        self.state.loginPending = false;
        if(!ok){ self.state.loginError = 'Sai email hoặc mật khẩu Admin (' + info + ').'; self.render(); }
        /* ok=true: wireAuthStateRouting() se tu dong nhan dang va chuyen sang Bảng điều khiển. */
      });
    } else {
      CloudDB.loginStudent(u, p, function(ok, info){
        self.state.loginPending = false;
        if(!ok){ self.state.loginError = info || 'Sai tài khoản hoặc mật khẩu học sinh.'; self.render(); }

  /* ---------------- Đọc to câu hỏi (Text-to-speech) ---------------- */
  speak:function(el){
    try{
      if(!el || !('speechSynthesis' in window)){
        alert('Trình duyệt này chưa hỗ trợ đọc to. Hãy thử trên Chrome/Edge bản mới nhất.');
        return;
      }
      window.speechSynthesis.cancel();
      var qtextEl = el.querySelector ? el.querySelector('.qtext') : null;
      var text = qtextEl ? qtextEl.innerText : (el.innerText || '');
      var choiceEls = el.querySelectorAll ? el.querySelectorAll('.choice-row') : [];
      if(choiceEls.length){
        var parts=[text];
        for(var i=0;i<choiceEls.length;i++){
          parts.push(choiceEls[i].innerText.replace(/✓|Đáp án đúng|HS chọn|Đúng|Sai/g,'').trim());
        }
        text = parts.join('. ');
      }
      if(!text || !text.trim()) return;
      var isEnglish = /^[\x00-\x7F\s]*$/.test(text);
      var u = new SpeechSynthesisUtterance(text);
      u.lang = isEnglish ? 'en-US' : 'vi-VN';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }catch(e){ /* im lặng bỏ qua nếu trình duyệt không hỗ trợ */ }
  },

  /* ---------------- Sao & chuỗi luyện tập (gamification nhẹ) ---------------- */
  getProgress:function(studentId){
    var db = DB.get();
    if(!db.progress) db.progress = {};
    if(!db.progress[studentId]) db.progress[studentId] = {stars:0, streak:0, bestStreak:0, lastPracticeDay:null};
    return db.progress[studentId];
  },
  bumpProgress:function(studentId, scorePct){
    var db = DB.get();
    var p = this.getProgress(studentId);
    var oneDay = 24*60*60*1000;
    var today = new Date(); today.setHours(0,0,0,0);
    var todayKey = today.getTime();
    if(p.lastPracticeDay !== todayKey){
      p.streak = (p.lastPracticeDay === todayKey - oneDay) ? (p.streak + 1) : 1;
      p.lastPracticeDay = todayKey;
      if(p.streak > (p.bestStreak||0)) p.bestStreak = p.streak;
    }
    if(scorePct >= 0.9) p.stars += 3;
    else if(scorePct >= 0.7) p.stars += 1;
    DB.save();
    return p;
  },
  celebrationFor:function(pct){

    if(pct>=0.7) return {emoji:'🌟', title:'Giỏi lắm!', msg:'Con đã làm rất tốt bài này!', confetti:true};

    return {emoji:'💪', title:'Đừng nản lòng!', msg:'Luyện tập thêm sẽ giúp con tiến bộ rất nhiều đó!', confetti:false};

  confettiHtml:function(){
    var colors = ['#EE4035','#2EA8E0','#FFC93C','#3FBF83','#8B5CF6'];
    var pieces = '';
    for(var i=0;i<18;i++){
      var left = (i*97 % 100);
      var delay = (i%6)*0.12;
      var color = colors[i%colors.length];
      pieces += '<span class="confetti-piece" style="left:'+left+'%;background:'+color+';animation-delay:'+delay+'s;"></span>';
    }
    return pieces;

  printTest:function(testId){

    if(!t) return;
    var qHtml = t.questions.map(function(q, idx){
      var body='';
      if(q.type==='mc'){
        body = '<div style="margin:6px 0 0 14px">'+q.choices.map(function(c,i){
          var choiceImg = (q.choiceImages && q.choiceImages[i] && q.choiceImages[i].length) ?
            q.choiceImages[i].map(function(src){return '<img src="'+src+'" style="max-width:120px;display:block;margin:4px 0">';}).join('') : '';
          return '<div>'+choiceLabelText(q,i,c)+choiceImg+'</div>';
        }).join('')+'</div>';
      } else if(q.type==='short'){
        body = '<div style="margin-top:6px">Trả lời: ______________________________________</div>';
      } else {
        body = '<div style="margin-top:10px;border-bottom:1px solid #999;height:70px"></div>';
      }
      var imgHtml = (q.images && q.images.length) ? q.images.map(function(src){ return '<img src="'+src+'" style="max-width:280px;display:block;margin:8px 0">'; }).join('') : '';
      var listenNote = q.audioScript ? '<div style="color:#b45309;font-size:12px;margin-bottom:4px">🔊 Câu hỏi thuộc phần Nghe — chỉ làm được trực tuyến trên máy tính, không có bản in kèm âm thanh.</div>' : '';
      return '<div style="margin-bottom:16px"><b>Câu '+(idx+1)+'.</b> '+listenNote+nl2br(q.content)+imgHtml+body+'</div>';
    }).join('');
    var answerKey = t.questions.map(function(q, idx){
      if(q.type==='mc') return (idx+1)+'. '+String.fromCharCode(65+q.correctIndex);
      if(q.type==='short') return (idx+1)+'. '+esc(String(q.correctAnswer||'').split('|')[0]);
      return (idx+1)+'. (tự luận)';
    }).join(' &nbsp;&nbsp; ');
    var win = window.open('', '_blank');

    win.document.write('<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>'+esc(t.title)+'</title>'+

      '</head><body>'+
      '<h1>'+esc(t.title)+'</h1>'+
      '<div class="meta">Thời gian làm bài: '+t.duration+' phút &nbsp;·&nbsp; Họ và tên: ________________________ &nbsp;·&nbsp; Lớp: ___________</div>'+
      qHtml+
      '<div class="answers"><b>Đáp án:</b> '+answerKey+'</div>'+
      '</body></html>');
    win.document.close();
    win.focus();
    setTimeout(function(){ win.print(); }, 300);

  submitCreditTopup:function(e, studentId){
    e.preventDefault();
    var f = e.target;
    var amount = parseInt(f.amount.value,10);
    if(!amount || amount<1){ alert('Vui lòng nhập số tín dụng hợp lệ.'); return false; }
    var reason = f.reason.value.trim() || 'Giáo viên nạp tín dụng';
    var db = DB.get();
    var stu = db.students.find(function(s){return s.id===studentId;});
    if(!stu) return false;
    var self = this;
    if(!isCloudConfigured()){
      stu.credits = (stu.credits||0) + amount;
      stu.creditLog = stu.creditLog || [];
      stu.creditLog.push({id:uid('cl'), delta:amount, reason:reason, at:Date.now()});
      DB.save(); this.closeModal(); this.render();
      this.showToast('💎 Đã nạp '+amount+' tín dụng cho '+stu.name+'. Số dư mới: '+stu.credits, 'success');
      return false;
    }
    this.closeModal();
    this.showToast('⏳ Đang nạp tín dụng...', 'info');
    CloudDB.addStudentCredit(studentId, amount, reason, function(ok, info){
      if(!ok){ self.showToast('⚠️ Nạp tín dụng thất bại: '+info, 'error'); return; }
      stu.credits = info.newBalance;
      stu.creditLog = info.newLog;
      self.render();
      self.showToast('💎 Đã nạp '+amount+' tín dụng cho '+stu.name+'. Số dư mới: '+stu.credits, 'success');
    });
    return false;
  },

  submitBulkStudents:function(e){
    e.preventDefault();
    var f = e.target;
    var classId = f.classId.value;
    var lines = f.bulk.value.split('\n').map(function(l){return l.trim();}).filter(Boolean);
    if(lines.length===0) return false;
    var db = DB.get();
    var self = this;
    if(!isCloudConfigured()){
      var created = 0;
      lines.forEach(function(line){
        var parts = line.split(',').map(function(p){return p.trim();});
        var name = parts[0]; if(!name) return;
        var username = parts[1] || (name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'') + Math.floor(Math.random()*900+100));
        var password = parts[2] || '123456';
        var i=1, base=username;
        while(db.students.some(function(s){return s.username===username;})){ username = base+i; i++; }
        db.students.push({id:uid('st'), name:name, username:username, password:password, classId:classId, timeMultiplier:1, credits:30, creditLog:[{id:uid('cl'), delta:30, reason:'Tín dụng miễn phí ban đầu (đủ mở 3 đề cao cấp bất kỳ)', at:Date.now()}]});
        created++;
      });
      DB.save(); this.closeModal(); this.render();
      alert('Đã tạo '+created+' tài khoản học sinh.');
      return false;
    }
    var parsed = [];
    lines.forEach(function(line){
      var parts = line.split(',').map(function(p){return p.trim();});
      var name = parts[0]; if(!name) return;
      var username = parts[1] || (name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'') + Math.floor(Math.random()*900+100));
      var password = parts[2] || '123456';
      var i=1, base=username;
      var existingUsernames = db.students.map(function(s){return s.username;}).concat(parsed.map(function(p){return p.username;}));
      while(existingUsernames.indexOf(username)>=0){ username = base+i; i++; }
      parsed.push({name:name, username:username, password:password});
    });
    if(!parsed.length){ this.closeModal(); alert('Không có dòng hợp lệ.'); return false; }
    this.closeModal();
    this.showToast('⏳ Đang tạo '+parsed.length+' tài khoản...', 'info');
    var created2 = 0, failed = [];
    function next(i){
      if(i>=parsed.length){
        self.render();
        alert('Đã tạo '+created2+' tài khoản học sinh.'+(failed.length?(' Lỗi '+failed.length+' dòng: '+failed.join('; ')):''));
        return;
      }
      var item = parsed[i];
      CloudDB.createStudentAuthAccount(item.username, item.password, function(ok, uidOrErr){
        if(!ok){ failed.push(item.name+' ('+uidOrErr+')'); next(i+1); return; }
        var newUid = uidOrErr;
        var stuData = {id:newUid, name:item.name, username:item.username, password:item.password, classId:classId, timeMultiplier:1,
          credits:30, creditLog:[{id:uid('cl'), delta:30, reason:'Tín dụng miễn phí ban đầu (đủ mở 3 đề cao cấp bất kỳ)', at:Date.now()}]};
        CloudDB.saveStudentCloud(newUid, stuData, function(ok2){
          if(ok2){ db.students.push(stuData); created2++; } else { failed.push(item.name+' (lỗi lưu hồ sơ)'); }
          next(i+1);
        });
      });
    }
    next(0);
    return false;
  },

    this._pendingMaterialFileUrl = null; this._pendingMaterialFileName = null; this._pendingMaterialFileSize = null;
    if(!file) return;
    if(!(isCloudConfigured() && CloudDB.ready && CloudDB.currentAdmin)){
      if(status) status.textContent = '⚠️ Bạn cần đăng nhập Admin Cloud trước khi tải file lên.';
      return;
    }
    var self = this;
    if(status) status.textContent = '⏳ Đang tải file lên Cloud... 0%';
    withTimeout(CloudDB.uploadMaterialFile(file, this._materialModalId, function(pct){
      var s = document.getElementById('materialFileStatus');
      if(s) s.textContent = '⏳ Đang tải file lên Cloud... '+pct+'% (đừng đóng cửa sổ)';
    }), 30000, 'Tải lên Cloud quá 30 giây không phản hồi — kiểm tra Firebase Storage đã được bật cho project chưa (Firebase Console → Storage → "Get started").').then(function(url){
      self._pendingMaterialFileUrl = url;
      self._pendingMaterialFileName = file.name;
      self._pendingMaterialFileSize = file.size;
      var s2 = document.getElementById('materialFileStatus');
      if(s2) s2.textContent = '☁️ Đã tải lên: '+file.name+' ('+Math.round(file.size/1024)+' KB) — bấm "Lưu tài liệu" để hoàn tất.';
    }).catch(function(err){
      var s3 = document.getElementById('materialFileStatus');
      if(s3) s3.textContent = '⚠️ Tải lên thất bại: '+(err && err.message);
    });

  submitMaterialForm:function(e, materialId){
    e.preventDefault();
    var f = e.target;
    var title = f.title.value.trim();
    var description = f.description.value.trim();
    var externalUrl = f.externalUrl.value.trim();
    var targetClassId = f.targetClassId.value;
    if(!title){ alert('Vui lòng nhập tiêu đề.'); return false; }
    var db = DB.get();
    db.materials = db.materials || [];
    var m = materialId ? db.materials.find(function(x){return x.id===materialId;}) : null;
    var isNew = !m;
    if(isNew){

    }
    m.title = title;
    m.description = description;
    m.externalUrl = externalUrl;

    if(this._pendingMaterialFileUrl){
      m.fileUrl = this._pendingMaterialFileUrl;
      m.fileName = this._pendingMaterialFileName;

  addChoiceSlot:function(){
    var container = document.getElementById('choice-slots');
    if(!container) return;
    var existing = container.querySelectorAll('.checkbox-row').length;
    if(existing>=6){ alert('Tối đa 6 phương án.'); return; }
    var i = existing;
    var div = document.createElement('div');
    div.className = 'checkbox-row';
    div.innerHTML = '<input type="radio" name="correctIndex" value="'+i+'">'+
      '<input type="text" name="choice'+i+'" placeholder="Phương án '+String.fromCharCode(65+i)+'">';
    container.appendChild(div);
  },
  submitQuestionForm:function(e, questionId){
    e.preventDefault();
    var f = e.target;
    var subject=f.subject.value, chapter=f.chapter.value.trim(), difficulty=f.difficulty.value, type=f.type.value;
    var content=f.content.value.trim(); var points=parseFloat(f.points.value)||1;
    var skill = f.skill ? f.skill.value : '';
    var part = (skill && f.part && f.part.value) ? parseInt(f.part.value,10)||null : null;
    if(!subject||!content) return false;
    var q = {subject:subject, chapter:chapter, difficulty:difficulty, type:type, content:content, points:points, skill:skill||undefined, part:part||undefined};
    if(skill==='listening'){
      q.audioScript = f.audioScript ? f.audioScript.value.trim() : '';
      q.maxPlays = (f.maxPlays && parseInt(f.maxPlays.value,10)) || 2;
    }
    var db = DB.get();
    var existing = questionId ? db.bank.find(function(x){return x.id===questionId;}) : null;
    if(existing && existing.images && existing.images.length) q.images = existing.images;
    if(type==='mc'){
      var choiceEls = Array.prototype.slice.call(f.querySelectorAll('input[name^="choice"]'));
      q.choices = choiceEls.map(function(el){ return el.value.trim(); });
      var correctIdx = parseInt(f.correctIndex.value,10);
      if(q.choices.filter(function(c){return c;}).length<2){ alert('Vui lòng nhập ít nhất 2 phương án.'); return false; }
      if(!q.choices[correctIdx]){ alert('Phương án được chọn làm đáp án đúng đang để trống.'); return false; }
      while(q.choices.length>2 && !q.choices[q.choices.length-1]) q.choices.pop();
      q.correctIndex = correctIdx;
    } else if(type==='short'){
      q.correctAnswer = f.correctAnswer.value.trim();
      if(!q.correctAnswer){ alert('Vui lòng nhập đáp án đúng.'); return false; }
    } else if(type==='writingAuto'){
      q.minWords = (f.minWords && parseInt(f.minWords.value,10)) || 25;
    } else if(type==='speaking'){
      q.minWords = (f.minWords && parseInt(f.minWords.value,10)) || 15;
      q.prepTime = (f.prepTime && parseInt(f.prepTime.value,10)); if(q.prepTime===undefined || isNaN(q.prepTime)) q.prepTime = 10;
      q.speakTime = (f.speakTime && parseInt(f.speakTime.value,10)) || 60;
    }
    if(questionId){
      var idx = db.bank.findIndex(function(x){return x.id===questionId;});
      q.id = questionId; db.bank[idx]=q;
    } else {
      q.id = uid('q'); db.bank.push(q);
    }
    DB.save(); this.closeModal(); this.render();
    this.showToast(questionId ? '✅ Đã lưu câu hỏi.' : '✅ Đã thêm câu hỏi vào kho đề.', 'success');
    return false;
  },

    var db = DB.get();
    db.bank = db.bank.filter(function(q){return q.id!==questionId;});
    DB.save(); this.render();

  compressAudioToDataUrl:function(file, onProgress){
    /* Nen nhe audio ngay trong trinh duyet truoc khi nhung base64 vao de thi, de tranh loi
       "file qua lon" khi luu vao localStorage (gioi han chung ~5-10MB cho toan bo du lieu app).
       Dung Web Audio API de giai ma PCM roi ma hoa lai bang lamejs (MP3 thuan JS) o bitrate thap,
       phu hop giong noi nghe (mono, ~48kbps).
       QUAN TRONG: KHONG resample (doi sample rate) — ban dau co ha thap sample rate (vd 44100 ->
       22050) bang noi suy tuyen tinh de giam dung luong, nhung lam vay ma KHONG loc thong thap
       truoc se gay hien tuong "aliasing" (rang cua tan so cao gap khuc thanh nhieu/re) — giao
       vien nghe ra tieng "re" chinh la do loi nay. Giu nguyen sample rate goc, chi giam so kenh
       (mono) va bitrate la du de giam dung luong ma KHONG lam meo tieng.
       Qua trinh ma hoa duoc chia thanh tung lo nho, nhuong lai vong lap su kien (setTimeout 0)
       giua cac lo — neu khong file dai (vd 20-30 phut) se lam "dong bang" ca trang trong nhieu
       phut vi lamejs chay JS thuan tren main thread. onProgress(pct) duoc goi dinh ky de hien %%
       cho giao vien biet con bao lau. Neu trinh duyet khong ho tro thi tu choi (reject) de noi
       goi biet ma quay lai canh bao cu. */
    var self = this;
    return new Promise(function(resolve, reject){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC || typeof lamejs === 'undefined'){ reject(new Error('nosupport')); return; }
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('readfail')); };
      reader.onload = function(){
        var ctx;
        try{ ctx = new AC(); } catch(e0){ reject(e0); return; }
        var onDecoded = function(audioBuffer){
          var samples, outSR;
          try{
            var srcSR = audioBuffer.sampleRate;
            var len = audioBuffer.length;
            var ch0 = audioBuffer.getChannelData(0);
            var ch1 = audioBuffer.numberOfChannels>1 ? audioBuffer.getChannelData(1) : null;
            var mono = new Float32Array(len);
            for(var i=0;i<len;i++){ mono[i] = ch1 ? (ch0[i]+ch1[i])/2 : ch0[i]; }
            outSR = srcSR; // giu nguyen sample rate goc — khong resample de tranh aliasing/re
            samples = new Int16Array(mono.length);
            for(var k=0;k<mono.length;k++){
              var s = Math.max(-1, Math.min(1, mono[k]));
              samples[k] = s<0 ? s*0x8000 : s*0x7FFF;
            }
          } catch(prepErr){
            try{ ctx.close && ctx.close(); }catch(eC1){}
            reject(prepErr);
            return;
          }
          try{ ctx.close && ctx.close(); }catch(eC2){}
          /* QUAN TRONG: dung it nhat 64kbps — da kiem tra thuc te, lamejs (thu vien LAME) TU
             DONG ha sample rate xuong con 32000Hz o 48-56kbps de toi uu chat luong/dung luong,
             khien tieng bi "boc"/re khi phat lai o loa may tinh/dien thoai. Tu 60kbps tro len
             thu vien giu nguyen sample rate goc (vd 44100Hz), am thanh trong hon han. */
          var encoder = new lamejs.Mp3Encoder(1, outSR, 64);
          var blockSize = 1152;
          var totalBlocks = Math.max(1, Math.ceil(samples.length/blockSize));
          var mp3Chunks = [];
          var blockIdx = 0;
          var BATCH_BLOCKS = 90; // ma hoa 90 khoi (~4-5 giay audio) roi nhuong lai UI 1 lan — can bang giua toc do va khong dong bang trang
          function processBatch(){
            try{
              var processed = 0;
              while(blockIdx < totalBlocks && processed < BATCH_BLOCKS){
                var p = blockIdx*blockSize;
                var chunk = samples.subarray(p, p+blockSize);
                var mp3buf = encoder.encodeBuffer(chunk);
                if(mp3buf.length>0) mp3Chunks.push(new Int8Array(mp3buf));
                blockIdx++; processed++;
              }
              if(onProgress) onProgress(Math.min(99, Math.round(blockIdx/totalBlocks*100)));
              if(blockIdx < totalBlocks){
                setTimeout(processBatch, 0);
                return;
              }
              var endBuf = encoder.flush();
              if(endBuf.length>0) mp3Chunks.push(new Int8Array(endBuf));
              var blob = new Blob(mp3Chunks, {type:'audio/mp3'});
              var outReader = new FileReader();
              outReader.onload = function(){ if(onProgress) onProgress(100); resolve({dataUrl: outReader.result, size: blob.size}); };
              outReader.onerror = function(){ reject(new Error('encodefail')); };
              outReader.readAsDataURL(blob);
            } catch(encErr){
              reject(encErr);
            }
          }
          processBatch();
        };
        var onDecodeError = function(err){ try{ ctx.close && ctx.close(); }catch(e2){} reject(err||new Error('decodefail')); };
        try{
          var maybePromise = ctx.decodeAudioData(reader.result.slice(0), onDecoded, onDecodeError);
          if(maybePromise && typeof maybePromise.then === 'function'){ maybePromise.then(onDecoded, onDecodeError); }
        } catch(e3){ onDecodeError(e3); }
      };
      reader.readAsArrayBuffer(file);
    });
  },
  handleReviewImageFiles:function(idx, fileList){
    /* Doc tung anh giao vien keo-tha/chon o buoc Xem lai thanh base64, gan truc tiep vao
       q.images cua cau hoi tuong ung — khong can sua lai file goc va nhap lai tu dau. */
    var ir = this.state.importReview;
    var q = ir && ir.items && ir.items[idx];
    if(!q || !fileList || !fileList.length) return;
    if(!q.images) q.images = [];
    var files = Array.prototype.slice.call(fileList).filter(function(f){ return f.type && f.type.indexOf('image/')===0; });
    if(!files.length) return;
    var self = this;
    var remaining = files.length;
    files.forEach(function(file){
      var reader = new FileReader();
      reader.onload = function(){
        q.images.push(reader.result);
        remaining--;
        if(remaining<=0) self.refreshImportModal();
      };
      reader.onerror = function(){
        remaining--;
        if(remaining<=0) self.refreshImportModal();
      };
      reader.readAsDataURL(file);
    });
  },
  removeReviewImage:function(idx, imgIdx){
    var ir = this.state.importReview;
    var q = ir && ir.items && ir.items[idx];
    if(!q || !q.images) return;
    q.images.splice(imgIdx, 1);
    this.refreshImportModal();
  },
  handleImportAudioFileSelect:function(inputEl){
    var ir = this.state.importReview;
    var file = inputEl.files && inputEl.files[0];
    if(!ir) return;
    if(!file){ ir.audioFileName=''; ir.audioDataUrl=''; ir.audioWarning=''; ir.audioProcessing=false; ir.audioCompressedInfo=''; ir.audioIsCloud=false; this.refreshImportModal(); return; }
    ir.audioFileName = file.name;
    ir.audioWarning = '';
    ir.audioDataUrl = '';
    ir.audioCompressedInfo = '';
    ir.audioIsCloud = false;
    var self = this;
    var RAW_LIMIT = 8*1024*1024;

    /* Uu tien 1: neu da dang nhap Admin Cloud, tai file GOC (khong nen, khong mat chat luong)
       len Firebase Storage — de thi chi luu 1 duong link nhe, KHONG lam nang file HTML/localStorage
       du file goc bao nhieu MB. Day la duong di TOT NHAT khi co san. */
    if(isCloudConfigured() && CloudDB.ready && CloudDB.currentAdmin){
      if(!ir.tempAudioId) ir.tempAudioId = uid('tmpaudio');
      ir.audioProcessing = true;
      ir.audioProcessingPct = 0;
      ir.audioIsCloud = true;
      this.refreshImportModal();
      withTimeout(CloudDB.uploadAudio(file, ir.tempAudioId, function(pct){
        ir.audioProcessingPct = pct;
        self.refreshImportModal();
      }), 25000, 'Tải lên Cloud quá 25 giây không phản hồi — có thể do Firebase Storage chưa được bật cho project này (vào Firebase Console → Storage → bấm "Get started").').then(function(url){
        ir.audioProcessing = false;
        ir.audioDataUrl = url;
        ir.audioCompressedInfo = '☁️ Đã tải audio gốc (chất lượng đầy đủ, '+Math.round(file.size/1024/1024*10)/10+'MB) lên Cloud — không làm nặng trang web.';
        self.refreshImportModal();
      }).catch(function(err){
        ir.audioIsCloud = false;
        /* Cloud loi (mang, quyen truy cap, chua bat Firebase Storage...) — tu dong chuyen sang
           duong nhung/nen cuc bo ben duoi, NHUNG PHAI cho giao vien biet ro ly do that (truoc day
           bi nuot am tham, khien nhan "da dang nhap Cloud" o tren nhung cuoi cung van roi xuong
           nen cuc bo ma khong ai hieu vi sao). */
        var cloudErrMsg = (err && err.message) ? err.message : 'không rõ nguyên nhân';
        self._handleImportAudioLocalFallback(file, cloudErrMsg);
      });
      return;
    }
    this._handleImportAudioLocalFallback(file);
  },
  /* Duong du phong: nhung truc tiep (file nho) hoac tu nen (file >8MB) roi nhung base64 vao de —
     dung khi chua dang nhap Cloud Admin hoac Cloud/Storage gap loi. cloudErrMsg (neu co) la ly do
     THAT khien Cloud that bai truoc do — luon hien thi kem de giao vien biet chinh xac chuyen gi
     da xay ra, khong de rơi vao im lang. */
  _handleImportAudioLocalFallback:function(file, cloudErrMsg){
    var ir = this.state.importReview;
    var self = this;
    var RAW_LIMIT = 8*1024*1024;
    var cloudPrefix = cloudErrMsg ? ('⚠️ Tải lên Cloud thất bại ('+cloudErrMsg+') — đã tự động chuyển sang lưu cục bộ trên trình duyệt. ') : '';
    if(file.size <= RAW_LIMIT){
      ir.audioProcessing = true;
      this.refreshImportModal();
      var reader = new FileReader();
      reader.onload = function(){
        ir.audioDataUrl = reader.result;
        ir.audioProcessing = false;
        ir.audioCompressedInfo = cloudPrefix || '';
        self.refreshImportModal();
      };
      reader.onerror = function(){
        ir.audioProcessing = false;
        ir.audioWarning = cloudPrefix + 'Không đọc được file âm thanh, vui lòng thử lại.';
        self.refreshImportModal();
      };
      reader.readAsDataURL(file);
      return;
    }
    // File > 8MB: tu dong nen nhe (chuyen mono, giam bitrate) truoc khi nhung vao de
    ir.audioProcessing = true;
    ir.audioProcessingPct = 0;
    this.refreshImportModal();
    this.compressAudioToDataUrl(file, function(pct){
      ir.audioProcessingPct = pct;
      self.refreshImportModal();
    }).then(function(res){
      ir.audioProcessing = false;
      if(res.size > RAW_LIMIT){
        ir.audioDataUrl = '';
        ir.audioWarning = cloudPrefix + 'Đã tự động nén nhưng file vẫn còn khoảng '+Math.round(res.size/1024/1024*10)/10+'MB, quá lớn để nhúng — đề vẫn được tạo bình thường, hãy gắn file audio sau ở "Danh sách đề thi → 🔊 Audio thật".';
      } else {
        ir.audioDataUrl = res.dataUrl;
        ir.audioCompressedInfo = cloudPrefix + 'Đã tự động nén từ '+Math.round(file.size/1024/1024*10)/10+'MB xuống còn '+Math.round(res.size/1024/1024*10)/10+'MB.'+(isCloudConfigured() && !cloudErrMsg ? ' 💡 Mẹo: đăng nhập Admin Cloud trước khi tải audio để giữ nguyên chất lượng gốc, không cần nén.' : '');
      }
      self.refreshImportModal();
    }).catch(function(err){
      ir.audioProcessing = false;
      ir.audioDataUrl = '';
      ir.audioWarning = cloudPrefix + 'File khá lớn (>8MB) và trình duyệt này không tự nén được audio — đề vẫn được tạo bình thường, hãy gắn file audio sau ở "Danh sách đề thi → 🔊 Audio thật".';
      self.refreshImportModal();
    });
  },
  runImportParse:function(){
    var ir = this.state.importReview;
    if(!ir.rawText || !ir.rawText.trim()){
      ir.error = 'Chưa có nội dung để phân tích. Hãy tải file hoặc dán văn bản trước.';
      this.refreshImportModal();
      return;
    }
    var result = parseExamText(ir.rawText);
    var irImages = ir.images || [];
    ir.items = result.questions.map(function(q){
      q._id = uid('imp');
      q.include = true;
      if(q.type==='mc'){
        while(q.choices.length<4){
          q.choices.push('');
          if(q.choiceImageRefs) q.choiceImageRefs.push(null);
        }
      }
      if(q.imageRefs && q.imageRefs.length){
        q.images = q.imageRefs.map(function(idx){ return irImages[idx]; }).filter(Boolean);
      }
      if(q.choiceImageRefs){
        q.choiceImages = q.choiceImageRefs.map(function(refs){
          if(!refs) return null;
          return refs.map(function(idx){ return irImages[idx]; }).filter(Boolean);
        });
      }
      return q;
    });
    ir.warnings = result.warnings;
    if(!ir.subjectTouched){
      var guessed = guessCategory(ir.rawText, ir.fileName);
      if(guessed){ ir.subject = guessed; ir.autoDetected = true; }
    }
    ir.status = 'review';
    if(ir.source==='quickcreate') this.initQuickSettingsDefaults();
    this.refreshImportModal();
  },
  renderImportReviewStep:function(){
    var ir = this.state.importReview;
    var includedCount = ir.items.filter(function(q){return q.include;}).length;
    var warningsHtml = ir.warnings.length ? '<div class="import-warning">⚠️ '+ir.warnings.map(esc).join('<br>⚠️ ')+'</div>' : '';
    var subjectHtml = '<div class="form-row" style="align-items:flex-end;margin-bottom:14px">'+
      '<div style="max-width:300px"><label>Chứng chỉ / môn thi áp dụng cho cả '+ir.items.length+' câu'+
        (ir.autoDetected && !ir.subjectTouched ? ' <span class="badge badge-blue" style="margin-left:4px">🤖 Tự động nhận diện</span>' : '')+
      '</label>'+
      '<select onchange="App.state.importReview.subject=this.value; App.state.importReview.subjectTouched=true; App.refreshImportModal()">'+categoryOptionsHtml(ir.subject)+'</select></div>'+
      (ir.autoDetected && !ir.subjectTouched ? '<div class="hint" style="padding-bottom:10px">Nếu chưa đúng, chọn lại môn thi ở đây — chỉ cần sửa một lần cho cả đề.</div>' : '')+
    '</div>';
    var rows = ir.items.map(function(q, idx){
      var choiceInputs = '';
      if(q.type==='mc'){
        choiceInputs = q.choices.map(function(c, i){
          var hasImg = q.choiceImages && q.choiceImages[i] && q.choiceImages[i].length;
          var isEmpty = !c && !hasImg;
          return '<div class="import-choice-line">'+
            '<input type="radio" name="imp_correct_'+idx+'" value="'+i+'" '+(q.correctIndex===i?'checked':'')+' onchange="App.state.importReview.items['+idx+'].correctIndex='+i+'">'+
            '<input type="text" id="imp_choice_'+idx+'_'+i+'" value="'+esc(c||'')+'" placeholder="Phương án '+String.fromCharCode(65+i)+'">'+
            (isEmpty ? '<span class="badge badge-yellow" title="Phương án này đang trống, chưa có chữ hoặc hình ảnh">⚠️ Trống</span>' : '')+
            choiceImageHtml(q, i)+
          '</div>';
        }).join('');
      } else if(q.type==='short'){
        choiceInputs = '<label>Đáp án đúng</label><input type="text" id="imp_correct_'+idx+'" value="'+esc(q.correctAnswer||'')+'" placeholder="VD: 20 (nhiều đáp án cách nhau bởi |)">';
      }
      return '<div class="import-row '+(q.include?'':'excluded')+'">'+
        '<div class="row-top">'+
          '<input type="checkbox" '+(q.include?'checked':'')+' onchange="App.state.importReview.items['+idx+'].include=this.checked; App.refreshImportModal()">'+
          '<div class="row-num">Câu '+(q.sourceNumber!==undefined?q.sourceNumber:idx+1)+'</div>'+
          '<div class="row-body">'+
            (q.needsReview?'<span class="badge badge-yellow" style="margin-bottom:6px">⚠️ Cần kiểm tra đáp án</span>':'')+
            '<textarea rows="2" id="imp_content_'+idx+'" oninput="App.state.importReview.items['+idx+'].content=this.value">'+esc(q.content)+'</textarea>'+
            reviewImagesHtml(q, idx)+
            '<div class="form-row" style="margin-top:8px">'+
              '<div style="max-width:160px"><label>Loại câu hỏi</label><select onchange="App.state.importReview.items['+idx+'].type=this.value; if(this.value===\'mc\' && !App.state.importReview.items['+idx+'].choices){App.state.importReview.items['+idx+'].choices=[\'\',\'\',\'\',\'\'];App.state.importReview.items['+idx+'].correctIndex=0;} App.refreshImportModal()">'+
                ['mc','short','essay'].map(function(t){return '<option value="'+t+'" '+(q.type===t?'selected':'')+'>'+typeLabel(t)+'</option>';}).join('')+
              '</select></div>'+
              '<div style="max-width:140px"><label>Độ khó</label><select onchange="App.state.importReview.items['+idx+'].difficulty=this.value">'+
                ['easy','medium','hard'].map(function(d){return '<option value="'+d+'" '+(q.difficulty===d?'selected':'')+'>'+difficultyLabel(d)+'</option>';}).join('')+
              '</select></div>'+
              '<div style="max-width:110px"><label>Điểm</label><input type="number" id="imp_points_'+idx+'" value="'+q.points+'" min="0.25" step="0.25"></div>'+
            '</div>'+
            (choiceInputs ? '<div style="margin-top:8px">'+choiceInputs+'</div>' : '')+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');

    var isCreateFlow = (ir.source==='quickcreate' || ir.source==='bankpick');
    var settingsHtml = isCreateFlow ? this.renderSettingsFieldsHtml() : '';
    var backLabel = ir.source==='bankpick' ? '← Chọn lại câu hỏi' : '← Quay lại';
    var backAction = ir.source==='bankpick'
      ? 'App.state.importReview.status=\'bankpick\'; App.refreshImportModal()'
      : 'App.state.importReview.status=\'input\'; App.refreshImportModal()';
    return ''+
      '<h3>📥 Xem lại '+ir.items.length+' câu hỏi'+(isCreateFlow?' <span class="hint" style="font-weight:400">— bước 2/2</span>':'')+'</h3>'+
      '<div class="hint" style="margin-bottom:12px">Kiểm tra lại nội dung, loại câu hỏi và đáp án trước khi '+(isCreateFlow?'xuất bản đề thi':'lưu vào kho đề')+'. Bỏ chọn ô vuông để loại câu không cần thiết.</div>'+
      subjectHtml+
      warningsHtml+
      '<div style="max-height:320px;overflow-y:auto">'+(rows || '<div class="empty-state">Không có câu hỏi nào.</div>')+'</div>'+
      settingsHtml+
      '<div class="modal-actions">'+
        '<button type="button" class="btn" onclick="'+backAction+'">'+backLabel+'</button>'+
        '<button type="button" class="btn" onclick="App.closeModal()">Hủy</button>'+
        (isCreateFlow
          ? '<button type="button" class="btn btn-primary btn-pill" onclick="App.publishTest()">🎉 Xuất bản đề thi ('+includedCount+' câu)</button>'
          : '<button type="button" class="btn btn-primary" onclick="App.commitImportReview()">✅ Lưu '+includedCount+' câu vào kho đề</button>')+
      '</div>';
  },
  /* Đọc lại nội dung câu hỏi đã được giáo viên xác nhận/chỉnh sửa ở bước xem lại (đọc trực
     tiếp từ các ô nhập trên form), KHÔNG ghi vào kho đề ở bước này — dùng chung cho cả
     "Lưu vào kho đề" (commitImportReview) và "Tạo đề nhanh" (proceedToQuickSettings). */
  buildFinalQuestionsFromReview:function(){
    var ir = this.state.importReview;
    var result = [];
    ir.items.forEach(function(q, idx){
      if(!q.include) return;
      var content = (document.getElementById('imp_content_'+idx)||{value:q.content}).value.trim();
      if(!content) return;
      var newQ = {
        subject: ir.subject, chapter: 'Nhập từ file',
        difficulty: q.difficulty||'medium', type: q.type, content: content,
        points: parseFloat((document.getElementById('imp_points_'+idx)||{value:q.points}).value) || 1
      };
      if(q.images && q.images.length) newQ.images = q.images;
      if(q.choiceImages) newQ.choiceImages = q.choiceImages;
      if(q.type==='mc'){
        newQ.choices = q.choices.map(function(c, i){
          var el = document.getElementById('imp_choice_'+idx+'_'+i);
          return el ? el.value.trim() : (c||'');
        });
        newQ.correctIndex = q.correctIndex||0;
        var hasChoiceImg = newQ.choiceImages && newQ.choiceImages.some(function(x){return x&&x.length;});
        if(newQ.choices.every(function(c){return !c;}) && !hasChoiceImg){ return; }
      } else if(q.type==='short'){
        var ansEl = document.getElementById('imp_correct_'+idx);
        newQ.correctAnswer = ansEl ? ansEl.value.trim() : (q.correctAnswer||'');
        if(!newQ.correctAnswer) return;
      }
      result.push(newQ);
    });
    return result;
  },

  confirmBankPick:function(){

      var copy = JSON.parse(JSON.stringify(q));
      copy._id = uid('imp'); copy.include = true; copy.sourceNumber = idx+1;
      return copy;
    });
    var counts = {};
    items.forEach(function(q){ counts[q.subject] = (counts[q.subject]||0)+1; });
    var bestSubj = Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];})[0] || CATEGORIES[0].id;
    ir.items = items;

    ir.status = 'review';

    this.refreshImportModal();

  publishTest:function(){
    var ir = this.state.importReview;
    var qs = this.state.quickSettings;
    var db = DB.get();
    if(!qs.title || !qs.title.trim()){ alert('Vui lòng nhập tên đề thi.'); return; }
    if(qs.mode==='assign' && !qs.classId){ alert('Vui lòng chọn lớp để giao bài, hoặc chuyển sang "Luyện tập tự do".'); return; }
    var finalQs = this.buildFinalQuestionsFromReview();
    if(finalQs.length===0){ alert('Chưa có câu hỏi nào được chọn — hãy tick chọn ít nhất 1 câu để tạo đề.'); return; }
    var savedQuestions = finalQs.map(function(q){ var copy = JSON.parse(JSON.stringify(q)); copy.id = uid('q'); return copy; });
    if(ir.source!=='bankpick'){
      savedQuestions.forEach(function(q){ db.bank.push(JSON.parse(JSON.stringify(q))); });
    }
    var test = {
      id: uid('test'), title: qs.title.trim(), subject: ir.subject, duration: qs.duration||10,
      isPractice: qs.mode==='practice', resultVisibility: qs.resultVisibility||'immediate',
      isPremium: qs.mode==='practice' && !!qs.isPremium, creditCost: (qs.mode==='practice' && qs.isPremium) ? (parseInt(qs.creditCost,10)||10) : 0,
      questions: savedQuestions, createdAt: Date.now()
    };
    if(ir.audioDataUrl || ir.audioFileName){
      test.audio = {file: ir.audioDataUrl || ir.audioFileName, parts:{1:{start:0,end:0}}};
    }
    if(qs.grade && GRADE_SUBJECTS.indexOf(ir.subject)!==-1){ test.grade = qs.grade; }
    test.isPremium = true; test.creditCost = 10;
      db.tests.push(test);
    var createdAssignment = null;
    if(qs.mode==='assign'){
      createdAssignment = {id:uid('assign'), testId:test.id, target:{type:'class', classId:qs.classId}, code:randomCode(6), openAt:qs.openAt, closeAt:qs.closeAt, createdAt:Date.now()};
      db.assignments.push(createdAssignment);
    }
    DB.save();
    this.syncTestToCloudIfAdmin(test);
    this.state.importReview = null;
    this.state.quickSettings = null;
    this.state.justPublishedId = test.id;
    var successMsg = createdAssignment
      ? '🎉 Đã xuất bản đề thi thành công! Đã giao "'+test.title+'" — mã đề: '+createdAssignment.code
      : '🎉 Đã xuất bản đề thi thành công! "'+test.title+'" ('+test.questions.length+' câu) đã sẵn sàng cho học sinh luyện tập.';
    /* Hien thi xac nhan NGAY BEN TRONG modal — dung noi mat giao vien dang nhin luc bam nut —
       roi moi dong modal va chuyen sang Danh sach de thi. Truoc day dong modal + chuyen trang
       + hien toast xay ra cung luc, khien man hinh doi qua nhanh va giao vien de bo lo thong
       bao. Gio day giao vien LUON thay xac nhan truoc khi man hinh doi, khong the bo lo. */
    var modalBox = document.getElementById('modal-box');
    if(modalBox){
      modalBox.innerHTML = '<div style="text-align:center;padding:28px 12px">'+
        '<div style="font-size:52px;margin-bottom:10px">🎉</div>'+
        '<h3 style="margin-bottom:8px">Xuất bản thành công!</h3>'+
        '<div class="hint" style="font-size:14px">'+esc(successMsg.replace('🎉 ',''))+'</div>'+
      '</div>';
    }
    var self = this;
    setTimeout(function(){
      self.closeModal();
      self.goto('teacherTests');
      self.showToast(successMsg, 'success');
    }, 1400);
  },

  submitEditTestQuestionForm:function(e, testId, questionId){
    e.preventDefault();
    var f = e.target;
    var db = DB.get();
    var test = db.tests.find(function(t){return t.id===testId;});
    if(!test) return false;
    var q = test.questions.find(function(x){return x.id===questionId;});
    if(!q) return false;
    var content = f.content.value.trim();
    var points = parseFloat(f.points.value)||1;
    if(!content) return false;
    q.content = content;
    q.points = points;
    if(q.type==='mc'){
      var choiceEls = Array.prototype.slice.call(f.querySelectorAll('input[name^="choice"]'));
      var newChoices = choiceEls.map(function(el){ return el.value.trim(); });
      var correctIdx = parseInt(f.correctIndex.value,10);
      if(newChoices.filter(function(c){return c;}).length<2){ alert('Vui lòng nhập ít nhất 2 phương án.'); return false; }
      if(!newChoices[correctIdx]){ alert('Phương án được chọn làm đáp án đúng đang để trống.'); return false; }
      while(newChoices.length>2 && !newChoices[newChoices.length-1]) newChoices.pop();
      q.choices = newChoices;
      q.correctIndex = correctIdx;
    } else if(q.type==='short'){
      var newAnswer = f.correctAnswer.value.trim();
      if(!newAnswer){ alert('Vui lòng nhập đáp án đúng.'); return false; }
      q.correctAnswer = newAnswer;
    }
    if(f.isListening && f.isListening.checked){
      if(!q.skill) q.skill = 'listening';
      q.audioScript = f.audioScript.value.trim();
      q.maxPlays = parseInt(f.maxPlays.value,10) || 2;
    } else if(f.isListening && !f.isListening.checked){
      delete q.audioScript;
      delete q.maxPlays;
    }
    DB.save();
    this.syncTestToCloudIfAdmin(test);
    this.closeModal();
    this.showToast('Đã lưu thay đổi câu hỏi.', 'success');
    this.render();
    return false;
  },

  newTestBuilder:function(){
    this.state.testBuilder = { title:'', subject:CATEGORIES[0].id, duration:15, isPractice:true, selectedIds:[], filter:{subject:'',difficulty:'',type:'',keyword:''}, matrix:{easy:0,medium:0,hard:0} };
  },
  ensureTestBuilder:function(){ if(!this.state.testBuilder) this.newTestBuilder(); },
  tbSetFilter:function(field,value){ this.ensureTestBuilder(); this.state.testBuilder.filter[field]=value; this.render(); },
  tbSetMatrix:function(field,value){ this.ensureTestBuilder(); this.state.testBuilder.matrix[field]=parseInt(value,10)||0; this.render(); },
  tbToggleSelect:function(qid){
    this.ensureTestBuilder();
    var sel = this.state.testBuilder.selectedIds;
    var i = sel.indexOf(qid);
    if(i>=0) sel.splice(i,1); else sel.push(qid);
    this.render();
  },
  tbRandomFromMatrix:function(){
    this.ensureTestBuilder();
    var db = DB.get(); var tb = this.state.testBuilder;
    var f = tb.filter;
    var pool = db.bank.filter(function(q){
      if(f.subject && q.subject!==f.subject) return false;
      if(f.type && q.type!==f.type) return false;
      return true;
    });
    ['easy','medium','hard'].forEach(function(diff){
      var need = tb.matrix[diff]||0;
      if(need<=0) return;
      var candidates = pool.filter(function(q){ return q.difficulty===diff && tb.selectedIds.indexOf(q.id)===-1; });
      var picked = sample(candidates, need);
      picked.forEach(function(q){ tb.selectedIds.push(q.id); });
    });
    this.render();
  },
  tbClearSelection:function(){ this.ensureTestBuilder(); this.state.testBuilder.selectedIds=[]; this.render(); },
  tbRemoveSelected:function(qid){
    this.ensureTestBuilder();
    var tb=this.state.testBuilder; tb.selectedIds = tb.selectedIds.filter(function(id){return id!==qid;});
    this.render();
  },

  saveTest:function(e){
    e.preventDefault();
    this.ensureTestBuilder();
    var tb = this.state.testBuilder;
    var f = e.target;
    var title = f.title.value.trim();
    var subject = f.subject.value;
    var duration = parseInt(f.duration.value,10)||15;
    var isPractice = !!(f.isPractice && f.isPractice.checked);
    if(!title){ alert('Vui lòng nhập tên đề thi.'); return false; }
    if(tb.selectedIds.length===0){ alert('Vui lòng chọn ít nhất 1 câu hỏi cho đề thi.'); return false; }
    var db = DB.get();
    var pointsMap = {};
    tb.selectedIds.forEach(function(qid){
      var input = document.getElementById('pts_'+qid);
      pointsMap[qid] = input ? (parseFloat(input.value)||1) : 1;
    });
    var questions = tb.selectedIds.map(function(qid){
      var q = db.bank.find(function(x){return x.id===qid;});
      var copy = JSON.parse(JSON.stringify(q));
      copy.points = pointsMap[qid];
      return copy;
    });
    var test = {id:uid('test'), title:title, subject:subject, duration:duration, isPractice:isPractice, questions:questions, createdAt:Date.now()};
    test.isPremium = true; test.creditCost = 10;
      db.tests.push(test);
    DB.save();
    this.syncTestToCloudIfAdmin(test);
    this.state.testBuilder=null;
    this.goto('teacherTests');
    return false;
  },

  deleteTest:function(testId){
    var db = DB.get();
    var test = db.tests.find(function(t){return t.id===testId;});
    if(!test) return;
    var relatedAssignments = db.assignments.filter(function(a){return a.testId===testId;});
    var relatedSubmissions = db.submissions.filter(function(s){return s.testId===testId;});
    var msg = relatedAssignments.length
      ? 'Đề thi "'+test.title+'" đã được giao '+relatedAssignments.length+' lượt và có '+relatedSubmissions.length+' bài nộp liên quan.\n\nXóa đề thi sẽ XÓA LUÔN toàn bộ các lượt giao bài và bài nộp liên quan (không thể khôi phục). Bạn có chắc chắn muốn xóa?'
      : 'Xóa đề thi "'+test.title+'"?';
    if(!confirm(msg)) return;
    db.assignments = db.assignments.filter(function(a){return a.testId!==testId;});
    db.submissions = db.submissions.filter(function(s){return s.testId!==testId;});
    db.tests = db.tests.filter(function(t){return t.id!==testId;});
    DB.save();
    this.syncTestDeleteIfAdmin(testId);
    this.render();
    this.showToast('🗑️ Đã xóa đề thi "'+test.title+'".', 'success');
  },

  togglePractice:function(testId){
    var db = DB.get();
    var t = db.tests.find(function(x){return x.id===testId;});
    if(!t) return;
    t.isPractice = !t.isPractice;

    t.resultVisibility = (t.resultVisibility==='hidden') ? 'immediate' : 'hidden';

  togglePremium:function(testId){
    var db = DB.get();
    var t = db.tests.find(function(x){return x.id===testId;});
    if(!t) return;
    if(!t.isPremium){
      var val = prompt('Đề này cần bao nhiêu tín dụng để học sinh mở khóa?', t.creditCost||10);
      if(val===null) return;
      var cost = parseInt(val,10);

      t.isPremium = true; t.creditCost = cost;
    } else {
      t.isPremium = false;
    }
    DB.save();
    this.syncTestToCloudIfAdmin(t);
    this.render();
  },

  submitAssign:function(e){
    e.preventDefault();
    var f = e.target;
    var db = DB.get();
    var testId = f.testId.value;
    var openAt = new Date(f.openAt.value).getTime();
    var closeAt = new Date(f.closeAt.value).getTime();
    if(closeAt<=openAt){ alert('Thời gian đóng phải sau thời gian mở.'); return false; }
    var target;
    if(this.assignTargetType==='class'){
      target = {type:'class', classId:f.classId.value};
    } else {
      var checked = Array.prototype.slice.call(f.querySelectorAll('input[name="studentIds"]:checked')).map(function(el){return el.value;});
      if(checked.length===0){ alert('Vui lòng chọn ít nhất 1 học sinh.'); return false; }
      target = {type:'students', studentIds:checked};
    }
    var newAssignment = {id:uid('assign'), testId:testId, target:target, code:randomCode(6), openAt:openAt, closeAt:closeAt, createdAt:Date.now()};
    db.assignments.push(newAssignment);
    DB.save(); this.render();
    var self = this;
    if(isCloudConfigured() && CloudDB.ready && CloudDB.currentAdmin){
      newAssignment.source = 'cloud';
      CloudDB.saveAssignmentCloud(newAssignment, function(ok, err){
        if(!ok) self.showToast('⚠️ Đã lưu lượt giao bài trên máy nhưng KHÔNG đồng bộ được lên Cloud (học sinh ở thiết bị khác sẽ không thấy): '+err, 'error');
        else self.render();
      });
    }
    return false;
  },
  deleteAssignment:function(assignmentId){
    if(!confirm('Xóa lượt giao bài này? Toàn bộ bài nộp liên quan sẽ bị xóa.')) return;
    var db = DB.get();
    db.assignments = db.assignments.filter(function(a){return a.id!==assignmentId;});
    db.submissions = db.submissions.filter(function(s){return s.assignmentId!==assignmentId;});
    DB.save(); this.render();
    if(isCloudConfigured() && CloudDB.ready && CloudDB.currentAdmin){
      var self = this;
      CloudDB.deleteAssignmentCloud(assignmentId, function(ok, err){
        if(!ok) self.showToast('⚠️ Không xoá được lượt giao bài này trên Cloud: '+err, 'error');
      });
    }
  },

  /* ================= CHẤM BÀI & KẾT QUẢ (Giáo viên) ================= */
  computeAutoGrade:function(test, submission){
    var autoScore=0, maxScore=0, autoMaxScore=0, needsManual=false;
    this.getSubQuestions(test, submission).forEach(function(q){
      maxScore += (q.points||1);
      var ans = submission.answers ? submission.answers[q.id] : undefined;
      if(q.type==='mc'){
        autoMaxScore += (q.points||1);
        if(ans!==undefined && ans!==null && Number(ans)===q.correctIndex) autoScore += (q.points||1);
      } else if(q.type==='short'){
        autoMaxScore += (q.points||1);
        if(ans!==undefined && ans!==null){
          var given = String(ans).trim().toLowerCase();
          var accepted = String(q.correctAnswer||'').split('|').map(function(s){return s.trim().toLowerCase();});
          if(given && accepted.indexOf(given)>=0) autoScore += (q.points||1);
        }
      } else if(q.type==='essay'){
        needsManual = true;
      } else if(q.type==='writingAuto' || q.type==='speaking'){
        autoMaxScore += (q.points||1);
        var detail = submission.autoDetail ? submission.autoDetail[q.id] : null;
        if(detail && typeof detail.score==='number') autoScore += detail.score;
      }
    });
    return {autoScore:autoScore, maxScore:maxScore, autoMaxScore:autoMaxScore, needsManual:needsManual};
  },

  /* Chấm tự động các câu Writing/Speaking (AI, miễn phí) còn thiếu trong submission.autoDetail.
     Trả về Promise; luôn resolve (không bao giờ reject) để không chặn việc nộp bài dù mất mạng. */
  runAutoAIGrading:function(test, submission){
    var self = this;
    var qs = this.getSubQuestions(test, submission).filter(function(q){ return q.type==='writingAuto' || q.type==='speaking'; });
    if(!qs.length) return Promise.resolve();
    if(!submission.autoDetail) submission.autoDetail = {};
    var pending = qs.filter(function(q){ return !submission.autoDetail[q.id]; });
    if(!pending.length) return Promise.resolve();
    var jobs = pending.map(function(q){
      var ans = submission.answers ? submission.answers[q.id] : null;
      if(q.type==='writingAuto'){
        var text = (ans && typeof ans==='object') ? (ans.text||'') : (ans||'');
        return GradingEngine.gradeWritingAnswer(q, text).then(function(result){ submission.autoDetail[q.id] = result; }).catch(function(){
          submission.autoDetail[q.id] = {score:0, maxPoints:q.points||1, breakdown:{}, wordCount:0, issues:['Không chấm được tự động — đã cho 0 điểm.'], offline:true};
        });
      } else {
        var transcript = (ans && typeof ans==='object') ? (ans.transcript||'') : '';
        var duration = (ans && typeof ans==='object') ? (ans.duration||0) : 0;
        return GradingEngine.gradeSpeakingAnswer(q, transcript, duration).then(function(result){ submission.autoDetail[q.id] = result; }).catch(function(){
          submission.autoDetail[q.id] = {score:0, maxPoints:q.points||1, breakdown:{}, wordCount:0, issues:['Không chấm được tự động — đã cho 0 điểm.'], offline:true};
        });
      }
    });
    return Promise.all(jobs);
  },

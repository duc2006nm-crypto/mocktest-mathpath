  renderGradeDetail:function(){
    var db = DB.get();
    var sub = db.submissions.find(function(s){return s.id===this.state.params.submissionId;}.bind(this));
    if(!sub) return '<div class="card">Không tìm thấy bài nộp.</div>';
    var test = db.tests.find(function(t){return t.id===sub.testId;});
    var stu = db.students.find(function(s){return s.id===sub.studentId;});
    var key = 'grade_'+sub.id;
    if(!this.state.gradeTemp[key]) this.state.gradeTemp[key] = JSON.parse(JSON.stringify(sub.manualScores||{}));
    var temp = this.state.gradeTemp[key];

    var qBlocks = this.getSubQuestions(test, sub).map(function(q, idx){
      var ans = sub.answers ? sub.answers[q.id] : undefined;
      var body='';
      if(q.type==='mc'){
        body = wrapChoiceRows(q, q.choices.map(function(c,i){
          var cls='choice-row';
          if(i===q.correctIndex) cls+=' correct';
          else if(Number(ans)===i) cls+=' wrong-picked';
          return '<div class="'+cls+'">'+choiceLabelText(q,i,c)+
            (i===q.correctIndex?' <span class="badge badge-green">Đáp án đúng</span>':'')+
            (Number(ans)===i && i!==q.correctIndex?' <span class="badge badge-red">HS chọn</span>':'')+
            (Number(ans)===i && i===q.correctIndex?' <span class="badge badge-blue">HS chọn</span>':'')+
            choiceImageHtml(q,i)+
          '</div>';
        }).join(''));
      } else if(q.type==='short'){
        var given = ans!==undefined && ans!==null ? String(ans) : '(không trả lời)';
        var accepted = String(q.correctAnswer||'').split('|').map(function(s){return s.trim();}).join(' hoặc ');
        var isCorrect = (function(){
          if(ans===undefined||ans===null) return false;
          var g=String(ans).trim().toLowerCase();
          return String(q.correctAnswer||'').split('|').map(function(s){return s.trim().toLowerCase();}).indexOf(g)>=0;
        })();
        body = '<div class="hint">Đáp án học sinh:</div><div class="choice-row '+(isCorrect?'correct':'wrong-picked')+'">'+esc(given)+' '+(isCorrect?'<span class="badge badge-green">Đúng</span>':'<span class="badge badge-red">Sai</span>')+'</div>'+
          '<div class="hint">Đáp án đúng: '+esc(accepted)+'</div>';
      } else {
        var text = ans && String(ans).trim() ? nl2br(ans) : '<i>(học sinh chưa trả lời)</i>';
        body = '<div class="choice-row" style="display:block">'+text+'</div>'+
          '<label>Điểm chấm cho câu này (tối đa '+q.points+')</label>'+
          '<input type="number" min="0" max="'+q.points+'" step="0.25" value="'+(temp[q.id]!==undefined?temp[q.id]:'')+'" '+
          'oninput="App.state.gradeTemp[\''+key+'\'][\''+q.id+'\']=parseFloat(this.value)||0" style="max-width:120px">';
      }
      var gradeScriptReveal = q.audioScript
        ? '<div class="hint" style="margin:8px 0;padding:8px;background:var(--gray-light,#f1f5f9);border-radius:8px"><b>🔒 Script bài nghe (chỉ giáo viên thấy):</b><br>'+nl2br(esc(q.audioScript))+'</div>'
        : '';
      return '<div class="qcard">'+
        '<div class="qmeta"><span class="tag-pill">Câu '+(idx+1)+'</span><span class="badge badge-blue">'+typeLabel(q.type)+'</span>'+
        '<span class="badge '+difficultyBadgeClass(q.difficulty)+'">'+difficultyLabel(q.difficulty)+'</span><span class="tag-pill">'+q.points+' điểm</span></div>'+
        '<div class="qtext">'+nl2br(q.content)+'</div>'+
        gradeScriptReveal+
        questionImagesHtml(q)+
        body+
      '</div>';
    }).join('');

    var grade = this.computeAutoGrade(test, sub);
    var backView = sub.assignmentId ? 'teacherResults' : 'teacherResults';

    return ''+
      '<div class="topbar"><div><h2>Chấm bài: '+esc(stu?stu.name:'')+'</h2><div class="sub">'+esc(test.title)+' '+categoryBadge(test.subject)+' · '+(sub.assignmentId?'Bài kiểm tra chính thức':'Bài luyện tập tự do')+' · Nộp lúc '+fmtDateTime(sub.submitTime)+
        (sub.violationCount ? ' · <span class="badge badge-yellow">⚠️ Rời màn hình '+sub.violationCount+' lần lúc thi</span>' : '')+'</div></div>'+
      '<button class="btn btn-outline" onclick="App.goto(\''+backView+'\')">← Quay lại kết quả</button></div>'+
      '<div class="card">'+
        '<div class="grid grid-3">'+
          '<div class="stat-card"><div class="num">'+grade.autoScore+'</div><div class="label">Điểm tự động (TN + trả lời ngắn)</div></div>'+
          '<div class="stat-card"><div class="num">'+grade.maxScore+'</div><div class="label">Tổng điểm tối đa</div></div>'+
          '<div class="stat-card"><div class="num">'+(sub.status==='graded'?sub.finalScore:'—')+'</div><div class="label">Điểm cuối cùng</div></div>'+
        '</div>'+
      '</div>'+
      qBlocks+
      '<div class="card"><button class="btn btn-primary btn-block" onclick="App.finalizeGrade(\''+sub.id+'\')">💾 Lưu điểm &amp; hoàn tất chấm bài</button></div>';
  },

  finalizeGrade:function(submissionId){
    var db = DB.get();
    var sub = db.submissions.find(function(s){return s.id===submissionId;});
    var test = db.tests.find(function(t){return t.id===sub.testId;});
    var grade = this.computeAutoGrade(test, sub);
    var key = 'grade_'+submissionId;
    var temp = this.state.gradeTemp[key] || {};
    var manualSum = 0;
    this.getSubQuestions(test, sub).forEach(function(q){ if(q.type==='essay'){ manualSum += (temp[q.id]||0); } });
    sub.manualScores = temp;
    sub.autoScore = grade.autoScore;
    sub.maxScore = grade.maxScore;
    sub.finalScore = grade.autoScore + manualSum;
    sub.status = 'graded';
    DB.save();
    this.syncSubmissionToCloud(sub, {showErrorToast:true});
    if(grade.maxScore>0){ this.bumpProgress(sub.studentId, sub.finalScore/grade.maxScore); }
    delete this.state.gradeTemp[key];
    this.goto('teacherResults');
  },

  renderStudentPractice:function(){
    var db = DB.get();
    var student = this.state.user;
    var categoryId = this.state.params.category;
    if(!categoryId){
      var cats = this.getPracticeCategories();
      var cardsHtml = cats.map(function(x){

      }).join('');
      var prog = this.getProgress(student.id);
      var progressHtml = '<div class="progress-strip">'+
        '<div class="progress-pill">⭐ <span class="pnum">'+prog.stars+'</span> sao</div>'+
        '<div class="progress-pill">🔥 <span class="pnum">'+prog.streak+'</span> ngày liên tiếp</div>'+
        (prog.bestStreak>1 ? '<div class="progress-pill">🏅 Kỷ lục <span class="pnum">'+prog.bestStreak+'</span> ngày</div>' : '')+
      '</div>';
      return ''+
        '<div class="topbar"><div><h2>🎯 Luyện thi thử</h2><div class="sub">Xin chào, '+esc(student.name)+'! Chọn một chứng chỉ / môn thi để bắt đầu luyện tập.</div></div></div>'+
        progressHtml+
        (cardsHtml ? '<div class="category-grid">'+cardsHtml+'</div>' : '<div class="card"><div class="empty-state">Hiện chưa có đề luyện tập nào được công khai.</div></div>');
    }
    var cat = getCategory(categoryId);
    /* Mon thuoc GRADE_SUBJECTS: bat hoc sinh chon Lop truoc khi thay danh sach de, giup dung dat
       de theo dung lua tuoi. De nao CHUA duoc giao vien gan lop van hien cho MOI lop (an toan,
       khong lam "mat" de cu chua kip gan lop). */
    var needsGrade = GRADE_SUBJECTS.indexOf(categoryId)!==-1;
    var chosenGrade = this.state.params.grade || '';
    if(needsGrade && !chosenGrade){
      var gradeCardsHtml = GRADE_LEVELS.map(function(g){
        var cnt = db.tests.filter(function(t){return t.isPractice && t.subject===categoryId && gradeMatches(t.grade, g.id);}).length;
        return '<div class="category-card" onclick="App.goto(\'studentPractice\',{category:\''+categoryId+'\',grade:\''+g.id+'\'})">'+
          '<div class="icon">🎒</div><div class="name">'+g.label+'</div><div class="count">'+cnt+' đề phù hợp</div></div>';
      }).join('');
      return ''+
        '<div class="topbar"><div><h2>'+cat.icon+' '+esc(cat.name)+'</h2><div class="sub">Em đang học lớp mấy? Chọn đúng lớp để thấy đề phù hợp với mình.</div></div>'+
        '<button class="btn btn-outline" onclick="App.goto(\'studentPractice\')">← Tất cả chứng chỉ</button></div>'+
        '<div class="category-grid">'+gradeCardsHtml+'</div>';
    }
    var tests = db.tests.filter(function(t){return t.isPractice && t.subject===categoryId && (!needsGrade || gradeMatches(t.grade, chosenGrade));});
    // Voi mon Toan tu duy (maththinking), khi da chon 1 khoi lop cu the: danh so "De so N" RIENG
    // trong tung folder lop, bat dau tu 1 (khong dung so xuyen suot toan app nua). Sap xep: de
    // Kangaroo (co nam thi trong origTitle) theo nam tang dan; cac de khac (TIMO/Azota...) giu
    // nguyen thu tu goc va dung truoc trong danh sach (nam=0 khi sap xep).
    var mathFolderOrder = (categoryId==='maththinking' && needsGrade && chosenGrade)
      ? tests.slice().sort(function(a,b){ return kangarooYear(a.origTitle)-kangarooYear(b.origTitle); })
      : null;
    // Neu co danh so rieng theo folder thi hien thi danh sach THEO DUNG thu tu so do (1,2,3...),
    // khong giu thu tu chen ban dau nua (tranh hien thi lon xon "De so 1, 5, 9, 2...").
    var cardsHtml = (mathFolderOrder || tests).map(function(t){
      var folderIdx = mathFolderOrder ? mathFolderOrder.indexOf(t) : -1;
      var displayTitle = folderIdx!==-1 ? 'Đề số '+folderIdx : t.title;
      var mySubs = db.submissions.filter(function(s){return s.testId===t.id && s.studentId===student.id && s.status!=='in-progress';});
      var best = mySubs.filter(function(s){return s.status==='graded';}).sort(function(a,b){return b.finalScore-a.finalScore;})[0];
      var fullInProgressSub = db.submissions.find(function(s){return s.testId===t.id && s.studentId===student.id && s.status==='in-progress' && !s.skillFilter;});
      var partInProgress = db.submissions.some(function(s){return s.testId===t.id && s.studentId===student.id && s.status==='in-progress' && s.skillFilter;});
      var totalPts = t.questions.reduce(function(s,q){return s+(q.points||1);},0);
      var unlocked = App.isTestUnlockedFor(t, student.id);
      var skillBreakdown = App.getTestSkillBreakdown(t);
      var premiumBadge = t.isPremium
        ? (unlocked ? ' <span class="badge badge-green">💎 Đã mở khóa</span>' : ' <span class="badge badge-yellow">💎 Cần '+(t.creditCost||0)+' tín dụng</span>')
        : '';
      var skillTagsHtml = skillBreakdown.length
        ? '<div class="hint" style="margin-top:4px">'+skillBreakdown.map(function(s){return '<span class="tag-pill">'+skillIcon(s.skill)+' '+skillLabel(s.skill)+'</span>';}).join(' ')+'</div>'
        : '';
      var actionBtn;
      if(skillBreakdown.length){
        actionBtn = '<button class="btn btn-primary btn-pill" onclick="App.goto(\'studentSkillPicker\',{testId:\''+t.id+'\'})">🎯 Chọn phần luyện tập</button>'+
          (fullInProgressSub ? '<button class="btn btn-outline btn-sm btn-block" style="margin-top:6px" onclick="App.enterPractice(\''+t.id+'\')">Tiếp tục bài làm trọn đề dở dang</button>' : '');
      } else {
        actionBtn = fullInProgressSub
          ? '<button class="btn btn-primary btn-pill" onclick="App.enterPractice(\''+t.id+'\')">Tiếp tục làm bài</button>'
          : '<button class="btn btn-primary btn-pill" onclick="App.openPracticeTimeModal(\''+t.id+'\')">'+(t.isPremium && !unlocked ? '🔒 Mở khóa ('+(t.creditCost||0)+' 💎)' : (mySubs.length?'Làm lại':'Bắt đầu thi thử'))+'</button>';
      }
      return '<div class="practice-test-card">'+
        '<div class="info"><b>'+esc(displayTitle)+'</b>'+premiumBadge+
        (t.origTitle ? '<div class="hint" style="opacity:.75">'+esc(origTitleHint(t))+'</div>' : '')+
        '<div class="hint">'+t.questions.length+' câu · '+totalPts+' điểm · '+t.duration+' phút'+(best?' · Điểm cao nhất: '+best.finalScore+'/'+best.maxScore:'')+(mySubs.length?' · Đã làm '+mySubs.length+' lần':'')+(partInProgress?' · Có phần đang làm dở':'')+'</div>'+skillTagsHtml+'</div>'+
        actionBtn+
      '</div>';
    }).join('');
    return ''+
      '<div class="topbar"><div><h2>'+cat.icon+' '+esc(cat.name)+(needsGrade&&chosenGrade?' · '+gradeLabel(chosenGrade):'')+'</h2><div class="sub">Chọn một đề để bắt đầu thi thử. Có thể làm lại nhiều lần để luyện tập.</div></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      (needsGrade ? '<button class="btn btn-outline" onclick="App.goto(\'studentPractice\',{category:\''+categoryId+'\'})">🎒 Đổi lớp</button>' : '')+
      '<button class="btn btn-outline" onclick="App.goto(\'studentPractice\')">← Tất cả chứng chỉ</button></div></div>'+
      '<div class="card">'+(cardsHtml || '<div class="empty-state">Chưa có đề luyện tập nào cho mục này.</div>')+'</div>';
  },

  isTestUnlockedFor:function(test, studentId){
    if(!test.isPremium) return true;
    var db = DB.get();
    if(this.state.user && this.state.user.unlocked && this.state.user.unlocked[test.id]) return true;
    return db.submissions.some(function(s){return s.testId===test.id && s.studentId===studentId;});
  },
  /* Chuyen sang bat dong bo (callback) de co the tru tin dung AN TOAN qua Firestore Transaction
     tren Cloud (them boi Claude) — thay vi chi sua so du trong bo nho roi luu localStorage nhu
     truoc (de bi mat dong bo giua cac thiet bi / khong chinh xac neu mo nhieu tab). cb(true) neu
     da mo khoa thanh cong (hoac de khong phai premium / da mo khoa san), cb(false) neu that bai. */
  chargePremiumIfNeeded:function(test, student, cb){
    if(!test.isPremium){ cb(true); return; }
    if(this.isTestUnlockedFor(test, student.id)){ cb(true); return; }
    var cost = test.creditCost||0;
    var balance = student.credits||0;
    if(balance < cost){
      this.showToast('💎 Đề "'+test.title+'" cần '+cost+' tín dụng để mở khóa. Bạn còn '+balance+' tín dụng — hãy liên hệ admin (giáo viên) để được cấp thêm tín dụng.', 'error');
      cb(false);
      return;
    }
    var self = this;
    if(isCloudConfigured() && CloudDB.ready && student.id){
      CloudDB.spendStudentCreditForTest(student.id, cost, 'Mở khóa đề "'+test.title+'"', test.id, function(ok, info){
        if(!ok){
          var msg = (info==='INSUFFICIENT_CREDIT')
            ? '💎 Số dư tín dụng trên Cloud không đủ (có thể vừa dùng ở thiết bị khác) — hãy tải lại trang và thử lại.'
            : ('⚠️ Không mở khóa được đề: '+info+((String(info).indexOf('permission')>=0)?' (đề có thể đã được mở khóa ở thiết bị khác — hãy tải lại trang).':''));
          self.showToast(msg, 'error');
          cb(false);
          return;
        }
        student.credits = info.newBalance;
        student.creditLog = info.newLog;
        student.unlocked = student.unlocked || {}; student.unlocked[test.id] = true;
        self.showToast('💎 Đã dùng '+cost+' tín dụng để mở khóa đề "'+test.title+'". Số dư còn lại: '+student.credits+' tín dụng.', 'success');
        cb(true);
      });
    } else {
      student.credits = balance - cost;
      student.creditLog = student.creditLog || [];
      student.creditLog.push({id:uid('cl'), delta:-cost, reason:'Mở khóa đề "'+test.title+'"', at:Date.now()});
      DB.save();
      this.showToast('💎 Đã dùng '+cost+' tín dụng để mở khóa đề "'+test.title+'". Số dư còn lại: '+student.credits+' tín dụng.', 'success');
      cb(true);
    }
  },
  /* He so nhan them gio khi hoc sinh CHU DONG chon "on ky" luc bat dau luyen tap tu do (KHONG
     ap dung cho bai thi chinh thuc/giao bai — xem enterExam() rieng, khong bi anh huong). */
  practiceTimeMultiplier:function(choice){
    if(choice==='x1.5') return 1.5;
    if(choice==='x2') return 2;
    return 1;
  },
  enterPractice:function(testId, timeChoice){
    var db = DB.get();
    var student = this.state.user;
    var test = db.tests.find(function(t){return t.id===testId;});
    if(!test) return;
    var self = this;
    this.chargePremiumIfNeeded(test, student, function(ok){
      if(!ok) return;
      var existing = db.submissions.find(function(s){return s.testId===testId && s.studentId===student.id && s.assignmentId===null && s.status==='in-progress' && !s.skillFilter;});
      if(!existing){
        existing = {id:uid('sub'), assignmentId:null, testId:testId, studentId:student.id, answers:{}, startTime:Date.now(), submitTime:null, status:'in-progress'};
        if(timeChoice==='unlimited'){
          existing.noTimeLimit = true;
        } else if(timeChoice && timeChoice!=='x1'){
          existing.durationMinutes = Math.round(test.duration * self.practiceTimeMultiplier(timeChoice));
        }
        db.submissions.push(existing);
        DB.save();
        self.syncSubmissionToCloud(existing);
      }
      self.goto('studentExam', {submissionId:existing.id});
    });
  },
  /* ---------- Luyện tập theo từng kỹ năng / Part (giống thư viện đề của IELTS Guru) ---------- */
  getTestSkillBreakdown:function(test){
    var order = ['reading','listening','writing','speaking'];
    var bySkill = {};
    test.questions.forEach(function(q){
      if(!q.skill) return;
      if(!bySkill[q.skill]) bySkill[q.skill] = {skill:q.skill, count:0, partsMap:{}};
      bySkill[q.skill].count++;
      var p = q.part || 0;
      bySkill[q.skill].partsMap[p] = (bySkill[q.skill].partsMap[p]||0)+1;
    });
    return order.filter(function(sk){return bySkill[sk];}).map(function(sk){
      var s = bySkill[sk];
      var parts = Object.keys(s.partsMap).filter(function(k){return Number(k)>0;}).map(function(k){return {part:parseInt(k,10), count:s.partsMap[k]};}).sort(function(a,b){return a.part-b.part;});
      return {skill:sk, count:s.count, parts:parts};
    });
  },
  getSkillPartHistory:function(studentId, testId, skill, part){
    var db = DB.get();
    var partKey = (part===null||part===undefined) ? null : Number(part);
    var subs = db.submissions.filter(function(s){
      return s.studentId===studentId && s.testId===testId && s.status!=='in-progress' &&
        s.skillFilter===skill && (s.partFilter==null?null:Number(s.partFilter))===partKey;
    });
    var graded = subs.filter(function(s){return s.status==='graded' && s.maxScore>0;});
    var best = graded.length ? Math.max.apply(null, graded.map(function(s){return Math.round(s.finalScore/s.maxScore*100);})) : null;
    return {count:subs.length, best:best};
  },
  getSubQuestions:function(test, sub){
    if(!sub || !sub.questionIds || !sub.questionIds.length) return test.questions;
    var idSet = {};
    sub.questionIds.forEach(function(id){ idSet[id]=true; });
    return test.questions.filter(function(q){ return idSet[q.id]; });
  },
  /* Khóa dùng trong test.partDurations — 'all' nghĩa là "làm cả kỹ năng" (không chọn Part cụ thể). */
  partDurationKey:function(skill, part){ return skill+'|'+(part==null?'all':part); },
  /* Thời gian GỐC (chưa nhân hệ số riêng của từng thí sinh) cho 1 kỹ năng/Part của 1 đề:
     ưu tiên giá trị giáo viên đã tự đặt (test.partDurations), nếu chưa đặt thì ước lượng
     theo tỉ lệ số câu so với tổng thời gian của cả đề. */
  getPartDuration:function(test, skill, part){
    var key = this.partDurationKey(skill, part);
    if(test.partDurations && test.partDurations[key]!=null) return test.partDurations[key];
    var partKey = (part===null||part===undefined) ? null : Number(part);
    var filtered = test.questions.filter(function(q){
      if(q.skill!==skill) return false;
      if(partKey!==null && Number(q.part)!==partKey) return false;
      return true;
    });
    return Math.max(4, Math.round(filtered.length * (test.duration / test.questions.length)));
  },
  /* Thời gian THỰC TẾ áp dụng cho 1 bài làm cụ thể = thời gian gốc (đã lưu trên submission,
     hoặc của cả đề) nhân với hệ số thời gian riêng của học sinh đó (điều chỉnh cho từng thí
     sinh — VD: học sinh cần thêm thời gian). */
  getEffectiveDurationMinutes:function(test, sub, student){
    var base = (sub && sub.durationMinutes) || (test && test.duration) || 10;
    var mult = (student && student.timeMultiplier) || 1;
    return Math.max(1, Math.round(base * mult));
  },
  /* ---- Audio THẬT cho phần Nghe (thay thế giả lập bằng giọng đọc máy khi đề có sẵn file mp3
     gốc): test.audio = {file, parts:{1:{start,end},...}} tính bằng giây, xác định qua phân
     tích khoảng lặng (silence detection) trên file gốc để khớp đúng thời điểm bắt đầu/kết
     thúc từng Part trong file ghi âm liên tục của cả bài nghe. ---- */
  getPartAudioRange:function(test, skill, part){
    if(!test || !test.audio || !test.audio.parts || skill!=='listening') return null;
    if(part===null || part===undefined){
      var keys = Object.keys(test.audio.parts);
      if(!keys.length) return null;
      var starts = keys.map(function(k){ return test.audio.parts[k].start; });
      var ends = keys.map(function(k){ return test.audio.parts[k].end; });
      return {start: Math.min.apply(null, starts), end: Math.max.apply(null, ends)};
    }
    return test.audio.parts[part] || test.audio.parts[String(part)] || null;
  },
  renderExamAudioBar:function(test, sub){
    if(!test || !test.audio || !test.audio.file) return '';
    var skill = sub.skillFilter;
    var range, label;
    if(skill==='listening'){
      range = this.getPartAudioRange(test, 'listening', sub.partFilter);
      label = sub.partFilter ? ('Listening Part '+sub.partFilter) : 'Toàn bộ phần Nghe (Listening)';
    } else if(!skill){
      var hasListening = (test.questions||[]).some(function(q){ return q.skill==='listening'; });
      if(!hasListening) return '';
      range = this.getPartAudioRange(test, 'listening', null);
      label = 'Toàn bộ phần Nghe (Listening)';
    } else {
      return '';
    }
    if(!range) return '';
    return '<div class="card" id="examAudioBar" data-start="'+range.start+'" data-end="'+range.end+'" style="margin-bottom:14px">'+
      '<div style="font-weight:600;margin-bottom:8px">🔊 File nghe thật — '+esc(label)+' <span class="hint" style="font-weight:400">(được phép tua/nghe lại thoải mái khi luyện tập)</span></div>'+
      '<audio id="examAudioEl" controls preload="metadata" style="width:100%" src="'+esc(test.audio.file)+'" onerror="App.onExamAudioError()">Trình duyệt không hỗ trợ audio.</audio>'+
      '<div id="examAudioFallback" class="hint hidden" style="margin-top:6px;color:#b45309">⚠️ Không tìm thấy file âm thanh "'+esc(test.audio.file)+'" — hãy đặt file này CÙNG THƯ MỤC với file HTML đang mở. Học sinh vẫn làm bài bình thường; giáo viên có thể xem script trong phần chấm bài để hỗ trợ.</div>'+
    '</div>';
  },
  setupExamAudioPlayer:function(){
    var bar = document.getElementById('examAudioBar');
    if(!bar) return;
    var audio = document.getElementById('examAudioEl');
    if(!audio) return;
    var start = parseFloat(bar.getAttribute('data-start'))||0;
    var end = parseFloat(bar.getAttribute('data-end'))||0;
    var didSeek = false;
    function doSeek(){ if(!didSeek){ try{ if(start>0) audio.currentTime = start; }catch(e){} didSeek = true; } }
    try{
      audio.addEventListener('loadedmetadata', doSeek);
      audio.addEventListener('timeupdate', function(){
        if(end>0 && audio.currentTime >= end){ audio.pause(); }
      });
      if(audio.readyState>=1) doSeek();
    }catch(e){}
  },
  onExamAudioError:function(){
    try{
      var fb = document.getElementById('examAudioFallback');
      var bar = document.getElementById('examAudioBar');
      if(fb) fb.classList.remove('hidden');
      if(bar){ var el = document.getElementById('examAudioEl'); if(el) el.style.display='none'; }
    }catch(e){}
  },
  /* ---- Giáo viên tự đặt thời gian riêng cho từng kỹ năng/Part của 1 đề (thay cho ước lượng
     tự động theo tỉ lệ số câu) — ví dụ Reading Part 1 chỉ cần 8 phút nhưng Part 3 khó hơn cần
     15 phút, giáo viên có thể tinh chỉnh cho sát với đề thi thật. ---- */
  openPartDurationModal:function(testId){
    var db = DB.get();
    var test = db.tests.find(function(t){return t.id===testId;});
    if(!test) return;
    var skillsInfo = this.getTestSkillBreakdown(test);
    if(!skillsInfo.length){ alert('Đề này chưa gắn thẻ kỹ năng nên không có Part để đặt thời gian riêng.'); return; }
    var self = this;
    var rowsHtml = skillsInfo.map(function(s){
      var allKey = self.partDurationKey(s.skill, null);
      var allRow = '<div class="form-row" style="align-items:end">'+
        '<div><label>'+skillIcon(s.skill)+' '+skillLabel(s.skill)+' — Làm cả kỹ năng</label></div>'+
        '<div><input type="number" min="1" name="dur_'+esc(allKey)+'" value="'+self.getPartDuration(test, s.skill, null)+'" style="max-width:120px"> phút</div>'+
      '</div>';
      var partRows = s.parts.map(function(p){
        var key = self.partDurationKey(s.skill, p.part);
        return '<div class="form-row" style="align-items:end">'+
          '<div><label style="padding-left:16px">Part '+p.part+' ('+p.count+' câu)</label></div>'+
          '<div><input type="number" min="1" name="dur_'+esc(key)+'" value="'+self.getPartDuration(test, s.skill, p.part)+'" style="max-width:120px"> phút</div>'+
        '</div>';
      }).join('');
      return '<div style="margin-bottom:14px">'+allRow+partRows+'</div>';
    }).join('<hr style="border:none;border-top:1px solid var(--border);margin:10px 0">');
    var html = ''+
      '<h3>⏱️ Thời gian từng Part — '+esc(test.title)+'</h3>'+
      '<div class="hint" style="margin-bottom:12px">Đặt thời gian riêng cho từng kỹ năng/Part khi học sinh luyện tập. Để trống theo mặc định là ước lượng tự động theo tỉ lệ số câu.</div>'+
      '<form onsubmit="return App.submitPartDurations(event,\''+testId+'\')">'+
        rowsHtml+
        '<div class="modal-actions">'+
          '<button type="button" class="btn" onclick="App.closeModal()">Hủy</button>'+
          '<button type="submit" class="btn btn-primary">Lưu thời gian</button>'+
        '</div>'+
      '</form>';
    this.openModal(html);
  },
  submitPartDurations:function(e, testId){
    e.preventDefault();
    var f = e.target;
    var db = DB.get();
    var test = db.tests.find(function(t){return t.id===testId;});
    if(!test) return false;
    var inputs = Array.prototype.slice.call(f.querySelectorAll('input[name^="dur_"]'));
    var partDurations = test.partDurations || {};
    inputs.forEach(function(el){
      var key = el.name.slice(4);
      var val = parseInt(el.value,10);
      if(val>0) partDurations[key] = val;
    });
    test.partDurations = partDurations;
    DB.save(); this.closeModal(); this.render();
    this.showToast('⏱️ Đã lưu thời gian riêng cho từng Part của "'+test.title+'".', 'success');
    return false;
  },

  /* ================= AUDIO THẬT CHO BÀI NGHE (mp3) =================
     Trước đây hệ thống có sẵn logic PHÁT file mp3 thật cho phần Listening
     (xem renderExamAudioBar/setupExamAudioPlayer ở trên) nhưng KHÔNG có màn
     hình nào để giáo viên gắn file / đặt mốc thời gian từng Part — nên tính
     năng này tồn tại trong code nhưng không thể dùng được. Modal dưới đây bổ
     sung đúng chỗ còn thiếu đó. */
  openTestAudioModal:function(testId){
    var db = DB.get();
    var test = db.tests.find(function(t){return t.id===testId;});
    if(!test) return;
    this._pendingAudioDataUrl = null;
    this._audioModalTestId = testId; // luu lai de handleTestAudioFileSelect biet dang gan audio cho de nao khi tai len Cloud
    this.openModal(this.renderTestAudioModalHtml(test));
  },
  renderTestAudioModalHtml:function(test){
    var self = this;
    var listeningInfo = this.getTestSkillBreakdown(test).filter(function(s){return s.skill==='listening';})[0];
    var parts = listeningInfo ? listeningInfo.parts : [];
    var audio = test.audio || {};
    var rangeRows = parts.length ? parts.map(function(p){
      var r = (audio.parts && (audio.parts[p.part] || audio.parts[String(p.part)])) || {};
      return '<div class="form-row" style="align-items:end">'+
        '<div><label>Part '+p.part+' ('+p.count+' câu) — bắt đầu (giây)</label><input type="number" min="0" step="0.1" name="start_'+p.part+'" value="'+(r.start!=null?r.start:'')+'"></div>'+
        '<div><label>Kết thúc (giây)</label><input type="number" min="0" step="0.1" name="end_'+p.part+'" value="'+(r.end!=null?r.end:'')+'"></div>'+
      '</div>';
    }).join('') : '<div class="hint">Đề này chưa có câu hỏi Listening được chia theo Part, chỉ cần gắn file — không cần đặt mốc thời gian.</div>';
    return ''+
      '<h3>🔊 Audio thật cho bài nghe — '+esc(test.title)+'</h3>'+
      '<div class="hint" style="margin-bottom:12px">Mặc định học sinh nghe bằng giọng đọc máy (Text-to-Speech) dựng từ script. Nếu có file ghi âm gốc (mp3) của đề, gắn vào đây để học sinh nghe file THẬT, giống thi thật hơn.</div>'+
      '<form onsubmit="return App.submitTestAudioForm(event,\''+test.id+'\')">'+
        '<label>Tải file mp3 lên'+((isCloudConfigured() && CloudDB.ready && CloudDB.currentAdmin) ? ' (đã đăng nhập Cloud — audio sẽ tải lên Cloud, giữ nguyên chất lượng gốc)' : ' (file lớn hơn ~8MB sẽ được tự động nén nhẹ trước khi nhúng)')+'</label>'+
        '<input type="file" accept="audio/*" onchange="App.handleTestAudioFileSelect(event)">'+
        '<div id="audioFileStatus" class="hint" style="margin-top:6px">'+(audio.file ? '✅ Đã có file âm thanh cho đề này.' : 'Chưa chọn file.')+'</div>'+
        '<label style="margin-top:14px">Hoặc nhập tên file / đường dẫn (đặt file mp3 CÙNG THƯ MỤC với file HTML này)</label>'+
        '<input type="text" name="audioFileUrl" value="'+esc(audio.file&&!audio.file.startsWith('data:')?audio.file:'')+'" placeholder="VD: de-thi-1-listening.mp3">'+
        (parts.length ? '<h3 style="margin-top:22px">Mốc thời gian từng Part trong file (để tua đúng chỗ)</h3>'+rangeRows : rangeRows)+
        '<div class="modal-actions">'+
          (audio.file && audio.file.indexOf('data:')===0 && isCloudConfigured() && CloudDB.ready && CloudDB.currentAdmin ? '<button type="button" class="btn btn-outline" onclick="App.migrateAudioToCloud(\''+test.id+'\')">☁️ Chuyển audio này lên Cloud (giảm dung lượng máy)</button> ' : '')+
          (audio.file ? '<button type="button" class="btn btn-danger" onclick="App.removeTestAudio(\''+test.id+'\')">🗑️ Xóa audio</button>' : '')+
          '<button type="button" class="btn" onclick="App.closeModal()">Hủy</button>'+
          '<button type="submit" class="btn btn-primary">Lưu audio</button>'+
        '</div>'+
      '</form>';
  },
  handleTestAudioFileSelect:function(e){
    var file = e.target.files && e.target.files[0];
    var status = document.getElementById('audioFileStatus');
    this._pendingAudioDataUrl = null;
    if(!file){ return; }
    var self = this;
    var RAW_LIMIT = 8*1024*1024;

    /* Uu tien 1: da dang nhap Admin Cloud -> tai file GOC len Firebase Storage, giu nguyen
       chat luong, khong can nen — chi luu 1 duong link nhe vao de thi. */
    if(isCloudConfigured() && CloudDB.ready && CloudDB.currentAdmin){
      if(status) status.textContent = '⏳ Đang tải audio lên Cloud... 0%';
      withTimeout(CloudDB.uploadAudio(file, this._audioModalTestId, function(pct){
        var statusC = document.getElementById('audioFileStatus');
        if(statusC) statusC.textContent = '⏳ Đang tải audio lên Cloud... '+pct+'% (đừng đóng cửa sổ)';
      }), 25000, 'Tải lên Cloud quá 25 giây không phản hồi — có thể do Firebase Storage chưa được bật cho project này (vào Firebase Console → Storage → bấm "Get started").').then(function(url){
        self._pendingAudioDataUrl = url;
        var statusC2 = document.getElementById('audioFileStatus');
        if(statusC2) statusC2.textContent = '☁️ Đã tải audio gốc lên Cloud ('+Math.round(file.size/1024/1024*10)/10+'MB, giữ nguyên chất lượng) — bấm "Lưu audio" để hoàn tất.';
      }).catch(function(err){
        /* Cloud loi -> tu dong chuyen sang duong nhung/nen cuc bo, NHUNG phai cho giao vien biet
           ro ly do that thay vi im lang (cung 1 loi da sua o handleImportAudioFileSelect). */
        var cloudErrMsg = (err && err.message) ? err.message : 'không rõ nguyên nhân';
        self._localAudioFileSelectFallback(file, status, cloudErrMsg);
      });
      return;
    }
    this._localAudioFileSelectFallback(file, status);
  },
  _localAudioFileSelectFallback:function(file, status, cloudErrMsg){
    var self = this;
    var RAW_LIMIT = 8*1024*1024;
    var cloudPrefix = cloudErrMsg ? ('⚠️ Tải lên Cloud thất bại ('+cloudErrMsg+') — đã tự động chuyển sang lưu cục bộ. ') : '';
    if(file.size <= RAW_LIMIT){
      var reader = new FileReader();
      reader.onload = function(){
        self._pendingAudioDataUrl = reader.result;
        if(status) status.textContent = cloudPrefix + '✅ Đã chọn: '+file.name+' ('+Math.round(file.size/1024)+' KB) — bấm "Lưu audio" để hoàn tất.';
      };
      reader.onerror = function(){
        if(status) status.textContent = cloudPrefix + '⚠️ Không đọc được file, vui lòng thử lại.';
      };
      reader.readAsDataURL(file);
      return;
    }
    // File > 8MB: tu dong nen nhe truoc khi nhung
    if(status) status.textContent = cloudPrefix + '⏳ File hơi lớn ('+Math.round(file.size/1024/1024*10)/10+'MB) — đang tự động nén nhẹ... 0%';
    this.compressAudioToDataUrl(file, function(pct){
      var statusP = document.getElementById('audioFileStatus');
      if(statusP) statusP.textContent = cloudPrefix + '⏳ Đang tự động nén nhẹ... '+pct+'% (đừng đóng cửa sổ)';
    }).then(function(res){
      var status2 = document.getElementById('audioFileStatus');
      if(res.size > RAW_LIMIT){
        self._pendingAudioDataUrl = null;
        if(status2) status2.textContent = cloudPrefix + '⚠️ Đã tự động nén nhưng vẫn còn khoảng '+Math.round(res.size/1024/1024*10)/10+'MB, quá lớn để lưu vào trình duyệt — hãy dùng cách nhập tên file bên dưới thay thế.';
      } else {
        self._pendingAudioDataUrl = res.dataUrl;
        if(status2) status2.textContent = cloudPrefix + '✅ Đã tự động nén từ '+Math.round(file.size/1024/1024*10)/10+'MB xuống còn '+Math.round(res.size/1024/1024*10)/10+'MB — bấm "Lưu audio" để hoàn tất.';
      }
    }).catch(function(err){
      self._pendingAudioDataUrl = null;
      var status3 = document.getElementById('audioFileStatus');
      if(status3) status3.textContent = cloudPrefix + '⚠️ File khá lớn ('+Math.round(file.size/1024/1024*10)/10+'MB) và trình duyệt này không tự nén được — hãy dùng cách nhập tên file bên dưới thay thế.';
    });
  },
  /* Doi 1 chuoi data: URL (audio da nhung base64 truoc day khi chua dang nhap Cloud) thanh Blob
     de co the tai len Firebase Storage — dung khi giao vien muon "don dep" audio cu de giam
     dung luong localStorage. Gia dinh dung dinh dang "data:<mime>;base64,<du lieu>" - dung dinh
     dang duy nhat ma app nay tung tao ra (qua FileReader.readAsDataURL / nen audio). */
  dataUrlToBlob:function(dataUrl){
    var comma = dataUrl.indexOf(',');
    var meta = dataUrl.slice(0, comma);
    var mimeMatch = meta.match(/^data:([^;]+)/);
    var mime = mimeMatch ? mimeMatch[1] : 'audio/mpeg';
    var byteChars = atob(dataUrl.slice(comma+1));
    var byteNumbers = new Array(byteChars.length);
    for(var i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
    return new Blob([new Uint8Array(byteNumbers)], {type:mime});
  },
  /* Nut "don dep" thu cong cho 1 de da co san audio nhung base64 tu truoc (nang, chiem nhieu
     localStorage) — chuyen no len Firebase Storage giong nhu audio moi, roi thay the bang 1
     duong link nhe. Giup giam dung luong may ma KHONG can giao vien tim lai file mp3 goc. */
  migrateAudioToCloud:function(testId){
    var db = DB.get();
    var test = db.tests.find(function(t){ return t.id===testId; });
    if(!test || !test.audio || !test.audio.file || test.audio.file.indexOf('data:')!==0) return;
    if(!(isCloudConfigured() && CloudDB.ready && CloudDB.currentAdmin)){
      this.showToast('Bạn cần đăng nhập Admin Cloud trước khi chuyển audio lên Cloud.', 'error');
      return;
    }
    var self = this;
    var status = document.getElementById('audioFileStatus');
    if(status) status.textContent = '⏳ Đang chuyển audio cũ lên Cloud... 0%';
    var blob;
    try{ blob = this.dataUrlToBlob(test.audio.file); }
    catch(e){ this.showToast('⚠️ Không đọc được audio cũ của đề này để chuyển lên Cloud.', 'error'); return; }
    CloudDB.uploadAudio(blob, testId, function(pct){
      var s = document.getElementById('audioFileStatus');
      if(s) s.textContent = '⏳ Đang chuyển audio cũ lên Cloud... '+pct+'%';
    }).then(function(url){
      test.audio.file = url;
      var savedLocally = DB.save();
      self.syncTestToCloudIfAdmin(test);
      self.closeModal();
      self.render();
      self.showToast(savedLocally
        ? '☁️ Đã chuyển audio cũ của "'+test.title+'" lên Cloud — máy này đã giảm bớt dung lượng lưu trữ.'
        : '☁️ Đã chuyển audio lên Cloud thành công. (Bộ nhớ máy vẫn đang đầy nên chưa lưu được cache — hãy tải lại trang sau khi dọn thêm vài đề cũ khác.)', 'success');
    }).catch(function(err){
      self.showToast('⚠️ Chuyển audio lên Cloud thất bại: '+(err && err.message), 'error');
    });
  },
  submitTestAudioForm:function(e, testId){
    e.preventDefault();
    var f = e.target;
    var db = DB.get();
    var test = db.tests.find(function(t){return t.id===testId;});
    if(!test) return false;
    var urlInput = f.audioFileUrl.value.trim();
    var fileVal = this._pendingAudioDataUrl || urlInput || (test.audio && test.audio.file) || '';
    if(!fileVal){ alert('Vui lòng tải file mp3 lên hoặc nhập tên file.'); return false; }
    var startEls = Array.prototype.slice.call(f.querySelectorAll('input[name^="start_"]'));
    var partsObj = (test.audio && test.audio.parts) || {};
    startEls.forEach(function(el){
      var part = el.name.slice(6);
      var endEl = f.querySelector('input[name="end_'+part+'"]');
      var start = parseFloat(el.value);
      var end = endEl ? parseFloat(endEl.value) : NaN;
      if(!isNaN(start) && !isNaN(end) && end>start){ partsObj[part] = {start:start, end:end}; }
    });
    test.audio = {file:fileVal, parts:partsObj};
    DB.save();
    this.syncTestToCloudIfAdmin(test);
    this._pendingAudioDataUrl = null;
    this.closeModal();
    this.render();
    this.showToast('🔊 Đã lưu file âm thanh thật cho "'+test.title+'".', 'success');
    return false;
  },
  removeTestAudio:function(testId){
    if(!confirm('Xóa file âm thanh thật đã gắn cho đề này? Học sinh sẽ quay lại nghe bằng giọng đọc máy.')) return;
    var db = DB.get();

  enterPracticeFiltered:function(testId, skill, part, timeChoice){
    var db = DB.get();
    var student = this.state.user;
    var test = db.tests.find(function(t){return t.id===testId;});
    if(!test) return;
    var self = this;
    this.chargePremiumIfNeeded(test, student, function(ok){
      if(!ok) return;
      var partKey = (part===null||part===undefined||part==='') ? null : Number(part);
      var filtered = test.questions.filter(function(q){
        if(q.skill!==skill) return false;
        if(partKey!==null && Number(q.part)!==partKey) return false;
        return true;
      });
      if(!filtered.length){ self.showToast('Không tìm thấy câu hỏi phù hợp trong phần này.', 'error'); return; }
      var ids = filtered.map(function(q){return q.id;});
      var existing = db.submissions.find(function(s){
        return s.testId===testId && s.studentId===student.id && s.assignmentId===null && s.status==='in-progress' &&
          s.skillFilter===skill && (s.partFilter==null?null:Number(s.partFilter))===partKey;
      });
      if(!existing){
        var baseMinutes = self.getPartDuration(test, skill, partKey);
        existing = {id:uid('sub'), assignmentId:null, testId:testId, studentId:student.id, answers:{},
          startTime:Date.now(), submitTime:null, status:'in-progress',
          questionIds:ids, skillFilter:skill, partFilter:partKey, durationMinutes:baseMinutes};
        if(timeChoice==='unlimited'){
          existing.noTimeLimit = true;
        } else if(timeChoice && timeChoice!=='x1'){
          existing.durationMinutes = Math.round(baseMinutes * self.practiceTimeMultiplier(timeChoice));
        }
        db.submissions.push(existing);
        DB.save();
        self.syncSubmissionToCloud(existing);
      }
      self.goto('studentExam', {submissionId:existing.id});
    });
  },
  /* Man hinh chon THOI GIAN cho bai luyen tap tu do (KHONG dung cho bai thi chinh thuc/giao bai)
     -- de hoc sinh nao can on ky (lam cham, xem lai tung cau) co the tu cho them gio, hoac bo qua
     gioi han thoi gian hoan toan, truoc khi buoc vao lam bai thi CO TINH GIO THAT (giao bai). Neu
     da co bai lam dang do (dang lam tiep), vao thang khong hoi lai (giu nguyen thoi gian da chon
     tu luc bat dau). */
  openPracticeTimeModal:function(testId, skill, part){
    var db = DB.get();
    var student = this.state.user;
    var test = db.tests.find(function(t){return t.id===testId;});
    if(!test) return;
    var partKey = (part===null||part===undefined||part==='') ? null : Number(part);
    var existing;
    if(skill){
      existing = db.submissions.find(function(s){
        return s.testId===testId && s.studentId===student.id && s.assignmentId===null && s.status==='in-progress' &&
          s.skillFilter===skill && (s.partFilter==null?null:Number(s.partFilter))===partKey;
      });
    } else {
      existing = db.submissions.find(function(s){return s.testId===testId && s.studentId===student.id && s.assignmentId===null && s.status==='in-progress' && !s.skillFilter;});
    }
    if(existing){
      if(skill) this.enterPracticeFiltered(testId, skill, partKey);
      else this.enterPractice(testId);
      return;
    }
    var self = this;
    this.chargePremiumIfNeeded(test, student, function(ok){
      if(!ok) return;
      var baseMinutes = skill ? self.getPartDuration(test, skill, partKey) : test.duration;
      var partArg = (partKey===null) ? 'null' : String(partKey);
      var html = ''+
        '<h3>⏱️ Chọn thời gian làm bài</h3>'+
        '<div class="hint" style="margin-bottom:12px">Đây là bài luyện tập tự do — bạn có thể chọn ôn kỹ với nhiều thời gian hơn để xem lại từng câu, hoặc làm đúng thời gian thật để tập quen áp lực khi thi thật.</div>'+
        '<form onsubmit="return App.startPracticeFromModal(event,\''+testId+'\',\''+(skill||'')+'\','+partArg+')">'+
          '<div class="checkbox-row"><input type="radio" name="timeChoice" value="x1" checked> <label>⏱️ Thời gian chuẩn — '+baseMinutes+' phút (giống thi thật)</label></div>'+
          '<div class="checkbox-row"><input type="radio" name="timeChoice" value="x1.5"> <label>🐢 Ôn kỹ hơn — gấp 1,5 lần ('+Math.round(baseMinutes*1.5)+' phút)</label></div>'+
          '<div class="checkbox-row"><input type="radio" name="timeChoice" value="x2"> <label>🐢🐢 Ôn thật kỹ — gấp 2 lần ('+Math.round(baseMinutes*2)+' phút)</label></div>'+
          '<div class="checkbox-row"><input type="radio" name="timeChoice" value="unlimited"> <label>♾️ Không giới hạn thời gian (làm thong thả, tự nộp bài khi xong)</label></div>'+
          '<div class="modal-actions">'+
            '<button type="button" class="btn" onclick="App.closeModal()">Hủy</button>'+
            '<button type="submit" class="btn btn-primary">Bắt đầu làm bài</button>'+
          '</div>'+
        '</form>';
      self.openModal(html);
    });
  },
  startPracticeFromModal:function(e, testId, skill, part){
    e.preventDefault();
    var choice = e.target.timeChoice.value;
    this.closeModal();
    if(skill){
      this.enterPracticeFiltered(testId, skill, part, choice);
    } else {
      this.enterPractice(testId, choice);
    }
    return false;
  },

  enterExam:function(assignmentId){
    var db = DB.get();
    var student = this.state.user;
    var a = db.assignments.find(function(x){return x.id===assignmentId;});
    var now = Date.now();
    if(now<a.openAt || now>a.closeAt){ alert('Bài thi hiện không mở.'); return; }
    var self = this;
    CloudDB.ensureAssignmentUnlock(student.id, a.testId, a.id, function(okU, errU){
      if(!okU){ self.showToast('⚠️ Không mở được bài thi: '+errU, 'error'); return; }
      if(student.unlocked) student.unlocked[a.testId] = true;

  exitExamSafely:function(target){
    if(confirm('Thoát bài làm? Các câu trả lời đã lưu tạm — bạn có thể vào làm tiếp bất cứ lúc nào.')){
      if(this.examTimerInterval){ clearInterval(this.examTimerInterval); this.examTimerInterval=null; }

  /* ---- Chế độ "thi nghiêm túc" cho bài kiểm tra chính thức: yêu cầu toàn màn hình, cảnh
     báo khi rời tab/thoát toàn màn hình, chặn vài phím tắt hay dùng để gian lận. Chỉ áp dụng
     cho bài thi chính thức (có assignmentId) — bài luyện tập tự do không bị ràng buộc. ---- */
  startExamGuard:function(sub){
    if(!sub || !sub.assignmentId) return;
    if(this.examGuardActive) return;
    this.examGuardActive = true;
    var self = this;
    try{
      var el = document.documentElement;
      if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
    }catch(e){}
    function onVisibility(){ if(document.hidden) self.registerExamViolation(sub.id); }
    function onFullscreenChange(){ if(!document.fullscreenElement) self.registerExamViolation(sub.id); }
    function onKeydown(e){
      var k = (e.key||'').toLowerCase();
      var blocked = (e.ctrlKey && ['c','v','p','u','x'].indexOf(k)!==-1) || e.key==='F12' || (e.ctrlKey && e.shiftKey && k==='i');
      if(blocked) e.preventDefault();
    }
    function onContextMenu(e){ e.preventDefault(); }
    try{
      document.addEventListener('visibilitychange', onVisibility);
      document.addEventListener('fullscreenchange', onFullscreenChange);
      document.addEventListener('keydown', onKeydown);
      document.addEventListener('contextmenu', onContextMenu);
    }catch(e){}
    this._examGuardHandlers = {onVisibility:onVisibility, onFullscreenChange:onFullscreenChange, onKeydown:onKeydown, onContextMenu:onContextMenu};
  },
  stopExamGuard:function(){
    if(!this.examGuardActive) return;
    var h = this._examGuardHandlers;
    try{
      if(h && document.removeEventListener){
        document.removeEventListener('visibilitychange', h.onVisibility);
        document.removeEventListener('fullscreenchange', h.onFullscreenChange);
        document.removeEventListener('keydown', h.onKeydown);
        document.removeEventListener('contextmenu', h.onContextMenu);
      }
    }catch(e){}
    this._examGuardHandlers = null;
    this.examGuardActive = false;
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){}); }catch(e){}
  },
  registerExamViolation:function(subId){
    var db = DB.get();
    var sub = db.submissions.find(function(s){return s.id===subId;});
    if(!sub || sub.status!=='in-progress') return;
    sub.violationCount = (sub.violationCount||0)+1;
    DB.save();
    this.showToast('⚠️ Đã phát hiện bạn rời khỏi màn hình làm bài (lần '+sub.violationCount+'). Đây là bài thi chính thức, hãy tập trung làm bài nhé!', 'error');
  },
  /* ---- Bộ điều hướng câu hỏi: tô sáng nút của câu đang xem gần nhất khi cuộn trang ---- */
  setupExamNavSpy:function(){
    if(typeof document.querySelector !== 'function') return;
    var main, navGrid;
    try{ main = document.querySelector('.exam-main'); navGrid = document.querySelector('.qnav-grid'); }catch(e){ return; }
    if(!main || !navGrid || typeof main.querySelectorAll !== 'function') return;
    var qcards = Array.prototype.slice.call(main.querySelectorAll('.qcard'));
    var navBtns = Array.prototype.slice.call(navGrid.querySelectorAll('.qnav-btn'));
    if(!qcards.length || qcards.length!==navBtns.length) return;
    function update(){
      var bestIdx = 0, bestDist = Infinity;
      qcards.forEach(function(el, i){
        var rect = el.getBoundingClientRect ? el.getBoundingClientRect() : {top:0};
        var dist = Math.abs(rect.top - 100);
        if(dist < bestDist){ bestDist = dist; bestIdx = i; }
      });
      navBtns.forEach(function(b,i){ b.classList.toggle('current', i===bestIdx); });
    }
    update();
    try{
      if(App._examNavSpyHandler && window.removeEventListener) window.removeEventListener('scroll', App._examNavSpyHandler, true);
      if(window.addEventListener) window.addEventListener('scroll', update, true);
    }catch(e){}
    App._examNavSpyHandler = update;
  },

  playListening:function(submissionId, qId){
    var db = DB.get();
    var sub = db.submissions.find(function(s){return s.id===submissionId;});
    if(!sub || sub.status!=='in-progress') return;
    var test = db.tests.find(function(t){return t.id===sub.testId;});
    var q = test && test.questions.find(function(x){return x.id===qId;});
    if(!q || !q.audioScript) return;
    if(!sub.listenPlays) sub.listenPlays = {};
    var used = sub.listenPlays[qId] || 0;
    var max = q.maxPlays || 2;
    if(used>=max) return;
    sub.listenPlays[qId] = used+1;
    DB.save();
    this.speakScript(q.audioScript);
    this.render();

  /* ---- Doc kich ban hoi thoai nhieu nhan vat (Man/Woman/Boy/Girl/ten rieng nhu Jasmine,
     Carlotta, Lin...) bang cac giong TTS khac nhau cho tung nhan vat, phat lien tiep dung
     thu tu trong script — mo phong dung dinh dang bai nghe Cambridge that (nhieu nguoi noi
     chuyen). Neu trinh duyet chi co 1 giong hoac khong lay duoc danh sach giong, tu dong
     fallback ve 1 giong mac dinh, khong loi. ---- */
  _voiceCache:null,
  getEnglishVoices:function(){
    try{
      var voices = window.speechSynthesis.getVoices() || [];
      var en = voices.filter(function(v){ return /^en/i.test(v.lang||''); });
      var list = en.length ? en : voices;
      if(list.length) this._voiceCache = list;
      return list.length ? list : (this._voiceCache || []);
    }catch(e){ return this._voiceCache || []; }
  },
  pickVoiceForSpeaker:function(speaker, assigned){
    var voices = this.getEnglishVoices();
    if(!voices.length) return null;
    if(assigned[speaker]) return assigned[speaker];
    var femaleHints = /woman|girl|mum|mother|jasmine|carlotta|lin\b|sara|katie|alice|olivia|lucy|erica|maria|samantha|karina|annabelle|jade|jasmine|jana/i;
    var maleHints = /\bman\b|boy|dad|father|ben\b|jack\b|henry|kevin|driscoll|harry|frankie|tom\b|carlotta's/i;
    var femaleVoices = voices.filter(function(v){ return /female|zira|susan|samantha|victoria|karen|moira|tessa|fiona/i.test(v.name||''); });
    var maleVoices = voices.filter(function(v){ return /male|david|mark|daniel|george|fred|alex\b/i.test(v.name||'') && !/female/i.test(v.name||''); });
    var pool = voices;
    if(femaleHints.test(speaker) && femaleVoices.length) pool = femaleVoices;
    else if(maleHints.test(speaker) && maleVoices.length) pool = maleVoices;
    var usedCount = Object.keys(assigned).length;
    var v = pool[usedCount % pool.length] || voices[usedCount % voices.length];
    assigned[speaker] = v;
    return v;
  },
  speakScript:function(script){
    try{
      if(!('speechSynthesis' in window)){
        alert('Trình duyệt này chưa hỗ trợ phát âm thanh. Hãy thử trên Chrome/Edge bản mới nhất.');
        return;
      }
      window.speechSynthesis.cancel();
      this.getEnglishVoices();
      var raw = String(script||'');
      var lines = raw.split(/\n+/).map(function(l){return l.trim();}).filter(Boolean);
      var re = /^([A-Za-z][A-Za-z'’.\s]{1,28}):\s*(.+)$/;
      var segments = [];
      lines.forEach(function(line){
        var m = line.match(re);
        if(m && m[1].trim().split(/\s+/).length<=3){
          segments.push({speaker:m[1].trim(), text:m[2].trim()});
        } else if(segments.length){
          segments[segments.length-1].text += ' ' + line;
        } else {
          segments.push({speaker:'', text:line});
        }
      });
      if(!segments.length) return;
      var assigned = {};
      var self = this;
      segments.forEach(function(seg){
        var cleanText = seg.text.replace(/\[[^\]]*\]/g,'').trim();
        if(!cleanText) return;
        var u = new SpeechSynthesisUtterance(cleanText);
        u.lang = 'en-US'; u.rate = 0.92;
        var voice = seg.speaker ? self.pickVoiceForSpeaker(seg.speaker, assigned) : null;
        if(voice) u.voice = voice;
        window.speechSynthesis.speak(u);
      });
    }catch(e){ if(window.console) console.error('TTS error:', e); }
  },
  saveAnswer:function(submissionId, qId, value){
    var db = DB.get();
    var sub = db.submissions.find(function(s){return s.id===submissionId;});
    if(!sub || sub.status!=='in-progress') return;
    sub.answers[qId]=value;
    DB.save();
  },

  saveWritingAnswer:function(submissionId, qId, value){
    this.saveAnswer(submissionId, qId, value);
    var countEl = document.getElementById('wa_count_'+qId);
    if(countEl){
      var wCount = value.trim() ? value.trim().split(/\s+/).length : 0;
      var db = DB.get();
      var sub = db.submissions.find(function(s){return s.id===submissionId;});
      var test = sub ? db.tests.find(function(t){return t.id===sub.testId;}) : null;
      var q = test ? this.getSubQuestions(test, sub).find(function(x){return x.id===qId;}) : null;
      var wMin = (q && q.minWords) || 25;
      countEl.innerHTML = 'Số từ: <b>'+wCount+'</b> / tối thiểu '+wMin+' từ — 🤖 bài này sẽ được AI chấm điểm tự động khi bạn nộp bài.';
    }
  },

  /* ============ Speaking: ghi âm trực tiếp trên trình duyệt + tự động chuyển giọng nói thành văn bản ============
     Dùng MediaRecorder (ghi âm) + Web Speech API/webkitSpeechRecognition (nhận dạng giọng nói) —
     cả hai đều có sẵn miễn phí trong trình duyệt, không cần server hay API key. */
  _speakingState:{},
  renderSpeakingAnswerBox:function(sub, q){
    var st = this._speakingState[q.id] || {};
    var ans = sub.answers[q.id];
    var hasAnswer = ans && ans.transcript;
    var supported = (typeof navigator!=='undefined' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    if(!supported){
      return '<div class="hint">⚠️ Trình duyệt này không hỗ trợ ghi âm. Vui lòng dùng Google Chrome trên máy tính hoặc điện thoại.</div>';
    }
    var recBtn = st.recording
      ? '<button type="button" class="btn btn-sm" style="background:#dc2626;color:#fff" onclick="App.stopSpeakingRecording(\''+sub.id+'\',\''+q.id+'\')">⏹ Dừng ghi âm</button>'
      : '<button type="button" class="btn btn-sm btn-primary" onclick="App.startSpeakingRecording(\''+sub.id+'\',\''+q.id+'\')">🎤 Bắt đầu ghi âm ('+(q.speakTime||60)+'s)</button>';
    return '<div class="speaking-box" id="speak_box_'+q.id+'">'+
      recBtn+' <span id="speak_timer_'+q.id+'" class="hint">'+(st.recording?'Đang ghi âm...':'')+'</span>'+
      '<div class="hint" style="margin-top:8px">Bản ghi (văn bản tự động nhận dạng từ giọng nói):</div>'+
      '<textarea rows="4" id="speak_transcript_'+q.id+'" readonly style="background:#f8fafc">'+esc(hasAnswer?ans.transcript:'')+'</textarea>'+
      '<div class="hint">🤖 Câu Speaking này sẽ được AI chấm điểm tự động (tốc độ nói, ngữ pháp, từ vựng) ngay khi bạn nộp bài.</div>'+
    '</div>';
  },
  startSpeakingRecording:function(submissionId, qId){
    var self = this;
    var st = this._speakingState[qId] = this._speakingState[qId] || {};
    if(st.recording) return;
    var db = DB.get();
    var sub = db.submissions.find(function(s){return s.id===submissionId;});
    var test = sub ? db.tests.find(function(t){return t.id===sub.testId;}) : null;
    var q = test ? this.getSubQuestions(test, sub).find(function(x){return x.id===qId;}) : null;
    var speakTime = (q && q.speakTime) || 60;
    st.recording = true;
    st.startedAt = Date.now();
    st.transcript = '';
    st.recognition = null;
    var SR = (typeof window!=='undefined') && (window.SpeechRecognition || window.webkitSpeechRecognition);
    if(SR){
      try{
        var recog = new SR();
        recog.lang = 'en-US';
        recog.continuous = true;
        recog.interimResults = true;
        recog.onresult = function(event){
          var finalText = '';
          for(var i=0;i<event.results.length;i++){ finalText += event.results[i][0].transcript + ' '; }
          st.transcript = finalText.trim();
          var ta = document.getElementById('speak_transcript_'+qId);
          if(ta) ta.value = st.transcript;
        };
        recog.onerror = function(){};
        recog.start();
        st.recognition = recog;
      }catch(e){ st.recognition = null; }
    }
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
        st.stream = stream;
      }).catch(function(){ /* mic không khả dụng - vẫn cho phép nhận dạng giọng nói nếu recog hoạt động */ });
    }
    var box = document.getElementById('speak_box_'+qId);
    if(box) box.innerHTML = this.renderSpeakingAnswerBox(sub, q);
    var timerEl0 = document.getElementById('speak_timer_'+qId);
    if(timerEl0) timerEl0.textContent = 'Đang ghi âm... còn '+speakTime+'s';
    st.timerInterval = setInterval(function(){
      var elapsed = Math.floor((Date.now()-st.startedAt)/1000);
      var remain = speakTime - elapsed;
      var timerEl = document.getElementById('speak_timer_'+qId);
      if(timerEl) timerEl.textContent = remain>0 ? ('Đang ghi âm... còn '+remain+'s') : 'Đang ghi âm...';
      if(remain<=0){ self.stopSpeakingRecording(submissionId, qId); }
    }, 500);
  },
  stopSpeakingRecording:function(submissionId, qId){
    var st = this._speakingState[qId];
    if(!st || !st.recording) return;
    st.recording = false;
    if(st.timerInterval){ clearInterval(st.timerInterval); st.timerInterval=null; }
    var durationSec = Math.max(1, Math.round((Date.now()-st.startedAt)/1000));
    if(st.recognition){ try{ st.recognition.stop(); }catch(e){} }
    if(st.stream){ try{ st.stream.getTracks().forEach(function(t){t.stop();}); }catch(e){} }
    var transcript = st.transcript || '';
    this.saveAnswer(submissionId, qId, {transcript:transcript, duration:durationSec});
    var db = DB.get();
    var sub = db.submissions.find(function(s){return s.id===submissionId;});
    var test = sub ? db.tests.find(function(t){return t.id===sub.testId;}) : null;
    var q = test ? this.getSubQuestions(test, sub).find(function(x){return x.id===qId;}) : null;
    var box = document.getElementById('speak_box_'+qId);
    if(box && sub && q) box.innerHTML = this.renderSpeakingAnswerBox(sub, q);
  },

  startExamTimer:function(deadline, submissionId){
    if(this.examTimerInterval) clearInterval(this.examTimerInterval);
    var self=this;
    function tick(){
      var el = document.getElementById('exam-timer');
      if(!el){ clearInterval(self.examTimerInterval); return; }
      var remain = deadline - Date.now();
      if(remain<=0){
        el.textContent='00:00'; clearInterval(self.examTimerInterval);
        self.submitExam(submissionId, true);
        return;
      }
      var m = Math.floor(remain/60000), s = Math.floor((remain%60000)/1000);
      el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      el.classList.toggle('low', remain<60000);
    }
    tick();
    this.examTimerInterval = setInterval(tick, 1000);
  },

  submitExam:function(submissionId, isAuto){
    var db = DB.get();
    var sub = db.submissions.find(function(s){return s.id===submissionId;});
    if(!sub || sub.status!=='in-progress') return;
    if(!isAuto && !confirm('Bạn chắc chắn muốn nộp bài? Sau khi nộp sẽ không thể chỉnh sửa câu trả lời.')) return;
    var test = db.tests.find(function(t){return t.id===sub.testId;});
    if(test && test._stub){ this.showToast('Nội dung đề chưa tải xong, chưa thể nộp bài. Vui lòng thử lại.', 'error'); return; }
    if(this.examTimerInterval) clearInterval(this.examTimerInterval);
    this.stopExamGuard();
    var self = this;
    var hasAIQuestions = this.getSubQuestions(test, sub).some(function(q){ return q.type==='writingAuto' || q.type==='speaking'; });
    if(hasAIQuestions){
      var appEl = document.getElementById('app');
      if(appEl) appEl.innerHTML = '<div class="card" style="text-align:center;padding:40px"><h3>🤖 Đang chấm điểm tự động...</h3><div class="hint">Đang phân tích bài Writing/Speaking của bạn, vui lòng đợi trong giây lát.</div></div>';
    }
    this.runAutoAIGrading(test, sub).catch(function(){}).then(function(){
      var grade = self.computeAutoGrade(test, sub);
      sub.submitTime = Date.now();
      sub.autoScore = grade.autoScore;
      sub.maxScore = grade.maxScore;
      sub.manualScores = {};
      sub.status = grade.needsManual ? 'awaiting-manual' : 'graded';
      sub.finalScore = grade.needsManual ? null : grade.autoScore;
      DB.save();
      self.syncSubmissionToCloud(sub);
      if(grade.autoMaxScore>0){ self.bumpProgress(sub.studentId, grade.autoScore/grade.autoMaxScore); }
      if(isAuto) alert('Đã hết giờ làm bài. Bài của bạn đã được tự động nộp.');
      self.goto('studentResultDetail', {submissionId:submissionId});
    });
  },

  getStudentStats:function(studentId){
    var db = DB.get();
    var subs = db.submissions.filter(function(s){return s.studentId===studentId && s.status!=='in-progress';});
    subs = subs.slice().sort(function(a,b){return (a.submitTime||0)-(b.submitTime||0);});
    var gradedSubs = subs.filter(function(s){return s.status==='graded' && s.maxScore>0;});
    var avgPct = gradedSubs.length ? gradedSubs.reduce(function(sum,s){return sum+(s.finalScore/s.maxScore);},0)/gradedSubs.length : null;
    var totalMinutes = subs.reduce(function(sum,s){return sum+Math.max(0,((s.submitTime||s.startTime)-s.startTime))/60000;},0);
    var byCategory = {};
    gradedSubs.forEach(function(s){
      var test = db.tests.find(function(t){return t.id===s.testId;});
      if(!test) return;
      var cat = test.subject;
      if(!byCategory[cat]) byCategory[cat] = {sum:0,count:0};
      byCategory[cat].sum += s.finalScore/s.maxScore;
      byCategory[cat].count += 1;
    });
    var catStats = Object.keys(byCategory).map(function(id){
      return {cat:getCategory(id), pct: byCategory[id].sum/byCategory[id].count};
    }).sort(function(a,b){return b.pct-a.pct;});
    var timeline = gradedSubs.slice(-10).map(function(s){
      var test = db.tests.find(function(t){return t.id===s.testId;});
      return {date:s.submitTime, pct:s.finalScore/s.maxScore, title: test?test.title:''};
    });
    return {completed:subs.length, avgPct:avgPct, totalMinutes:totalMinutes, catStats:catStats, timeline:timeline};
  },
  accuracyLabel:function(pct){
    if(pct===null||pct===undefined) return {text:'Chưa có dữ liệu', cls:'badge-gray'};
    if(pct>=0.85) return {text:'↑ Xuất sắc', cls:'badge-green'};
    if(pct>=0.7) return {text:'↑ Khá tốt', cls:'badge-green'};
    if(pct>=0.5) return {text:'→ Cần cố gắng thêm', cls:'badge-yellow'};
    return {text:'↓ Cần cải thiện', cls:'badge-red'};
  },
  saveStudentTarget:function(e){
    e.preventDefault();
    var f = e.target;
    var db = DB.get();
    var stu = db.students.find(function(s){return s.id===this.state.user.id;}.bind(this));
    if(!stu) return false;
    stu.targetLabel = f.targetLabel.value.trim();
    stu.targetDate = f.targetDate.value ? new Date(f.targetDate.value).getTime() : null;

    this.showToast('🎯 Đã lưu mục tiêu học tập!', 'success');

  renderProfileLineChart:function(timeline){
    if(timeline.length<2){
      return '<div class="empty-state">Làm thêm ít nhất 2 bài (được chấm điểm) để xem biểu đồ tiến bộ nhé!</div>';
    }
    var w=560, h=160, pad=24;
    var stepX = (w-2*pad)/(timeline.length-1);
    var pts = timeline.map(function(t,i){
      var x = pad + i*stepX;
      var y = pad + (1-t.pct)*(h-2*pad);
      return {x:x,y:y,pct:t.pct};
    });
    var pathD = pts.map(function(p,i){ return (i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1); }).join(' ');
    var areaD = pathD+' L'+pts[pts.length-1].x.toFixed(1)+' '+(h-pad)+' L'+pts[0].x.toFixed(1)+' '+(h-pad)+' Z';
    var dots = pts.map(function(p){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" fill="var(--primary)"></circle>'; }).join('');
    var labels = pts.map(function(p){ return '<text x="'+p.x.toFixed(1)+'" y="'+(p.y-10)+'" font-size="11" text-anchor="middle" fill="var(--text-muted)">'+Math.round(p.pct*100)+'%</text>'; }).join('');
    return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;max-width:600px" preserveAspectRatio="xMidYMid meet">'+
      '<path d="'+areaD+'" fill="var(--primary-light)" stroke="none"></path>'+
      '<path d="'+pathD+'" fill="none" stroke="var(--primary)" stroke-width="2.5"></path>'+
      dots+labels+
    '</svg>';
  },
  renderProfileCatBars:function(catStats){
    if(!catStats.length){
      return '<div class="empty-state">Làm bài ở nhiều môn/chứng chỉ khác nhau để xem điểm mạnh yếu theo từng mục nhé!</div>';
    }
    return catStats.map(function(cs){
      var pct = Math.round(cs.pct*100);
      return '<div class="catbar-row">'+
        '<div class="catbar-label">'+cs.cat.icon+' '+esc(cs.cat.name)+'</div>'+
        '<div class="catbar-track"><div class="catbar-fill" style="width:'+pct+'%;background:'+cs.cat.color+'"></div></div>'+
        '<div class="catbar-pct">'+pct+'%</div>'+
      '</div>';
    }).join('');
  },

        '<span style="font-size:12px;min-width:34px;text-align:right">'+pct+'%</span>'+

  renderModelAnswer:function(q,test){

    }).join('');
    var celebrateHtml = '';
    if(sub.status==='graded' && sub.maxScore>0){
      var pct = sub.finalScore / sub.maxScore;

      ? '<div class="stat-card"><div class="num">'+sub.finalScore+' / '+sub.maxScore+'</div><div class="label">Điểm cuối cùng</div></div>'
      : '<div class="stat-card"><div class="num">'+sub.autoScore+' / '+sub.maxScore+'</div><div class="label">Điểm tạm tính (chờ chấm tự luận)</div></div>';

/* ============================================================
   Chuyen audio nhung base64 len Firebase Storage (them boi Claude).
   Chi hoat dong khi da dang nhap Admin Cloud (CloudDB.currentAdmin).
   Khong dong cham gi den logic goc phia tren - chi doc/ghi qua
   cac ham cong khai da co san: DB.get/save, CloudDB.uploadAudio.
   ============================================================ */
App.migrateAllAudioToCloud = function(){
  if(!isCloudConfigured()){ this.showToast('☁️ Cloud chưa được cấu hình.', 'error'); return; }
  if(!CloudDB.currentAdmin){ this.showToast('Bạn cần đăng nhập Admin Cloud trước khi chuyển audio.', 'error'); this.openCloudLoginModal(); return; }
  var db = DB.get();
  var targets = (db.tests||[]).filter(function(t){ return t.audio && t.audio.file && String(t.audio.file).indexOf('data:')===0; });
  if(targets.length===0){ this.showToast('Không có audio nhúng base64 nào cần chuyển — mọi thứ đã gọn nhẹ rồi.', 'info'); return; }
  if(!window.confirm('Sẽ chuyển '+targets.length+' file audio (đang nhúng base64 trong đề) lên Firebase Storage. Có thể mất vài phút. Tiếp tục?')) return;
  var self = this, i = 0, okCount = 0, failCount = 0;
  function next(){
    if(i>=targets.length){
      DB.save();
      self.showToast('✅ Hoàn tất: '+okCount+' audio đã chuyển lên Cloud'+(failCount?(', '+failCount+' lỗi (xem console)'):'')+'.', failCount?'error':'success');
      self.render();
      return;
    }
    var t = targets[i];
    self.showToast('⏳ ('+(i+1)+'/'+targets.length+') Đang chuyển audio đề "'+(t.title||t.id)+'"...', 'info');
    fetch(t.audio.file).then(function(res){ return res.blob(); }).then(function(blob){
      var ext = (blob.type||'').indexOf('mpeg')!==-1 ? 'mp3' : ((blob.type||'audio/mpeg').split('/')[1]||'mp3');
      var file = new File([blob], (t.id||'audio')+'.'+ext, {type: blob.type||'audio/mpeg'});
      return CloudDB.uploadAudio(file, t.id, null);
    }).then(function(url){
      t.audio.file = url; okCount++; i++; next();
    }).catch(function(err){
      if(window.console) console.error('Loi chuyen audio de '+t.id+':', err);
      failCount++; i++; next();
    });
  }
  next();
};

/* ============================================================
   Chuyen anh cau hoi nhung base64 (images/choiceImages trong
   db.bank va trong tung test.questions) len Firebase Storage.
   Gom trung: 1 anh giong het noi dung chi upload 1 lan, dung lai
   URL cho moi noi tham chieu toi no. Upload song song gioi han
   5 luong de khong qua tai. Them boi Claude.
   ============================================================ */
App.migrateAllImagesToCloud = function(){
  if(!isCloudConfigured()){ this.showToast('☁️ Cloud chưa được cấu hình.', 'error'); return; }
  if(!CloudDB.currentAdmin){ this.showToast('Bạn cần đăng nhập Admin Cloud trước khi chuyển ảnh.', 'error'); this.openCloudLoginModal(); return; }
  var db = DB.get();
  var uniqueMap = {};
  var refs = [];
  function scanArr(arr){
    if(!arr) return;
    for(var i=0;i<arr.length;i++){
      var v = arr[i];
      if(typeof v==='string' && v.indexOf('data:image')===0){
        refs.push({arr:arr, idx:i, dataUrl:v});
        if(!(v in uniqueMap)) uniqueMap[v] = null;
      }
    }
  }
  function scanQuestion(q){
    if(!q) return;
    scanArr(q.images);
    if(q.choiceImages){ for(var i=0;i<q.choiceImages.length;i++){ scanArr(q.choiceImages[i]); } }
  }
  (db.bank||[]).forEach(scanQuestion);
  (db.tests||[]).forEach(function(t){ (t.questions||[]).forEach(scanQuestion); });
  var uniqueUrls = Object.keys(uniqueMap);
  if(uniqueUrls.length===0){ this.showToast('Không có ảnh nhúng base64 nào cần chuyển — mọi thứ đã gọn nhẹ rồi.', 'info'); return; }
  if(!window.confirm('Sẽ chuyển '+uniqueUrls.length+' ảnh (đã gộp trùng, dùng chung cho nhiều câu hỏi/đề) lên Firebase Storage.\nCó thể mất khá lâu (vài phút đến vài chục phút tùy số lượng ảnh và tốc độ mạng) — đừng đóng tab trong lúc chạy.\nTiếp tục?')) return;
  var self = this, okCount=0, failCount=0, doneCount=0, nextIdx=0;
  var CONCURRENCY = 5;
  function extOf(durl){ var m=/^data:image\/([a-zA-Z0-9.+-]+);base64,/.exec(durl); var t=m?m[1]:'png'; if(t==='jpeg') t='jpg'; if(t==='svg+xml') t='svg'; return t; }
  function finishIfDone(){
    if(doneCount>=uniqueUrls.length){
      refs.forEach(function(r){ var nu=uniqueMap[r.dataUrl]; if(nu) r.arr[r.idx]=nu; });
      DB.save();
      self.showToast('✅ Hoàn tất: '+okCount+' ảnh đã chuyển lên Cloud'+(failCount?(', '+failCount+' lỗi — xem console'):'')+'.', failCount?'error':'success');
      self.render();
    }
  }
  function worker(){
    if(nextIdx>=uniqueUrls.length) return;
    var myIdx = nextIdx++;
    var durl = uniqueUrls[myIdx];
    fetch(durl).then(function(r){ return r.blob(); }).then(function(blob){
      var file = new File([blob], 'img_'+myIdx+'.'+extOf(durl), {type: blob.type||'image/png'});
      return CloudDB.uploadAudio(file, 'question-images', null);
    }).then(function(url){
      uniqueMap[durl] = url; okCount++;
    }).catch(function(err){
      if(window.console) console.error('Loi chuyen anh #'+myIdx+':', err);
      failCount++;
    }).then(function(){
      doneCount++;
      if(doneCount % 25===0 || doneCount===uniqueUrls.length){ self.showToast('⏳ Đã chuyển '+doneCount+'/'+uniqueUrls.length+' ảnh...', 'info'); }
      finishIfDone();
      worker();
    });
  }
  for(var w=0; w<CONCURRENCY && w<uniqueUrls.length; w++){ worker(); }
};
(function(){
  function addMigrateImagesButton(){
    if(document.getElementById('migrateImagesCloudBtn')) return;
    var btn = document.createElement('button');
    btn.id = 'migrateImagesCloudBtn';
    btn.type = 'button';
    btn.textContent = '☁️ Chuyển ảnh câu hỏi lên Cloud';
    btn.title = 'Chuyển toàn bộ ảnh câu hỏi đang nhúng base64 lên Firebase Storage (cần đăng nhập Admin Cloud trước) — đây là nguyên nhân chính khiến file/localStorage bị đầy';
    btn.style.cssText = 'position:fixed;bottom:64px;right:16px;z-index:99999;padding:10px 16px;background:#7c3aed;color:#fff;border:none;border-radius:8px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;font-weight:600;';
    btn.onclick = function(){ if(window.App && App.migrateAllImagesToCloud) App.migrateAllImagesToCloud(); };

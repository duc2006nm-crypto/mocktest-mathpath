<svg xmlns="http://www.w3.org/2000/svg" width="280" height="180" viewBox="0 0 280 180"><rect x="4" y="4" width="272" height="172" fill="#f8fafc" stroke="#334155" stroke-width="3"/><text x="140" y="40" font-size="20" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#0f172a">Head Teacher → Parents</text><line x1="20" y1="55" x2="260" y2="55" stroke="#94a3b8" stroke-width="2"/><text x="140" y="90" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#111827">Dear parents,</text><text x="140" y="114" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#111827">This Friday is non-uniform</text><text x="140" y="138" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#111827">day. Students can wear</text><text x="140" y="162" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#111827">their everyday clothes and</text><text x="140" y="186" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#111827">give money to charity.</text></svg>
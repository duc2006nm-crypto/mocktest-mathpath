<text x="26" y="80" font-size="14.5" fill="#111827" font-family="Arial">Kim's party starts at</text><text x="26" y="100" font-size="14.5" fill="#111827" font-family="Arial">8 p.m. but of course</text><text x="26" y="120" font-size="14.5" fill="#111827" font-family="Arial">you don't finish work</text><text x="26" y="140" font-size="14.5" fill="#111827" font-family="Arial">until 9. Shall we go</text><text x="26" y="160" font-size="14.5" fill="#111827" font-family="Arial">together at 9.30?</text><text x="26" y="180" font-size="14.5" fill="#111827" font-family="Arial">I'll pick you up.</text><text x="26" y="200" font-size="14.5" fill="#111827" font-family="Arial">Emma</text>

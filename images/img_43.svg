<svg xmlns="http://www.w3.org/2000/svg" width="260" height="280" viewBox="0 0 260 280"><rect x="10" y="10" width="240" height="260" rx="20" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/><circle cx="35" cy="35" r="14" fill="#0ea5e9"/><text x="35" y="40" font-size="14" text-anchor="middle" fill="#fff" font-family="Arial">A</text><text x="30" y="70" font-size="15" font-family="Arial, sans-serif" fill="#111827">Rachel</text><text x="30" y="94" font-size="15" font-family="Arial, sans-serif" fill="#111827">For our holiday, you need to</text><text x="30" y="118" font-size="15" font-family="Arial, sans-serif" fill="#111827">get a photo for your visa and</text><text x="30" y="142" font-size="15" font-family="Arial, sans-serif" fill="#111827">let me have it. I've got the</text><text x="30" y="166" font-size="15" font-family="Arial, sans-serif" fill="#111827">visa forms so I can post</text><text x="30" y="190" font-size="15" font-family="Arial, sans-serif" fill="#111827">them then.</text><text x="30" y="214" font-size="15" font-family="Arial, sans-serif" fill="#111827">Adam</text></svg>